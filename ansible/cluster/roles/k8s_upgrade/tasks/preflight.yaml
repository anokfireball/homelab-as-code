---
# Read-only checks (apart from adding the target minor's apt repository) and per-node planning facts:
#   kubeadm_needs_upgrade, kubelet_needs_upgrade, containerd_needs_upgrade,
#   containerd_config_needs_update, kube_vip_needs_update, node_needs_cycle
- name: gather installed versions
  include_role:
    name: k8s_cluster
    tasks_from: tasks/versions.yaml

- name: node is part of the cluster
  assert:
    that: installed_kubelet | length > 0
    fail_msg: "{{ inventory_hostname }} has no kubelet installed, bootstrap it with cluster.yaml"
    quiet: true

- name: add apt repository for the target kubernetes minor
  include_role:
    name: k8s_cluster
    tasks_from: tasks/repos.yaml

- name: refresh apt cache
  apt:
    update_cache: true
    # unattended-upgrades may hold the lock
    lock_timeout: 600

- name: look up available package versions
  command: apt-cache madison kubeadm kubelet kubectl cri-tools containerd.io
  register: apt_madison
  changed_when: false

- name: check whether the containerd config is current
  include_role:
    name: k8s_cluster
    tasks_from: tasks/containerd.yaml
  vars:
    containerd_config_check_only: true

- name: determine required work
  set_fact:
    kubelet_needs_upgrade: "{{ installed_kubelet != k8s_version }}"
    containerd_needs_upgrade: "{{ installed_containerd != containerd_version }}"
    containerd_config_needs_update: "{{ containerd_config.changed }}"
    kube_vip_needs_update: "{{ 'controlplane' in group_names and running_kube_vip != kube_vip_version }}"
    # control plane: static pods not at the target yet; workers: kubelet config follows the kubelet
    kubeadm_needs_upgrade: >-
      {{ (running_apiserver != 'v' ~ k8s_version) if 'controlplane' in group_names
         else (installed_kubelet != k8s_version) }}

- set_fact:
    node_needs_cycle: "{{ kubelet_needs_upgrade or containerd_needs_upgrade or containerd_config_needs_update }}"

- name: no downgrades, target packages available
  assert:
    that:
      - installed_kubelet is version(k8s_version, '<=')
      - installed_containerd is version(containerd_version, '<=')
      - ('kubeadm | ' ~ k8s_version ~ '-') in apt_madison.stdout
      - ('kubelet | ' ~ k8s_version ~ '-') in apt_madison.stdout
      - ('kubectl | ' ~ k8s_version ~ '-') in apt_madison.stdout
      - ('cri-tools | ' ~ k8s_minor ~ '.') in apt_madison.stdout
      - ('containerd.io | ' ~ containerd_version ~ '-') in apt_madison.stdout
    fail_msg: >-
      {{ inventory_hostname }}: downgrades are not supported (kubelet {{ installed_kubelet }} -> {{ k8s_version }},
      containerd {{ installed_containerd }} -> {{ containerd_version }}) or a pinned version is not available in apt
      (Docker's repo does not publish every containerd release).
    quiet: true

- name: cluster-wide checks
  run_once: true
  block:
    - include_tasks: cluster_version.yaml

    - name: version skew
      assert:
        that:
          - k8s_version is version(cluster_k8s_version, '>=')
          - k8s_version.split('.')[0] == cluster_k8s_version.split('.')[0]
          - (k8s_version.split('.')[1] | int) - (cluster_k8s_version.split('.')[1] | int) <= 1
        fail_msg: >-
          control plane runs {{ cluster_k8s_version }}, pinned is {{ k8s_version }}.
          kubeadm only upgrades one minor version at a time and never downgrades;
          roll out the intermediate minor versions first.
        quiet: true

    - name: containerd version is recommended for the target kubernetes minor
      vars:
        containerd_ok: >-
          {%- set ns = namespace(ok=false) -%}
          {%- for min in containerd_supported[k8s_minor] | default([]) -%}
          {%- if min.split('.')[:2] == containerd_version.split('.')[:2] and containerd_version is version(min, '>=') -%}
          {%- set ns.ok = true -%}
          {%- endif -%}
          {%- endfor -%}
          {{ ns.ok }}
      assert:
        that: containerd_ok | bool
        fail_msg: >-
          containerd {{ containerd_version }} is not listed for kubernetes {{ k8s_minor }}
          ({{ containerd_supported[k8s_minor] | default('no entry') }}), see containerd_supported in group_vars/all/versions.yaml
        quiet: true

    - include_tasks: health.yaml

    - name: preconditions inside the cluster
      delegate_to: localhost
      become: false
      environment:
        KUBECONFIG: "{{ upgrade_kubeconfig }}"
      block:
        - name: all nodes Ready
          command: >-
            kubectl get nodes
            -o jsonpath='{range .items[*]}{.metadata.name} {.status.conditions[?(@.type=="Ready")].status}{"\n"}{end}'
          register: preflight_nodes
          changed_when: false
          failed_when: preflight_nodes.rc != 0 or preflight_nodes.stdout_lines | reject('search', ' True$') | list | length > 0

        - name: read CloudNativePG clusters
          command: kubectl get clusters.postgresql.cnpg.io -A -o json
          register: preflight_cnpg
          changed_when: false

        - name: single-instance CloudNativePG clusters do not block drains
          vars:
            offenders: >-
              {{ (preflight_cnpg.stdout | from_json)['items']
                 | selectattr('spec.instances', 'equalto', 1)
                 | rejectattr('spec.enablePDB', 'sameas', false)
                 | map(attribute='metadata.name') | list }}
          assert:
            that: offenders | length == 0
            fail_msg: "set spec.enablePDB: false on single-instance CNPG clusters, their PDB blocks every drain: {{ offenders | join(', ') }}"
            quiet: true

        - name: read Longhorn node drain policy
          command: kubectl -n longhorn-system get settings.longhorn.io node-drain-policy -o jsonpath={.value}
          register: preflight_drain_policy
          changed_when: false

        - name: Longhorn moves last replicas off a node before it is drained
          assert:
            that: preflight_drain_policy.stdout == 'block-for-eviction-if-contains-last-replica'
            fail_msg: >-
              Longhorn node-drain-policy is '{{ preflight_drain_policy.stdout }}', draining would take
              single-replica volumes offline; set defaultSettings.nodeDrainPolicy in the Longhorn HelmRelease
            quiet: true

        - name: shed workloads exist
          shell: |
            missing=""
            check() { kubectl -n "$1" get "$2" "$3" >/dev/null 2>&1 || missing="$missing $2:$1/$3"; }
            {% for e in upgrade_shed %}
            check {{ e.namespace }} {{ upgrade_shed_resource[e.kind] }} {{ e.name }}
            {% if e.hr is defined %}
            check {{ e.namespace }} helmreleases.helm.toolkit.fluxcd.io {{ e.hr }}
            {% endif %}
            {% endfor %}
            if [ -n "$missing" ]; then echo "not found, fix upgrade_shed:$missing"; exit 1; fi
          changed_when: false

    - name: planned work
      vars:
        h: "{{ hostvars[item] }}"
        steps: >-
          {{ (['kube-vip ' ~ h.running_kube_vip ~ ' -> ' ~ kube_vip_version] if h.kube_vip_needs_update else [])
             + (['kubeadm upgrade'] if h.kubeadm_needs_upgrade else [])
             + (['drain'] if h.node_needs_cycle else [])
             + (['containerd ' ~ h.installed_containerd ~ ' -> ' ~ containerd_version] if h.containerd_needs_upgrade else [])
             + (['containerd config'] if h.containerd_config_needs_update else [])
             + (['kubelet ' ~ h.installed_kubelet ~ ' -> ' ~ k8s_version] if h.kubelet_needs_upgrade else []) }}
      debug:
        msg: "{{ item }}: {{ steps | join(', ') if steps else 'up to date' }}"
      loop: "{{ ansible_play_hosts }}"
