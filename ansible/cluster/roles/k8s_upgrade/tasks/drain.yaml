---
# Cordon the node, move what must not go down with it elsewhere, drain it.
# Shared by node_cycle.yaml (upgrade.yaml) and maintenance_cycle.yaml (maintenance.yaml); undone by uncordon.yaml.
- name: cordon and drain
  delegate_to: localhost
  become: false
  environment:
    KUBECONFIG: "{{ upgrade_kubeconfig }}"
  block:
    - name: cordon
      command: kubectl cordon {{ inventory_hostname }}
      register: cordon_result
      changed_when: "'already cordoned' not in cordon_result.stdout"

    # Longhorn share-manager pods tolerate every taint (incl. cordon); the Kyverno policy
    # longhorn-share-manager-avoid-draining-nodes keeps them off nodes with this label
    - name: mark node as draining
      command: kubectl label node {{ inventory_hostname }} homelab.io/draining=true --overwrite
      changed_when: false

    # a drain that finishes while this node holds a volume's only replica strands that data:
    # the instance-manager is gone before Longhorn can copy it
    - name: move a volume's last replica off the node before draining
      shell: |
        set -euo pipefail
        node={{ inventory_hostname | quote }}
        last=$(kubectl -n longhorn-system get replicas.longhorn.io -o json | jq -r --arg n "$node" '
          [.items[] | select(.spec.failedAt=="" and .spec.nodeID!="") | {v:.spec.volumeName, n:.spec.nodeID}]
          | group_by(.v)[] | select(length==1 and .[0].n==$n) | .[0].v')
        if [ -z "$last" ]; then exit 0; fi
        echo "last replica still here: $last"
        kubectl -n longhorn-system patch nodes.longhorn.io "$node" --type merge \
          -p '{"spec":{"evictionRequested":true}}' >/dev/null
        exit 1
      args:
        executable: /bin/bash
      register: last_replica
      retries: 60
      delay: 15
      until: last_replica.rc == 0
      changed_when: last_replica.stdout | length > 0

    - name: list pods on the node
      command: >-
        kubectl get pods -A --field-selector spec.nodeName={{ inventory_hostname }}
        -o jsonpath='{range .items[*]}{.metadata.namespace}/{.metadata.name}{"\n"}{end}'
      register: node_pods
      changed_when: false

    # restarted while the node is cordoned, so they come up elsewhere before the drain evicts them
    - name: move single-replica controllers and webhooks off the node
      shell: >-
        kubectl -n {{ item.namespace }} rollout restart deployment/{{ item.name }} &&
        kubectl -n {{ item.namespace }} rollout status deployment/{{ item.name }} --timeout=5m
      loop: "{{ upgrade_premove }}"
      loop_control:
        label: "{{ item.namespace }}/{{ item.name }}"
      when: >-
        node_pods.stdout_lines
        | select('match', '^' ~ item.namespace ~ '/' ~ item.name ~ '-[a-z0-9]+-[a-z0-9]{5}$')
        | list | length > 0
      changed_when: true

    - name: drain
      command: >-
        kubectl drain {{ inventory_hostname }}
        --ignore-daemonsets --delete-emptydir-data --timeout={{ upgrade_drain_timeout }}
      changed_when: true
