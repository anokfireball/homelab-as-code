---
# Control plane node (serial: 1): kube-vip, then kubeadm static pods. Kubelet/containerd follow in node_cycle.yaml.
- name: update kube-vip
  when: kube_vip_needs_update
  block:
    - include_role:
        name: k8s_cluster
        tasks_from: tasks/kube-vip.yaml
    - name: wait for kube-vip to run the new version
      command: >-
        kubectl -n kube-system get pod kube-vip-{{ inventory_hostname }}
        -o jsonpath='{.status.containerStatuses[0].image} {.status.containerStatuses[0].ready}'
      delegate_to: localhost
      become: false
      environment:
        KUBECONFIG: "{{ upgrade_kubeconfig }}"
      register: kube_vip_status
      retries: 30
      delay: 10
      until: kube_vip_status.rc == 0 and kube_vip_status.stdout is search(':' ~ kube_vip_version ~ ' true$')
      changed_when: false

    - include_tasks: health.yaml
      vars:
        health_etcd: false

- name: upgrade control plane components
  when: kubeadm_needs_upgrade
  block:
    - include_role:
        name: k8s_cluster
        tasks_from: tasks/packages.yaml
      vars:
        packages: "{{ k8s_pkg_kubeadm }}"

    - include_tasks: cluster_version.yaml

    # the first control plane node to get here upgrades the cluster, the others follow;
    # derived from the cluster state so that interrupted runs resume correctly
    - name: kubeadm upgrade apply
      command: kubeadm upgrade apply v{{ k8s_version }} --yes
      when: cluster_k8s_version != k8s_version
      changed_when: true

    - name: kubeadm upgrade node
      command: kubeadm upgrade node
      when: cluster_k8s_version == k8s_version
      changed_when: true

    # the previous node's replicas may still be rebuilding, and restarting the static pods briefly degrades more
    - include_tasks: health.yaml
      vars:
        health_longhorn_retries: "{{ upgrade_longhorn_healthy_retries }}"
