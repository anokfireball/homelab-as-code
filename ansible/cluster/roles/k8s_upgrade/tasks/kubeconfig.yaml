---
# Fetch admin.conf for all kubectl calls of upgrade.yaml. It targets the VIP and does not depend on
# Pinniped/Authentik, which can be unavailable while a worker is drained.
- name: fetch admin kubeconfig
  fetch:
    src: /etc/kubernetes/admin.conf
    dest: "{{ upgrade_kubeconfig }}"
    flat: true

- name: restrict admin kubeconfig permissions
  file:
    path: "{{ upgrade_kubeconfig }}"
    mode: "0600"
  delegate_to: localhost
  become: false
