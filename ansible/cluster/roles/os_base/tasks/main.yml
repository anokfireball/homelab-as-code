---
- name: set hostname
  hostname:
    name: "{{ inventory_hostname }}"
  notify: reboot

- name: update APT packages
  apt:
    upgrade: full
    update_cache: true
    cache_valid_time: 86400
    autoremove: true
    autoclean: true

- name: install common packages
  apt:
    pkg:
      - inxi
      - neovim
      - smartmontools
      - tmux
      - unattended-upgrades
      - update-notifier-common
      - yq  # https://github.com/kislyuk/yq since there are multiple with the same name...
    state: present

- name: remove default vim installations
  apt:
    pkg:
      - vim*
    state: absent

- name: create aliases for nvim
  file:
    src: /usr/bin/nvim
    dest: "/usr/local/bin/{{ item }}"
    state: link
  with_items:
    - vi
    - vim

- name: remove default MOTD
  block:
    - stat:
        path: /home/admin/.hushlogin
      register: hushlogin
    - file:
        path: /home/admin/.hushlogin
        owner: admin
        group: admin
        mode: "0640"
        state: touch
      when: not hushlogin.stat.exists

- name: display basic system information on SSH logon
  blockinfile:
    path: /home/admin/.bashrc
    # yamllint disable rule:line-length
    block: |
      if [[ -n $SSH_CONNECTION && -z "$TMUX" ]] ; then
        sudo inxi --color 2 --cpu --disk --ip --swap --memory-modules --machine --network-advanced --sensors --system --no-host --width 120 | grep -v "Output throttled." | grep -v "calic*" | grep -v "noprefixroute" | grep -v "1IET" | grep -v "VIRTUAL-DISK"
      fi
    # yamllint enable rule:line-length

- name: enable and configure unattended-upgrades
  lineinfile:
    path: "{{ item.path }}"
    create: true
    regexp: "^.*{{ item.key }} \".+\";$"
    line: "{{ item.key }} \"{{ item.value }}\";"
  with_items:
    - { path: "/etc/apt/apt.conf.d/10periodic", key: APT::Periodic::Download-Upgradeable-Packages, value: "1" }
    - { path: "/etc/apt/apt.conf.d/10periodic", key: "APT::Periodic::Update-Package-Lists", value: "1" }
    - { path: "/etc/apt/apt.conf.d/10periodic", key: "APT::Periodic::AutocleanInterval", value: "7" }
    - { path: "/etc/apt/apt.conf.d/20auto-upgrades", key: "APT::Periodic::Unattended-Upgrade", value: "1" }
    - { path: "/etc/apt/apt.conf.d/50unattended-upgrades", key: "Unattended-Upgrade::MinimalSteps", value: "true" }
    # nodes are rebooted drained, one at a time, with maintenance.yaml
    - { path: "/etc/apt/apt.conf.d/50unattended-upgrades", key: "Unattended-Upgrade::Automatic-Reboot", value: "false" }
  notify: restart unattended-upgrades
  tags: [unattended_upgrades]

# Timers: one fixed slot per node instead of the shared randomized window, and no catch-up after downtime
# (Persistent=true made nodes catch up on missed runs at the same time).
# apt-daily.service (download only) is a oneshot without a start timeout; a hung run blocks every
# apt-daily-upgrade.service run, which is ordered after it. apt-daily-upgrade.service gets no timeout:
# killing it mid-dpkg is unsafe.
# Only drop-ins are written; whether the units are enabled or masked is left alone.
- name: create apt systemd drop-in directories
  file:
    path: "/etc/systemd/system/{{ item }}.d"
    state: directory
    mode: "0755"
  loop: [apt-daily.timer, apt-daily-upgrade.timer, apt-daily.service]
  tags: [unattended_upgrades]

- name: stagger apt timers across nodes, bound apt-daily.service
  copy:
    dest: "/etc/systemd/system/{{ item.unit }}.d/override.conf"
    mode: "0644"
    content: "{{ item.content }}"
  loop:
    - unit: apt-daily.timer
      content: |
        [Timer]
        Persistent=false
    - unit: apt-daily-upgrade.timer
      content: |
        [Timer]
        OnCalendar=
        OnCalendar=*-*-* {{ '%02d' | format(unattended_upgrade_hour | int) }}:00:00
        RandomizedDelaySec=0
        Persistent=false
    - unit: apt-daily.service
      content: |
        [Service]
        TimeoutStartSec=1h
  loop_control:
    label: "{{ item.unit }}"
  vars:
    unattended_upgrade_hour: >-
      {{ (unattended_upgrade_base_hour | int
          + groups['cluster'].index(inventory_hostname) * unattended_upgrade_hour_spacing | int) % 24 }}
  notify: daemon-reload
  tags: [unattended_upgrades]

- name: check SWAP
  command: swapon -s
  changed_when: false
  register: swap

- name: disable SWAP (temporarily)
  command: swapoff -a
  when: swap.stdout | length > 0
  changed_when: true

- name: disable SWAP (permanently)
  replace:
    path: /etc/fstab
    regexp: '^([^#].*\s+swap\s+sw\s+.*)$'
    replace: '# \1'
  notify: reboot

- name: get SWAP file name
  shell: |
    set -o pipefail
    grep -e "^#.*[[:space:]]swap[[:space:]]sw[[:space:]].*$" /etc/fstab | awk '{print $2}'
  args:
    executable: /bin/bash
  register: swap_file
  changed_when: false

- name: remove SWAP file
  file:
    path: "{{ swap_file.stdout }}"
    state: absent

- name: increase number of inotify handles
  sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    reload: true
  with_items:
    - { name: fs.inotify.max_user_instances, value: 8192 }
    - { name: fs.inotify.max_user_watches, value: 65536 }

- name: schedule daily short smart drive test for all drives
  copy:
    dest: /etc/cron.daily/smart-test
    mode: "0755"
    content: |
      #!/bin/sh
      if [ -b /dev/sda ]; then
        smartctl --test=short /dev/sda
      fi
      if [ -b /dev/nvme0n1 ]; then
        smartctl --test=short /dev/nvme0n1
      fi

- name: schedule weekly extended smart drive test for all drives
  copy:
    dest: /etc/cron.weekly/smart-test
    mode: "0755"
    content: |
      #!/bin/sh
      if [ -b /dev/sda ]; then
        smartctl --test=long /dev/sda
      fi
      if [ -b /dev/nvme0n1 ]; then
        smartctl --test=long /dev/nvme0n1
      fi

# https://lore.kernel.org/all/20241019-xtables-typos-v2-1-6b8b1735dc8e@0upti.me/
# https://bugs.launchpad.net/kernel-sru-workflow/+bug/2102529
- name: blacklist incompatible kernels
  copy:
    dest: /etc/apt/preferences.d/block-kernel
    content: |
      Package: linux-image-6.8.0-56-generic
      Pin: version *
      Pin-Priority: -1

      Package: linux-image-6.8.0-57-generic
      Pin: version *
      Pin-Priority: -1

- name: update apt cache to make sure kernel is blacklisted
  apt:
    update_cache: true

- name: install latest non-blacklisted kernel
  apt:
    pkg: linux-image-generic
    state: present
  notify:
    - update grub
    - reboot

- name: uninstall specific pinned kernels
  apt:
    pkg:
      - linux-image-6.8.0-55-generic
      - linux-image-6.8.0-56-generic
      - linux-image-6.8.0-57-generic
    state: absent
  notify:
    - update grub
    - reboot

- meta: flush_handlers
