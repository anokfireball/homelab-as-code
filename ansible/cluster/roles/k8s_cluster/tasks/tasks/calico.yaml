---
# Server-side apply: the CRD bundle exceeds the client-side last-applied annotation limit, and
# new releases add CRDs that `kubectl replace` cannot create (the procedure Calico documents for upgrades).
- name: create calico config directory
  file:
    path: /etc/calico
    state: directory

- name: download calico operator CRDs
  get_url:
    url: |
      https://raw.githubusercontent.com/projectcalico/calico/{{ calico_version }}/manifests/operator-crds.yaml
    dest: /etc/calico/operator-crds.yaml
  register: calico_crds_manifest

- name: apply calico operator CRDs
  command: kubectl apply --server-side --force-conflicts -f /etc/calico/operator-crds.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: calico_crds_apply
  changed_when: calico_crds_apply.stdout is search('(created|configured)')

- name: download calico operator manifest
  get_url:
    url: |
      https://raw.githubusercontent.com/projectcalico/calico/{{ calico_version }}/manifests/tigera-operator.yaml
    dest: /etc/calico/tigera-operator.yaml
  register: calico_operator_manifest

- name: apply calico operator manifest
  command: kubectl apply --server-side --force-conflicts -f /etc/calico/tigera-operator.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: calico_operator_apply
  changed_when: calico_operator_apply.stdout is search('(created|configured)')

- name: copy calico custom resource manifest
  template:
    src: custom-resources.yaml.j2
    dest: /etc/calico/custom-resources.yaml
  register: calico_custom_resource_manifest

- name: check  if calico custom resource already exists
  shell: |
    set -o pipefail
    kubectl get installations -o json | jq ".items | length"
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: calico_custom_resource_exists
  ignore_errors: true
  changed_when: calico_custom_resource_exists.stdout == '0'

- name: apply custom calico resource manifest
  command: |
    kubectl {{ 'create' if calico_custom_resource_exists.stdout == '0' else 'replace' }} -f /etc/calico/custom-resources.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  changed_when: calico_custom_resource_exists.stdout == '0' or calico_custom_resource_manifest.changed

# Every systemd-networkd restart (systemd/netplan upgrades) briefly removes the DHCP address from eth0, and the
# kernel drops all IPv4 routes on it, Felix's routes to the other nodes' pod blocks included. Felix only puts them
# back on its route refresh: measured 88-96s at the default 90s, 4-6s at 10s. FelixConfiguration "default" is
# created by the operator, so patch the one field instead of owning the resource.
- name: shorten felix route refresh interval
  command: >-
    kubectl patch felixconfigurations.projectcalico.org default --type merge
    -p '{"spec":{"routeRefreshInterval":"{{ calico_route_refresh_interval }}"}}'
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: calico_felix_patch
  # on a fresh cluster the operator and the Calico API server need a moment to create it
  retries: 30
  delay: 10
  until: calico_felix_patch.rc == 0
  changed_when: "'(no change)' not in calico_felix_patch.stdout"
