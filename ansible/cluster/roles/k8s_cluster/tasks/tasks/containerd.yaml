---
# Render the containerd config for the pinned containerd major version.
# Does not restart containerd; callers decide when that is safe.
# vars:
#   containerd_config_check_only: only report whether the config would change
- name: ensure /etc/containerd directory exists
  file:
    path: /etc/containerd
    state: directory
    mode: "0755"
  check_mode: "{{ containerd_config_check_only | default(false) }}"

- name: render containerd config
  template:
    src: "{{ containerd_config_template }}"
    dest: /etc/containerd/config.toml
    mode: "0644"
  check_mode: "{{ containerd_config_check_only | default(false) }}"
  register: containerd_config
