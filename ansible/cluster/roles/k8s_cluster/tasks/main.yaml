---
- name: reset cluster
  when: reset_cluster and reset_confirmation == "i-am-sure"
  block:
    - name: kubeadm reset
      command: kubeadm reset -f
      throttle: 1
      register: reset_result
      retries: 1
      until: reset_result.rc == 0
      changed_when: true
      failed_when: reset_result.rc != 0 and reset_result.attempts|default(1) == 3

    - name: remove k8s-related folders
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/kubernetes
        - /var/lib/kubelet
        - /root/.kube

    - name: check if VIP is assigned
      command: ip addr show to {{ vip }}/32 dev eth0
      register: ip_addr_show_result
      changed_when: false
      failed_when: false

    - name: remove VIP from interface
      command: ip addr del {{ vip }}/32 dev eth0
      when: ip_addr_show_result.stdout_lines | length > 0
      changed_when: true

- name: check if node is part of the cluster
  stat:
    path: /etc/kubernetes/kubelet.conf
  register: kubelet_conf_stat

- set_fact:
    k8s_join: "{{ not kubelet_conf_stat.stat.exists }}"

- import_tasks: tasks/versions.yaml

# cluster.yaml never changes versions of running nodes (that would restart runtimes cluster-wide
# without draining); upgrade.yaml rolls them node by node instead
- name: verify existing node matches pinned versions
  when: not k8s_join
  block:
    - import_tasks: tasks/containerd.yaml
      vars:
        containerd_config_check_only: true

    - assert:
        that:
          - installed_kubelet == k8s_version
          - installed_kubeadm == k8s_version
          - installed_containerd == containerd_version
          - not containerd_config.changed
          - "'controlplane' not in group_names or running_kube_vip == kube_vip_version"
        fail_msg: >-
          {{ inventory_hostname }} does not match the pinned versions
          (kubelet {{ installed_kubelet }} -> {{ k8s_version }},
          kubeadm {{ installed_kubeadm }} -> {{ k8s_version }},
          containerd {{ installed_containerd }} -> {{ containerd_version }},
          containerd config outdated: {{ containerd_config.changed }},
          kube-vip {{ running_kube_vip | default('-', true) }} -> {{ kube_vip_version }}).
          Run upgrade.yaml first.
        quiet: true

- import_tasks: tasks/network.yaml

- import_tasks: tasks/repos.yaml

- name: install pinned runtime and kubernetes packages on new nodes
  when: k8s_join
  block:
    - include_tasks: tasks/packages.yaml
      vars:
        packages: "{{ k8s_pkg_containerd }}"
        packages_allow_downgrade: true

    - set_fact:
        containerd_package_changed: "{{ packages_result.changed }}"

    - import_tasks: tasks/containerd.yaml

    - name: restart containerd
      systemd_service:
        name: containerd
        state: restarted
        enabled: true
      when: containerd_package_changed or containerd_config.changed

    - when: "'controlplane' in group_names"
      import_tasks: tasks/kube-vip.yaml

    - include_tasks: tasks/packages.yaml
      vars:
        packages: "{{ k8s_pkg_kubeadm + k8s_pkg_kubelet }}"
        packages_allow_downgrade: true

- import_tasks: tasks/kubelet.yaml

- import_tasks: join.yaml

- when: "'controlplane' in group_names"
  block:
    - import_tasks: tasks/certs.yaml

- import_tasks: tasks/calico.yaml
  when: inventory_hostname == "controlplane1"
