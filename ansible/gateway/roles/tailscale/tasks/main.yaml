- name: Remove legacy one-line Tailscale sources
  file:
    path: "/etc/apt/sources.list.d/{{ item }}"
    state: absent
  loop:
    - tailscale.list
    - tailscale.list.disabled
  register: tailscale_legacy_sources

- name: Add Tailscale repository
  ansible.builtin.deb822_repository:
    name: tailscale
    types: deb
    uris: https://pkgs.tailscale.com/stable/ubuntu
    suites: "{{ ansible_facts['distribution_release'] }}"
    components:
      - main
    signed_by: "https://pkgs.tailscale.com/stable/ubuntu/{{ ansible_facts['distribution_release'] }}.noarmor.gpg"
    state: present
  register: tailscale_repo

- name: Update apt cache
  apt:
    update_cache: true
  when: tailscale_repo.changed or tailscale_legacy_sources.changed

- name: Install Tailscale
  apt:
    name: tailscale
    state: present

- name: Enable and start Tailscale service
  service:
    name: tailscaled
    enabled: true
    state: started

- name: Check if Tailscale is already connected
  command: tailscale status --json
  register: tailscale_status
  failed_when: false
  changed_when: false

- name: Authenticate Tailscale if not already connected
  command: tailscale login --advertise-tags="tag:wan" --authkey={{ tailscale_authkey }}
  when: "'NeedsLogin' in tailscale_status.stdout"
  register: tailscale_login

- name: Ensure Tailscale is started
  command: tailscale up
  when: "'\"BackendState\": \"Running\"' not in tailscale_status.stdout"
