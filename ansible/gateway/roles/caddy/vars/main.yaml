go_version: 1.27.2
caddy_version: v2.11.7
caddy_cloudflare_version: v0.2.4
caddy_netcup_version: v1.0.0
caddy_porkbun_version: v0.3.1

# DNS provider secrets are passed to Caddy via systemd LoadCredential= so they
# never land in the world-readable Caddyfile. Sources are root-only; systemd
# exposes them to the caddy user under caddy_credentials_dir at service start.
caddy_credentials_source_dir: /etc/caddy/credentials
caddy_credentials_dir: /run/credentials/caddy.service
caddy_credentials:
  - cloudflare_api_token
  - netcup_customer_number
  - netcup_api_key
  - netcup_api_password
  - porkbun_api_key
  - porkbun_api_secret_key

caddy_revserse_proxies:
  - subdomain: bitwarden
    tailnet_node: homelab-bitwarden
    port: 80
  - subdomain: freshrss
    tailnet_node: homelab-freshrss
    port: 80
  - subdomain: nextcloud
    tailnet_node: homelab-nextcloud
    port: 8080
  - subdomain: immich
    tailnet_node: homelab-immich
    port: 2283
  - subdomain: n8n
    tailnet_node: homelab-n8n
    port: 5678
  - subdomain: paperless
    tailnet_node: homelab-paperless
    port: 8000

caddy_reverse_proxies_ext:
  - subdomain: links
    tailnet_node: homelab-homepage-ext
    port: 3000
