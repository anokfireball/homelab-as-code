---
name: Validate

on:
  pull_request:
    branches: ["main"]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Decides once which checks the PR's files call for. Every check job below is
  # skipped at job level (no runner, no checkout) when its group is empty, and
  # CI - Success treats a skipped job as a pass. The action reads the file list
  # from the API, so this job needs no checkout.
  changes:
    name: Changed Paths
    runs-on: ubuntu-latest
    outputs:
      flux: ${{ steps.groups.outputs.flux }}
      images: ${{ steps.groups.outputs.images }}
      renovate: ${{ steps.groups.outputs.renovate }}
      ansible: ${{ steps.groups.outputs.ansible }}
      workflows: ${{ steps.groups.outputs.workflows }}
      scripts: ${{ steps.groups.outputs.scripts }}
      envoy: ${{ steps.groups.outputs.envoy }}
    steps:
      - uses: bjw-s-labs/action-changed-files@147be9638332cf68fd60714a610509d7a9360d60 # v0.7.0
        id: changed-files
        with:
          patterns: "**"
          # Removing a manifest can break the rendered graph (dependsOn,
          # references), so deletions count.
          include_deleted_files: true
      - id: groups
        name: Group the changed files by the checks they gate
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.changed_files }}
          EVENT: ${{ github.event_name }}
        # Each group lists what the check actually consumes, including the
        # check's own definition where editing it can change the outcome. A
        # script or pin edit that the check cannot exercise (images and the
        # advisory diffs read only flux/**/*.yaml) is deliberately absent.
        # The action only lists files for pull_request/push; on merge_group and
        # workflow_dispatch it returns nothing, which would skip every check and
        # pass vacuously, so those events run everything.
        run: |
          files="$(jq -r '.[]' <<<"$CHANGED_FILES")"
          group() { # $1 = output name, $2 = ERE matched against repo-relative paths
            if [ "$EVENT" != pull_request ] || grep -Eq "$2" <<<"$files"; then
              echo "$1=true"
            else
              echo "$1=false"
            fi
          }
          {
            group flux '^(flux|charts)/|^\.github/workflows/validate\.yaml$|^\.github/scripts/retry-on-rate-limit\.sh$'
            group images '^flux/.*\.yaml$'
            group renovate '^renovate\.json$|^\.github/workflows/validate\.yaml$'
            group ansible '^ansible/'
            group workflows '^\.github/workflows/'
            group scripts '^\.github/scripts/'
            group envoy '^flux/system/(app-controllers|app-configs)/envoy-gateway\.yaml$|^\.github/scripts/envoy-proxy-compat\.sh$'
          } | tee -a "$GITHUB_OUTPUT"

  flux:
    name: Flux Render
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.flux == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
      - name: Install flate
        run: go install github.com/home-operations/flate/cmd/flate@v0.6.5
      - name: Render and validate the Flux graph
        # ghcr.io intermittently answers a chart pull with HTTP 429 (the header
        # of the script has the details) and flate does not retry that status.
        # Re-run on that signature only, so any other failure still fails on
        # the first try. /tmp/flate.log ends up holding the final attempt,
        # which is what the drift gate below greps.
        run: |
          .github/scripts/retry-on-rate-limit.sh /tmp/flate.log -- \
            "$(go env GOPATH)/bin/flate" test all --path . \
              --allow-missing-secrets --no-progress
      - name: Canary the values-drift warning
        # The drift gate greps flate's output for a human-readable warning and
        # flate exits 0 when it emits it, so a reworded warning would disable
        # the gate silently. Inject a key no chart consumes into a throwaway
        # copy and require the warning to appear.
        run: |
          canary="$RUNNER_TEMP/drift-canary"
          rm -rf "$canary"
          cp -a . "$canary"
          python3 - "$canary/flux/apps/jellyfin.yaml" <<'PY'
          import sys
          p = sys.argv[1]
          s = open(p).read()
          assert "    ingress:" in s, f"canary anchor missing in {p}"
          open(p, "w").write(s.replace("    ingress:", "    canaryUnusedKey: 1\n    ingress:", 1))
          PY
          if "$(go env GOPATH)/bin/flate" test all --path "$canary" -n arrchive \
               --allow-missing-secrets --no-progress 2>&1 \
             | grep -q "values not used by the chart"; then
            echo "Canary OK: the drift gate's warning string is still emitted."
          else
            echo "::error::flate no longer emits 'values not used by the chart'."
            echo "::error::The 'Fail on Helm values drift' gate is now inert - update its grep."
            exit 1
          fi
      - name: Fail on Helm values drift
        run: |
          if grep -q "values not used by the chart" /tmp/flate.log; then
            echo "::error::A HelmRelease sets values the chart no longer consumes."
            grep -A3 "values not used by the chart" /tmp/flate.log
            exit 1
          fi

  renovate-config:
    name: Renovate Config
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.renovate == 'true' }}
    # The validator ships inside the renovate package; the standalone npm
    # package `renovate-config-validator` is a 0.0.1 placeholder with no bin,
    # so npx cannot resolve an executable at all. The published image runs the
    # same binary the cluster runs, and Renovate's github-actions manager
    # keeps `container.image` current.
    container:
      image: ghcr.io/renovatebot/renovate:44.190.2@sha256:a1fa316d623c6a48a366ad84a8513777706ba5b471f27b531a547bffa13e424b
      options: --user root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # `--no-global` is a correctness requirement, not extra strictness.
      # renovate.json is this repo's *repo* config. The cluster's self-hosted
      # global config is a different file: flux/system/app-controllers/
      # renovate.yaml mounts `/config/config.json` from the `renovate-config`
      # Secret via extraVolumes. Given a filename the validator defaults to
      # global mode, which accepts a self-hosted-only option that Renovate
      # would reject in a repo config (verified: `binarySource` here passes
      # global mode and fails repo mode). Both modes catch ordinary defects
      # such as a bogus customManager field identically.
      - run: renovate-config-validator --no-global renovate.json

  ansible:
    name: Ansible Syntax
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.ansible == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install ansible and declared collections
        run: |
          pipx install --include-deps ansible
          # `--include-apps` is required, otherwise ansible-lint is injected
          # into the venv but never exposed on PATH.
          pipx inject --include-apps ansible ansible-lint
          # One invocation per requirements file: `ansible-galaxy collection
          # install -r a -r b` silently honours only the last -r.
          ansible-galaxy collection install --force \
            -r ansible/cluster/requirements.yaml -p /tmp/hac-collections
          ansible-galaxy collection install --force \
            -r ansible/gateway/requirements.yaml -p /tmp/hac-collections
      - name: Syntax check
        # Resolve only against the declared collections, so an undeclared one
        # fails here instead of passing on the runner image's bundled copies.
        env:
          ANSIBLE_COLLECTIONS_PATH: /tmp/hac-collections
        run: ansible-lint --nocolor --format=pep8 --tags syntax-check ansible/

  workflow-lint:
    name: Workflow Lint
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.workflows == 'true' || needs.changes.outputs.scripts == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - if: ${{ needs.changes.outputs.workflows == 'true' }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
      - if: ${{ needs.changes.outputs.workflows == 'true' }}
        name: Lint workflow files
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint"
      - if: ${{ needs.changes.outputs.scripts == 'true' }}
        name: Lint shell scripts
        # actionlint's shellcheck integration only covers `run:` blocks inside
        # workflow YAML, so standalone scripts would otherwise go unchecked.
        # No `-S` threshold on purpose: actionlint invokes shellcheck with
        # `--norc -f json -x --shell <sh> -e SC1091,...` and no severity floor,
        # so it fails on info-level findings too (verified: SC2086:info in a
        # `run:` block exits 1). Passing `-S warning` here would make
        # standalone scripts laxer than inline ones, not more consistent.
        run: |
          docker run --rm -v "$PWD:/mnt:ro" -w /mnt \
            koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d \
            .github/scripts/*.sh

  images:
    name: Image Refs
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.images == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # image-refs.sh diffs the changed files against the PR base commit.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
      - name: Install crane
        run: go install github.com/google/go-containerregistry/cmd/crane@v0.22.1
      - name: Verify introduced image references
        # Only the refs this PR introduces: 33 of the repo's rendered refs live
        # on docker.io, whose anonymous pull limit is shared per runner IP, so
        # re-verifying every ref on every PR would flake.
        run: |
          gopath="$(go env GOPATH)"
          export PATH="$gopath/bin:$PATH"
          .github/scripts/image-refs.sh "${{ github.event.pull_request.base.sha }}" >/tmp/refs.txt
          if [ ! -s /tmp/refs.txt ]; then
            echo "No image references introduced."
            exit 0
          fi
          .github/scripts/image-verify.sh </tmp/refs.txt

  envoy-proxy:
    name: Envoy Proxy Compat
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.envoy == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Envoy override matches the gateway-helm Envoy minor
        # A gateway-helm minor bump cannot merge until the EnvoyProxy image
        # override moves to that release's Envoy minor (or is deleted).
        run: .github/scripts/envoy-proxy-compat.sh

  success:
    name: CI - Success
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs: [changes, flux, renovate-config, ansible, workflow-lint, images, envoy-proxy]
    steps:
      - name: Fail on changes not success
        # Dependents of a failed `changes` are skipped, which the checks below
        # accept; without this a broken path detection would pass vacuously.
        if: ${{ needs.changes.result != 'success' }}
        run: exit 1
      - name: Fail on flux not success or skipped
        if: ${{ !(needs.flux.result == 'success' || needs.flux.result == 'skipped') }}
        run: exit 1
      - name: Fail on renovate-config not success or skipped
        if: ${{ !(needs.renovate-config.result == 'success' || needs.renovate-config.result == 'skipped') }}
        run: exit 1
      - name: Fail on ansible not success or skipped
        if: ${{ !(needs.ansible.result == 'success' || needs.ansible.result == 'skipped') }}
        run: exit 1
      - name: Fail on workflow-lint not success or skipped
        if: ${{ !(needs.workflow-lint.result == 'success' || needs.workflow-lint.result == 'skipped') }}
        run: exit 1
      - name: Fail on images not success or skipped
        if: ${{ !(needs.images.result == 'success' || needs.images.result == 'skipped') }}
        run: exit 1
      - name: Fail on envoy-proxy not success or skipped
        if: ${{ !(needs.envoy-proxy.result == 'success' || needs.envoy-proxy.result == 'skipped') }}
        run: exit 1
      - run: echo "All checks passed or skipped"
