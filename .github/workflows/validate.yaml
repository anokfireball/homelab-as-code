---
name: Validate

on:
  pull_request:
    branches: ["main"]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flux:
    name: Flux Render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: bjw-s-labs/action-changed-files@a9a36fb08ce06db9b02fbd8026cc2c0945eb9841 # v0.6.0
        id: changed-files
        with:
          patterns: |
            flux/**
            charts/**
      - if: ${{ steps.changed-files.outputs.changed_files != '[]' }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
      - if: ${{ steps.changed-files.outputs.changed_files != '[]' }}
        name: Install flate
        run: go install github.com/home-operations/flate/cmd/flate@v0.6.5
      - if: ${{ steps.changed-files.outputs.changed_files != '[]' }}
        name: Render and validate the Flux graph
        run: |
          set -o pipefail
          "$(go env GOPATH)/bin/flate" test all --path . \
            --allow-missing-secrets --no-progress 2>&1 | tee /tmp/flate.log
      - if: ${{ steps.changed-files.outputs.changed_files != '[]' }}
        name: Canary the values-drift warning
        # The drift gate greps flate's output for a human-readable warning and
        # flate exits 0 when it emits it, so a reworded warning would disable
        # the gate silently. Inject a key no chart consumes into a throwaway
        # copy and require the warning to appear.
        run: |
          canary="$RUNNER_TEMP/drift-canary"
          rm -rf "$canary"
          cp -a . "$canary"
          python3 - "$canary/flux/apps/jellyfin.yaml" <<'PY'
          import sys
          p = sys.argv[1]
          s = open(p).read()
          assert "    ingress:" in s, f"canary anchor missing in {p}"
          open(p, "w").write(s.replace("    ingress:", "    canaryUnusedKey: 1\n    ingress:", 1))
          PY
          if "$(go env GOPATH)/bin/flate" test all --path "$canary" -n arrchive \
               --allow-missing-secrets --no-progress 2>&1 \
             | grep -q "values not used by the chart"; then
            echo "Canary OK: the drift gate's warning string is still emitted."
          else
            echo "::error::flate no longer emits 'values not used by the chart'."
            echo "::error::The 'Fail on Helm values drift' gate is now inert - update its grep."
            exit 1
          fi
      - if: ${{ steps.changed-files.outputs.changed_files != '[]' }}
        name: Fail on Helm values drift
        run: |
          if grep -q "values not used by the chart" /tmp/flate.log; then
            echo "::error::A HelmRelease sets values the chart no longer consumes."
            grep -A3 "values not used by the chart" /tmp/flate.log
            exit 1
          fi

  renovate-config:
    name: Renovate Config
    runs-on: ubuntu-latest
    # The validator ships inside the renovate package; the standalone npm
    # package `renovate-config-validator` is a 0.0.1 placeholder with no bin,
    # so npx cannot resolve an executable at all. The published image runs the
    # same binary the cluster runs, and Renovate's github-actions manager
    # keeps `container.image` current.
    container:
      image: ghcr.io/renovatebot/renovate:44.59.2@sha256:05ea584fab6b757a2a806bdb24b808daae2b69a6ea222c724dd23dab1469ba36
      options: --user root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # `--no-global` is a correctness requirement, not extra strictness.
      # renovate.json is this repo's *repo* config. The cluster's self-hosted
      # global config is a different file: flux/system/app-controllers/
      # renovate.yaml mounts `/config/config.json` from the `renovate-config`
      # Secret via extraVolumes. Given a filename the validator defaults to
      # global mode, which accepts a self-hosted-only option that Renovate
      # would reject in a repo config (verified: `binarySource` here passes
      # global mode and fails repo mode). Both modes catch ordinary defects
      # such as a bogus customManager field identically.
      - run: renovate-config-validator --no-global renovate.json

  ansible:
    name: Ansible Syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: bjw-s-labs/action-changed-files@a9a36fb08ce06db9b02fbd8026cc2c0945eb9841 # v0.6.0
        id: changed-files
        with:
          patterns: ansible/**
      - if: ${{ steps.changed-files.outputs.changed_files != '[]' }}
        name: Install ansible and declared collections
        run: |
          pipx install --include-deps ansible
          # `--include-apps` is required, otherwise ansible-lint is injected
          # into the venv but never exposed on PATH.
          pipx inject --include-apps ansible ansible-lint
          # One invocation per requirements file: `ansible-galaxy collection
          # install -r a -r b` silently honours only the last -r.
          ansible-galaxy collection install --force \
            -r ansible/cluster/requirements.yaml -p /tmp/hac-collections
          ansible-galaxy collection install --force \
            -r ansible/gateway/requirements.yaml -p /tmp/hac-collections
      - if: ${{ steps.changed-files.outputs.changed_files != '[]' }}
        name: Syntax check
        # Resolve only against the declared collections, so an undeclared one
        # fails here instead of passing on the runner image's bundled copies.
        env:
          ANSIBLE_COLLECTIONS_PATH: /tmp/hac-collections
        run: ansible-lint --nocolor --format=pep8 --tags syntax-check ansible/

  workflow-lint:
    name: Workflow Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: bjw-s-labs/action-changed-files@a9a36fb08ce06db9b02fbd8026cc2c0945eb9841 # v0.6.0
        id: changed-files
        with:
          patterns: .github/**
      - if: ${{ steps.changed-files.outputs.changed_files != '[]' }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
      - if: ${{ steps.changed-files.outputs.changed_files != '[]' }}
        name: Lint workflow files
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint"
      - if: ${{ steps.changed-files.outputs.changed_files != '[]' }}
        name: Lint shell scripts
        # actionlint's shellcheck integration only covers `run:` blocks inside
        # workflow YAML, so standalone scripts would otherwise go unchecked.
        # No `-S` threshold on purpose: actionlint invokes shellcheck with
        # `--norc -f json -x --shell <sh> -e SC1091,...` and no severity floor,
        # so it fails on info-level findings too (verified: SC2086:info in a
        # `run:` block exits 1). Passing `-S warning` here would make
        # standalone scripts laxer than inline ones, not more consistent.
        run: |
          docker run --rm -v "$PWD:/mnt:ro" -w /mnt \
            koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d \
            .github/scripts/*.sh

  images:
    name: Image Refs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # image-refs.sh diffs the changed files against the PR base commit.
          fetch-depth: 0
      - uses: bjw-s-labs/action-changed-files@a9a36fb08ce06db9b02fbd8026cc2c0945eb9841 # v0.6.0
        id: changed-files
        with:
          patterns: flux/**
      - if: ${{ steps.changed-files.outputs.changed_files != '[]' }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
      - if: ${{ steps.changed-files.outputs.changed_files != '[]' }}
        name: Install crane
        run: go install github.com/google/go-containerregistry/cmd/crane@v0.22.0
      - if: ${{ steps.changed-files.outputs.changed_files != '[]' }}
        name: Verify introduced image references
        # Only the refs this PR introduces: 33 of the repo's rendered refs live
        # on docker.io, whose anonymous pull limit is shared per runner IP, so
        # re-verifying every ref on every PR would flake.
        run: |
          gopath="$(go env GOPATH)"
          export PATH="$gopath/bin:$PATH"
          .github/scripts/image-refs.sh "${{ github.event.pull_request.base.sha }}" >/tmp/refs.txt
          if [ ! -s /tmp/refs.txt ]; then
            echo "No image references introduced."
            exit 0
          fi
          .github/scripts/image-verify.sh </tmp/refs.txt

  success:
    name: CI - Success
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs: [flux, renovate-config, ansible, workflow-lint, images]
    steps:
      - name: Fail on flux not success or skipped
        if: ${{ !(needs.flux.result == 'success' || needs.flux.result == 'skipped') }}
        run: exit 1
      - name: Fail on renovate-config not success or skipped
        if: ${{ !(needs.renovate-config.result == 'success' || needs.renovate-config.result == 'skipped') }}
        run: exit 1
      - name: Fail on ansible not success or skipped
        if: ${{ !(needs.ansible.result == 'success' || needs.ansible.result == 'skipped') }}
        run: exit 1
      - name: Fail on workflow-lint not success or skipped
        if: ${{ !(needs.workflow-lint.result == 'success' || needs.workflow-lint.result == 'skipped') }}
        run: exit 1
      - name: Fail on images not success or skipped
        if: ${{ !(needs.images.result == 'success' || needs.images.result == 'skipped') }}
        run: exit 1
      - run: echo "All checks passed or skipped"
