---
name: Advisory

on:
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  chart-values:
    name: Advisory Diffs
    runs-on: ubuntu-latest
    # A fork PR's token is read-only, so `gh pr comment` would fail and turn
    # this advisory job red on a contribution nobody can fix. Skipping is the
    # right call; `pull_request_target` is not, since it would run
    # PR-authored script content with a write token.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Install dyff and crane
        run: |
          go install github.com/homeport/dyff/cmd/dyff@v1.12.0
          go install github.com/google/go-containerregistry/cmd/crane@v0.22.1
      - name: Compute chart values diff
        run: |
          gopath="$(go env GOPATH)"
          export PATH="$gopath/bin:$PATH"
          .github/scripts/chart-values-diff.sh \
            "${{ github.event.pull_request.base.sha }}" /tmp/chart-values.md
      - name: Compute image config diff
        run: |
          gopath="$(go env GOPATH)"
          export PATH="$gopath/bin:$PATH"
          .github/scripts/image-config-diff.sh \
            "${{ github.event.pull_request.base.sha }}" /tmp/image-config.md
      - name: Comment or skip
        # Both sections share one comment: `--edit-last` edits this user's last
        # comment and is not marker-aware, so two sticky comments posted by
        # this workflow would overwrite each other.
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ ! -s /tmp/chart-values.md ] && [ ! -s /tmp/image-config.md ]; then
            echo "No chart or image changes; no comment."
            exit 0
          fi
          {
            echo "<!-- advisory-diff -->"
            if [ -s /tmp/chart-values.md ]; then
              echo "### Helm chart parameter changes"; echo; cat /tmp/chart-values.md; echo
            fi
            if [ -s /tmp/image-config.md ]; then
              echo "### Container contract changes"; echo; cat /tmp/image-config.md; echo
            fi
          } >/tmp/comment.md
          gh pr comment "$PR" --body-file /tmp/comment.md --edit-last --create-if-none
