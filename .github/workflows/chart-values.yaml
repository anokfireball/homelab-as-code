---
name: Chart Values

on:
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  chart-values:
    name: Chart Values Diff
    runs-on: ubuntu-latest
    # A fork PR's token is read-only, so `gh pr comment` would fail and turn
    # this advisory job red on a contribution nobody can fix. Skipping is the
    # right call; `pull_request_target` is not, since it would run
    # PR-authored script content with a write token.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Install dyff
        run: go install github.com/homeport/dyff/cmd/dyff@v1.12.0
      - name: Compute chart values diff
        run: |
          gopath="$(go env GOPATH)"
          export PATH="$gopath/bin:$PATH"
          .github/scripts/chart-values-diff.sh \
            "${{ github.event.pull_request.base.sha }}" /tmp/chart-values.md
      - name: Comment or skip
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ ! -s /tmp/chart-values.md ]; then
            echo "No chart version changes; no comment."
            exit 0
          fi
          {
            echo "<!-- chart-values-diff -->"
            echo "### Helm chart parameter changes"
            echo
            cat /tmp/chart-values.md
          } >/tmp/comment.md
          gh pr comment "$PR" --body-file /tmp/comment.md --edit-last --create-if-none
