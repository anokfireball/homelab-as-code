apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: wger-postgresql
  namespace: default
spec:
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ClusterImageCatalog
    name: postgresql
    major: 15
  instances: 1
  # single instance: a PDB cannot protect anything and only blocks node drains
  enablePDB: false
  managed:
    services:
      disabledDefaultServices: ["ro", "r"]
    roles:
      - name: stashbackup
        passwordSecret:
          name: postgres-backup-user
        login: true
        superuser: false
        inRoles:
          - pg_read_all_data
      # wger owns the DB and is the user PowerSync uses for logical
      # replication (PS_DATABASE_URI). It needs REPLICATION + CREATEROLE
      # so `manage.py setup-powersync-storage` can create/own the
      # powersync_storage role and schema.
      - name: wger
        ensure: present
        login: true
        superuser: false
        createrole: true
        replication: true
        passwordSecret:
          name: wger-postgres-user
  bootstrap:
    initdb:
      database: wger
      owner: wger
      secret:
        name: wger-postgres-user
  postgresql:
    pg_hba:
      # PowerSync connects as wger for logical replication (walsender);
      # the catch-all `host all all` rule does not cover the replication
      # pseudo-database, so an explicit entry is required.
      - host replication wger all scram-sha-256
  storage:
    size: 20Gi
    storageClass: cluster-replicated
---
# PowerSync replicates from the wger database via logical replication and
# requires a publication named "powersync". The wger Helm chart does not
# create it (neither the chart templates nor the setup-powersync-storage
# post-install hook), so manage it declaratively here.
apiVersion: postgresql.cnpg.io/v1
kind: Publication
metadata:
  name: wger-powersync
  namespace: default
spec:
  cluster:
    name: wger-postgresql
  dbname: wger
  name: powersync
  publicationReclaimPolicy: retain
  target:
    allTables: true
---
apiVersion: k8up.io/v1
kind: PreBackupPod
metadata:
  name: wger-database-backup
  namespace: default
  labels:
    backup: wger-database
  annotations:
    k8up.io/backup: "true"
spec:
  backupCommand: sh -c 'PGHOST="$POSTGRES_HOST" PGUSER="$POSTGRES_USER" PGPASSWORD="$POSTGRES_PASSWORD" pg_dumpall --clean'
  pod:
    spec:
      # Hardening: image pinned (E8); non-root uid 26 from the image (E4); user namespace (D2); no API token (E5 unbound SA)
      hostUsers: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 26
        runAsGroup: 26
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: wger-database-backup
          image: ghcr.io/cloudnative-pg/postgresql:15.19-standard-trixie@sha256:f617efc030d3099362e7fca616bb6d83d102599abf9b7b5e225482e4d0306aa3
          command:
            - "sleep"
            - "infinity"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          env:
            - name: POSTGRES_HOST
              value: wger-postgresql-rw
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-backup-user
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-backup-user
                  key: password
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: k8up.io/v1
kind: PodConfig
metadata:
  name: wger-database-backup
  namespace: default
spec:
  template:
    spec:
      # backup and prebackup job pods mount only k8up's emptyDirs (E1): user namespace (D2); image user 65532 (E4)
      hostUsers: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backup
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: k8up.io/v1
kind: PodConfig
metadata:
  name: wger-database-prune
  namespace: default
spec:
  template:
    spec:
      hostUsers: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prune
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: wger-database
  namespace: default
spec:
  backend:
    repoPasswordSecretRef:
      name: k8up-restic-secrets
      key: restic-password
    s3:
      bucket: Habitat-Giggle9-Composer/wger
  backup:
    podConfigRef:
      name: wger-database-backup
    labelSelectors:
      - matchLabels:
          backup: wger-database
    schedule: "42 3/6 * * *"
    concurrentRunsAllowed: false
  prune:
    podConfigRef:
      name: wger-database-prune
    schedule: "12 0 1 * *"
    concurrentRunsAllowed: false
    retention:
      keepHourly: 6
      keepDaily: 14
      keepWeekly: 12
      keepMonthly: 6
      keepYearly: 2
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wger
  namespace: default
spec:
  interval: 1m
  install:
    timeout: 30m
  upgrade:
    timeout: 30m
  chart:
    spec:
      chart: wger
      version: 2.1.0
      sourceRef:
        kind: HelmRepository
        name: wger
        namespace: flux-system
  valuesFrom:
    - kind: Secret
      name: wger-secrets
      valuesKey: SECRET_KEY
      targetPath: app.django.secret.key
    - kind: Secret
      name: wger-secrets
      valuesKey: smtp-username
      targetPath: app.mail.user
  values:
    app:
      environment:
        # The static volume is a block-backed RWX PVC whose ext4 root
        # contains a root-owned `lost+found`. The entrypoint's default
        # `collectstatic --clear` fails with PermissionError trying to
        # traverse it, leaving static files uncollected (broken CSS).
        # Disabling --clear collects without touching lost+found.
        - name: DJANGO_CLEAR_STATIC_FIRST
          value: "False"
        - name: ALLOW_REGISTRATION
          value: "True"
        - name: SITE_URL
          value: "https://wger.${SERVICE_DOMAIN}"
        - name: CSRF_TRUSTED_ORIGINS
          value: "https://wger.${SERVICE_DOMAIN}"
        - name: EMAIL_USE_SSL
          value: "True"
        - name: EMAIL_USE_TLS
          value: "False"
      timezone: "Europe/Berlin"
      global:
        annotations:
          reloader.stakater.com/auto: "true"
        securityContext:
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
        initImage: docker.io/busybox:1.38@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
      jwt:
        keygenImage: docker.io/alpine:3.24@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
      persistence:
        storageClass: cluster-replicated
      django:
        existingDatabase:
          enabled: true
          engine: django.db.backends.postgresql
          host: wger-postgresql-rw
          port: 5432
          existingSecret:
            name: wger-postgres-user
            dbuserKey: username
            dbpwKey: password
          dbname: wger
      mail:
        enabled: true
        server: ${SMTP_HOST}
        port: 465
        from_email: wger@${SERVICE_DOMAIN}
        secret:
          name: wger-secrets
          key: smtp-password
    powersync:
      image:
        # renovate: datasource=docker depName=docker.io/journeyapps/powersync-service
        tag: "1.27.2@sha256:d7a99817057a42dae9e6d8fe0c70b49d99105dcac8b8ab0e9ed3cf1ff0978b8b"
      securityContext:
        fsGroup: 901
        fsGroupChangePolicy: OnRootMismatch
    anubis:
      # anubis.policy replaces the chart's default policy wholesale (there is no merge). The rules below are the
      # wger chart 2.1.0 default (templates/configmap-anubis.yaml), unchanged, behind one leading ALLOW rule for the
      # Gatus uptime probe. Re-diff against the chart default when bumping the wger chart.
      policy: |
        bots:
          # Shared secret sent by the Gatus probe. Order matters: reading a header key that is absent is a CEL error,
          # which Anubis answers with HTTP 500 for the whole request, so the presence check comes first. The length
          # check keeps an unsubstituted (empty) token from matching a request that sends an empty header.
          - name: allow-gatus-probe
            action: ALLOW
            expression:
              all:
                - '"X-Probe-Token" in headers'
                - 'size(headers["X-Probe-Token"]) >= 32'
                - 'headers["X-Probe-Token"] == "${WGER_GATUS_PROBE_TOKEN}"'
          - name: allow-api-v2
            expression: 'path.startsWith("/api/v2")'
            action: ALLOW
          - name: allow-allauth-api
            expression: 'path.startsWith("/allauth")'
            action: ALLOW
          - name: allow-oauth-api
            expression: 'path.startsWith("/identity/")'
            action: ALLOW
          - import: (data)/bots/_deny-pathological.yaml
          - import: (data)/bots/aggressive-brazilian-scrapers.yaml
          - import: (data)/meta/ai-block-moderate.yaml
          - import: (data)/crawlers/xai.yaml
          - import: (data)/crawlers/_allow-good.yaml
          - import: (data)/clients/x-firefox-ai.yaml
          - import: (data)/clients/small-internet-browsers/_permissive.yaml
          - import: (data)/common/keep-internet-working.yaml
          - import: (data)/common/acts-like-browser.yaml
    nginx:
      image: nginx:stable@sha256:51047bea59fed88fbd1f52565d2f5fabcb82d311cf6c9e507a10ce74bb3bc3f0
    celery:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    postgres:
      enabled: false
    redis:
      enabled: false
  # Hardening (D2-D8, mechanism 4c). app, celery and nginx mount Longhorn RWX PVCs (D2 no): they stay in the host
  # user namespace. Their containers run as the image's non-root user (D3); nginx switches to its documented uid 101 (D4)
  # and listens on 8080 (its config is seeded from the chart ConfigMap by an init container). The post-install hook Job
  # wger-setup-powersync-storage is patched below; postRenderStrategy combined (helm-controller's default) is pinned so
  # it stays reachable.
  postRenderStrategy: combined
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: wger-app
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: wger-app
              spec:
                template:
                  spec:
                    automountServiceAccountToken: false
                    securityContext:
                      seccompProfile:
                        type: RuntimeDefault
                    initContainers:
                      - name: init-container
                        securityContext:
                          runAsNonRoot: true
                          runAsUser: 1000
                          runAsGroup: 1000
                          allowPrivilegeEscalation: false
                          readOnlyRootFilesystem: true
                          capabilities:
                            drop: ["ALL"]
                        volumeMounts:
                          - name: tmp
                            mountPath: /tmp
                    containers:
                      - name: wger
                        # renovate: datasource=docker depName=wger/server
                        image: docker.io/wger/server:2.7@sha256:1c5789b93bfe5eed0b7287255782d9177027b255de2b22b59f511a693a48db04
                        securityContext:
                          runAsNonRoot: true
                          runAsUser: 1000
                          runAsGroup: 1000
                          allowPrivilegeEscalation: false
                          readOnlyRootFilesystem: true
                          capabilities:
                            drop: ["ALL"]
                        volumeMounts:
                          - name: tmp
                            mountPath: /tmp
                          - name: gunicorn
                            mountPath: /home/wger/.gunicorn
                    volumes:
                      - name: tmp
                        emptyDir: {}
                      - name: gunicorn
                        emptyDir: {}
          - target:
              kind: Deployment
              name: wger-celery
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: wger-celery
              spec:
                template:
                  spec:
                    automountServiceAccountToken: false
                    securityContext:
                      seccompProfile:
                        type: RuntimeDefault
                    initContainers:
                      - name: init-container
                        securityContext:
                          runAsNonRoot: true
                          runAsUser: 1000
                          runAsGroup: 1000
                          allowPrivilegeEscalation: false
                          readOnlyRootFilesystem: true
                          capabilities:
                            drop: ["ALL"]
                        volumeMounts:
                          - name: tmp
                            mountPath: /tmp
                    containers:
                      - name: celery-beat
                        # renovate: datasource=docker depName=wger/server
                        image: docker.io/wger/server:2.7@sha256:1c5789b93bfe5eed0b7287255782d9177027b255de2b22b59f511a693a48db04
                        securityContext:
                          runAsNonRoot: true
                          runAsUser: 1000
                          runAsGroup: 1000
                          allowPrivilegeEscalation: false
                          readOnlyRootFilesystem: true
                          capabilities:
                            drop: ["ALL"]
                        volumeMounts:
                          - name: tmp
                            mountPath: /tmp
                    volumes:
                      - name: tmp
                        emptyDir: {}
          - target:
              kind: Deployment
              name: wger-celery-worker
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: wger-celery-worker
              spec:
                template:
                  spec:
                    automountServiceAccountToken: false
                    securityContext:
                      seccompProfile:
                        type: RuntimeDefault
                    initContainers:
                      - name: init-container
                        securityContext:
                          runAsNonRoot: true
                          runAsUser: 1000
                          runAsGroup: 1000
                          allowPrivilegeEscalation: false
                          readOnlyRootFilesystem: true
                          capabilities:
                            drop: ["ALL"]
                        volumeMounts:
                          - name: tmp
                            mountPath: /tmp
                    containers:
                      - name: celery-worker
                        # renovate: datasource=docker depName=wger/server
                        image: docker.io/wger/server:2.7@sha256:1c5789b93bfe5eed0b7287255782d9177027b255de2b22b59f511a693a48db04
                        securityContext:
                          runAsNonRoot: true
                          runAsUser: 1000
                          runAsGroup: 1000
                          allowPrivilegeEscalation: false
                          readOnlyRootFilesystem: true
                          capabilities:
                            drop: ["ALL"]
                        volumeMounts:
                          - name: tmp
                            mountPath: /tmp
                    volumes:
                      - name: tmp
                        emptyDir: {}
          - target:
              kind: Deployment
              name: wger-nginx
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: wger-nginx
              spec:
                template:
                  spec:
                    automountServiceAccountToken: false
                    securityContext:
                      runAsNonRoot: true
                      runAsUser: 101
                      runAsGroup: 101
                      seccompProfile:
                        type: RuntimeDefault
                    initContainers:
                      # seeds the chart's ConfigMap into writable emptyDirs: pid moves off /var/run (root-owned),
                      # and listen 80 becomes 8080 (non-root cannot bind 80 without NET_BIND_SERVICE)
                      - name: nginx-config-seed
                        # renovate: datasource=docker depName=nginx
                        image: nginx:stable@sha256:51047bea59fed88fbd1f52565d2f5fabcb82d311cf6c9e507a10ce74bb3bc3f0
                        command:
                          - sh
                          - -c
                          - |
                            cp /etc/nginx/nginx.conf /out/nginx.conf
                            sed -i 's|^\( *pid \).*;|\1/tmp/nginx.pid;|' /out/nginx.conf
                            cp /src/*.conf /conf/
                            sed -i 's/listen 80;/listen 8080;/' /conf/*.conf
                            grep -q 'listen 8080;' /conf/*.conf
                        securityContext:
                          runAsNonRoot: true
                          runAsUser: 101
                          runAsGroup: 101
                          allowPrivilegeEscalation: false
                          readOnlyRootFilesystem: true
                          capabilities:
                            drop: ["ALL"]
                        volumeMounts:
                          - name: nginx-conf
                            mountPath: /src
                            readOnly: true
                          - name: nginx-conf-d
                            mountPath: /conf
                          - name: nginx-main
                            mountPath: /out
                    containers:
                      - name: nginx
                        securityContext:
                          runAsNonRoot: true
                          runAsUser: 101
                          runAsGroup: 101
                          allowPrivilegeEscalation: false
                          readOnlyRootFilesystem: true
                          capabilities:
                            drop: ["ALL"]
                        ports:
                          - containerPort: 80
                            protocol: TCP
                            $patch: delete
                          - name: http
                            containerPort: 8080
                            protocol: TCP
                        volumeMounts:
                          - name: nginx-conf-d
                            mountPath: /etc/nginx/conf.d/
                            readOnly: true
                          - name: nginx-main
                            mountPath: /etc/nginx/nginx.conf
                            subPath: nginx.conf
                            readOnly: true
                          - name: tmp
                            mountPath: /tmp
                          - name: nginx-cache
                            mountPath: /var/cache/nginx
                    volumes:
                      - name: nginx-conf-d
                        emptyDir: {}
                      - name: nginx-main
                        emptyDir: {}
                      - name: tmp
                        emptyDir: {}
                      - name: nginx-cache
                        emptyDir: {}
          - target:
              kind: Service
              name: wger-http
            patch: |
              apiVersion: v1
              kind: Service
              metadata:
                name: wger-http
              spec:
                ports:
                  - name: http
                    port: 80
                    protocol: TCP
                    targetPort: 8080
          - target:
              kind: Deployment
              name: wger-powersync
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: wger-powersync
              spec:
                template:
                  spec:
                    hostUsers: false
                    automountServiceAccountToken: false
                    securityContext:
                      seccompProfile:
                        type: RuntimeDefault
                    initContainers:
                      - name: init-container
                        securityContext:
                          runAsNonRoot: true
                          runAsUser: 901
                          runAsGroup: 901
                          allowPrivilegeEscalation: false
                          readOnlyRootFilesystem: true
                          capabilities:
                            drop: ["ALL"]
                        volumeMounts:
                          - name: tmp
                            mountPath: /tmp
                    containers:
                      - name: powersync
                        securityContext:
                          runAsNonRoot: true
                          runAsUser: 901
                          runAsGroup: 901
                          allowPrivilegeEscalation: false
                          readOnlyRootFilesystem: true
                          capabilities:
                            drop: ["ALL"]
                        volumeMounts:
                          - name: tmp
                            mountPath: /tmp
                          - name: probes
                            mountPath: /app/.probes
                    volumes:
                      - name: tmp
                        emptyDir: {}
                      - name: probes
                        emptyDir: {}
          - target:
              kind: CronJob
              name: wger-powersync-compact
            patch: |
              apiVersion: batch/v1
              kind: CronJob
              metadata:
                name: wger-powersync-compact
              spec:
                jobTemplate:
                  spec:
                    template:
                      spec:
                        hostUsers: false
                        automountServiceAccountToken: false
                        securityContext:
                          seccompProfile:
                            type: RuntimeDefault
                        containers:
                          - name: powersync-compact
                            securityContext:
                              runAsNonRoot: true
                              runAsUser: 901
                              runAsGroup: 901
                              allowPrivilegeEscalation: false
                              readOnlyRootFilesystem: true
                              capabilities:
                                drop: ["ALL"]
                            volumeMounts:
                              - name: tmp
                                mountPath: /tmp
                              - name: probes
                                mountPath: /app/.probes
                        volumes:
                          - name: tmp
                            emptyDir: {}
                          - name: probes
                            emptyDir: {}
          - target:
              kind: Job
              name: wger-setup-powersync-storage
            patch: |
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: wger-setup-powersync-storage
              spec:
                template:
                  spec:
                    hostUsers: false
                    automountServiceAccountToken: false
                    securityContext:
                      runAsNonRoot: true
                      runAsUser: 1000
                      runAsGroup: 1000
                      seccompProfile:
                        type: RuntimeDefault
                    initContainers:
                      - name: init-container
                        securityContext:
                          runAsNonRoot: true
                          runAsUser: 1000
                          runAsGroup: 1000
                          allowPrivilegeEscalation: false
                          readOnlyRootFilesystem: true
                          capabilities:
                            drop: ["ALL"]
                        volumeMounts:
                          - name: tmp
                            mountPath: /tmp
                    containers:
                      - name: setup-powersync-storage
                        # renovate: datasource=docker depName=wger/server
                        image: docker.io/wger/server:2.7@sha256:1c5789b93bfe5eed0b7287255782d9177027b255de2b22b59f511a693a48db04
                        securityContext:
                          runAsNonRoot: true
                          runAsUser: 1000
                          runAsGroup: 1000
                          allowPrivilegeEscalation: false
                          readOnlyRootFilesystem: true
                          capabilities:
                            drop: ["ALL"]
                        volumeMounts:
                          - name: tmp
                            mountPath: /tmp
                    volumes:
                      - name: tmp
                        emptyDir: {}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wger-redis
  namespace: default
spec:
  interval: 1m
  chart:
    spec:
      chart: valkey
      version: 0.12.1
      sourceRef:
        kind: HelmRepository
        name: valkey
        namespace: flux-system
  values:
    fullnameOverride: wger-redis
    image:
      # renovate: datasource=docker depName=docker.io/valkey/valkey
      tag: "9.1.3@sha256:3add1a336a920ea54770a001ab6feb3da5fceea96a40373a3a2cd469b815f0b7"
    podSecurityContext:
      runAsNonRoot: true
      fsGroupChangePolicy: OnRootMismatch
    # Cache only; contents are reconstructible. An emptyDir keeps this off RWO
    # storage, whose single-node attachment deadlocks a rolling update when the
    # replacement pod is scheduled onto a different node.
    dataStorage:
      enabled: false
  postRenderers:
    - kustomize:
        patches:
          # D2 yes (emptyDir and ConfigMap only): user namespace. Image already non-root (E2 uid 1000).
          - target:
              kind: Deployment
              name: wger-redis
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: wger-redis
              spec:
                template:
                  spec:
                    hostUsers: false
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wger-gateway
  namespace: default
spec:
  interval: 1m
  chart:
    spec:
      chart: ./charts/gateway-route
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  values:
    name: wger
    hostname: wger.${SERVICE_DOMAIN}
    route:
      enabled: true
      backend:
        name: wger-http
        port: 80
