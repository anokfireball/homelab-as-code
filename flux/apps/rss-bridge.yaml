apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rss-bridge
  namespace: default
spec:
  interval: 1m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      # D2 yes: configMap only (E3), every E2/E4 UID/GID is 0 or 33, no NFS/hostPath/devices. D4 no: no documented non-root mode (E7), root stays in the userns.
      hostUsers: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
    global:
      alwaysAppendIdentifierToResourceName: true
    controllers:
      main:
        initContainers:
          # Copies the image's /app and /run into emptyDirs. cp -R (not -a); /app/cache is chowned to uid 33 for php-fpm writes.
          seed:
            image:
              repository: ghcr.io/rss-bridge/rss-bridge
              tag: latest@sha256:c8fb4e20e202e11679db6d2795034e8bd59112e5c823ab452587d1ca89264159
            command: ["sh", "-c", "cp -R /app/. /seed-app/ && cp -R /run/. /seed-run/ && chown -R 33:33 /seed-app/cache"]
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
                add: ["CHOWN"]
        containers:
          main:
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                # Root master (E2 uid 0) chowns /var/lib/nginx and the php-fpm socket, then setuid/setgid to workers (uid 33).
                # Verified locally with --cap-drop ALL: chown fails without CHOWN; setgid(33) fails without SETGID.
                drop: ["ALL"]
                add: ["CHOWN", "SETUID", "SETGID"]
            image:
              repository: ghcr.io/rss-bridge/rss-bridge
              tag: latest@sha256:c8fb4e20e202e11679db6d2795034e8bd59112e5c823ab452587d1ca89264159
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
    configMaps:
      config:
        data:
          config.ini.php: |
            ; <?php exit; ?> DO NOT REMOVE THIS LINE
            [system]
            timezone = "Europe/Berlin"
            [error]
            output = "http"
    service:
      main:
        controller: main
        ports:
          http:
            port: 80
    ingress:
      main:
        enabled: false
    route:
      main:
        enabled: true
        kind: HTTPRoute
        parentRefs:
          - group: gateway.networking.k8s.io
            kind: ListenerSet
            name: rss-bridge
            namespace: default
            sectionName: https
        hostnames:
          - rssbridge.${SERVICE_DOMAIN}
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - identifier: main
    persistence:
      config:
        type: configMap
        name: rss-bridge-config
      # /app and /run are seeded from the image by the seed init container: the entrypoint writes /app/config.ini.php,
      # nginx writes /run/nginx.pid and php-fpm creates /run/php/php8.2-fpm.sock (E6).
      app:
        type: emptyDir
        advancedMounts:
          main:
            main:
              - path: /app
            seed:
              - path: /seed-app
      run:
        type: emptyDir
        advancedMounts:
          main:
            main:
              - path: /run
            seed:
              - path: /seed-run
      tmp:
        type: emptyDir
        advancedMounts:
          main:
            main:
              - path: /tmp
      # nginx creates its fastcgi/body/proxy temp trees here at start (E6).
      nginx-lib:
        type: emptyDir
        advancedMounts:
          main:
            main:
              - path: /var/lib/nginx
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rss-bridge-gateway
  namespace: default
spec:
  interval: 1m
  chart:
    spec:
      chart: ./charts/gateway-route
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  values:
    name: rss-bridge
    hostname: rssbridge.${SERVICE_DOMAIN}
