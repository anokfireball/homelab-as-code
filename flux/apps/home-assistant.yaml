---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: home-assistant
  namespace: default
spec:
  storageClassName: cluster-replicated
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: home-assistant-config
  namespace: default
spec:
  backend:
    repoPasswordSecretRef:
      name: k8up-restic-secrets
      key: restic-password
    s3:
      bucket: ${HA_BACKUP_BUCKET}
  backup:
    labelSelectors:
      - matchLabels:
          backup: home-assistant-config
    schedule: "37 */6 * * *"
    concurrentRunsAllowed: false
    podConfigRef:
      name: home-assistant-config-backup
  prune:
    schedule: "37 1 1 * *"
    concurrentRunsAllowed: false
    podConfigRef:
      name: home-assistant-config-prune
    retention:
      keepHourly: 6
      keepDaily: 14
      keepWeekly: 12
      keepMonthly: 6
      keepYearly: 2
---
apiVersion: k8up.io/v1
kind: PodConfig
metadata:
  name: home-assistant-config-backup
  namespace: default
spec:
  template:
    spec:
      # restic only streams what the home-assistant pod's backupcommand prints; it needs no volumes
      hostUsers: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backup
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: k8up.io/v1
kind: PodConfig
metadata:
  name: home-assistant-config-prune
  namespace: default
spec:
  template:
    spec:
      hostUsers: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prune
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
  namespace: default
spec:
  interval: 1m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  valuesFrom:
    # private, integration-specific values (the Sonos callback service) live in this SOPS secret
    - kind: Secret
      name: home-assistant-values
  values:
    defaultPodOptions:
      hostUsers: false
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      annotations:
        k8up.io/backup: "true"
        k8up.io/backupcommand: python3 /scripts/backup.py
        k8up.io/file-extension: .tar
        k8up.io/backupcommand-container: app
      labels:
        backup: home-assistant-config
    controllers:
      home-assistant:
        # single writer on an RWO volume: a surge pod on the other node deadlocks (issue #16)
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/home-assistant
              tag: 2026.11.2@sha256:28ae630554f1f2dd43ecbdecad9d974f09f02b17a0a769a290ceec094ec427dc
            env:
              TZ: Europe/Berlin
            probes:
              # /manifest.json needs no auth; /healthz doesn't exist in Core
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /manifest.json
                    port: 8123
                  periodSeconds: 10
                  failureThreshold: 60
                  timeoutSeconds: 5
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /manifest.json
                    port: 8123
                  periodSeconds: 30
                  failureThreshold: 5
                  timeoutSeconds: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /manifest.json
                    port: 8123
                  periodSeconds: 10
                  failureThreshold: 5
                  timeoutSeconds: 5
            resources:
              requests:
                cpu: 100m
                memory: 768Mi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
    service:
      app:
        controller: home-assistant
        annotations:
          tailscale.com/expose: "true"
          tailscale.com/hostname: homelab-home-assistant
        ports:
          http:
            port: 8123
            appProtocol: kubernetes.io/ws
    route:
      main:
        enabled: true
        kind: HTTPRoute
        parentRefs:
          - group: gateway.networking.k8s.io
            kind: ListenerSet
            name: home-assistant
            namespace: default
            sectionName: https
        hostnames:
          - homeassistant.${SERVICE_DOMAIN}
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - identifier: app
                port: 8123
    persistence:
      config:
        existingClaim: home-assistant
        globalMounts:
          - path: /config
      cache:
        type: persistentVolumeClaim
        # the chart names a lone dynamic PVC after the release, which would collide
        # with the existingClaim above; pin it explicitly
        forceRename: home-assistant-cache
        storageClass: cluster-scratch
        accessMode: ReadWriteOnce
        size: 2Gi
        globalMounts:
          - path: /config/.venv
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      backup-script:
        type: secret
        name: home-assistant-backup-script
        defaultMode: 0555
        globalMounts:
          - path: /scripts
            readOnly: true
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant-gateway
  namespace: default
spec:
  interval: 1m
  chart:
    spec:
      chart: ./charts/gateway-route
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  values:
    name: home-assistant
    hostname: homeassistant.${SERVICE_DOMAIN}
