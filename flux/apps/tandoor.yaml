apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: tandoor-postgresql
  namespace: default
spec:
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ClusterImageCatalog
    name: postgresql
    major: 17
  instances: 1
  # single instance: a PDB cannot protect anything and only blocks node drains
  enablePDB: false
  managed:
    services:
      disabledDefaultServices: ["ro", "r"]
    roles:
      - name: stashbackup
        passwordSecret:
          name: postgres-backup-user
        login: true
        superuser: false
        inRoles:
          - pg_read_all_data
  bootstrap:
    initdb:
      database: tandoor
      owner: tandoor
      secret:
        name: tandoor-postgres-user
  storage:
    size: 2Gi
    storageClass: cluster-replicated
---
apiVersion: k8up.io/v1
kind: PreBackupPod
metadata:
  name: tandoor-database-backup
  namespace: default
  labels:
    backup: tandoor-database
  annotations:
    k8up.io/backup: "true"
spec:
  backupCommand: sh -c 'PGHOST="$POSTGRES_HOST" PGUSER="$POSTGRES_USER" PGPASSWORD="$POSTGRES_PASSWORD" pg_dumpall --clean'
  pod:
    spec:
      # Hardening: pinned image (E8), uid 26 from the image (E4), user namespace (D2); unbound SA, no token (E5, D7)
      hostUsers: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 26
        runAsGroup: 26
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tandoor-database-backup
          image: ghcr.io/cloudnative-pg/postgresql:17.11-standard-trixie@sha256:ed6923f9ba2399cf9070379a353c710c29ced8a294be73986a2c3dae7e599ce3
          command:
            - "sleep"
            - "infinity"
          env:
            - name: POSTGRES_HOST
              value: tandoor-postgresql-rw
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-backup-user
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-backup-user
                  key: password
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: tandoor-database
  namespace: default
spec:
  backend:
    repoPasswordSecretRef:
      name: k8up-restic-secrets
      key: restic-password
    s3:
      bucket: Habitat-Giggle9-Composer/tandoor
  backup:
    labelSelectors:
      - matchLabels:
          backup: tandoor-database
    schedule: "27 3/6 * * *"
    concurrentRunsAllowed: false
    podConfigRef:
      name: tandoor-database-backup
  prune:
    schedule: "57 0 1 * *"
    concurrentRunsAllowed: false
    podConfigRef:
      name: tandoor-prune
    retention:
      keepHourly: 6
      keepDaily: 14
      keepWeekly: 12
      keepMonthly: 6
      keepYearly: 2
---
apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: tandoor-media
  namespace: default
spec:
  backend:
    repoPasswordSecretRef:
      name: k8up-restic-secrets
      key: restic-password
    s3:
      bucket: Habitat-Giggle9-Composer/tandoor-media
  backup:
    labelSelectors:
      - matchLabels:
          backup: tandoor-media
    schedule: "47 4/6 * * *"
    concurrentRunsAllowed: false
    podConfigRef:
      name: tandoor-media-backup
  prune:
    schedule: "17 1 1 * *"
    concurrentRunsAllowed: false
    podConfigRef:
      name: tandoor-prune
    retention:
      keepHourly: 6
      keepDaily: 14
      keepWeekly: 12
      keepMonthly: 6
      keepYearly: 2
---
apiVersion: k8up.io/v1
kind: PodConfig
metadata:
  name: tandoor-database-backup
  namespace: default
spec:
  template:
    spec:
      # Keeps the pod-executor SA token: the backup job execs the PreBackupPod's dump command (RoleBinding k8up-executor).
      hostUsers: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backup
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: k8up.io/v1
kind: PodConfig
metadata:
  name: tandoor-media-backup
  namespace: default
spec:
  template:
    spec:
      # Media is root-owned 0644/0755 (E2, E3): uid 65532 reads it as the image already did. Longhorn RWO, no NFS (D2).
      hostUsers: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backup
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: k8up.io/v1
kind: PodConfig
metadata:
  name: tandoor-prune
  namespace: default
spec:
  template:
    spec:
      hostUsers: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prune
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tandoor-media
  namespace: default
  annotations:
    k8up.io/backup: "true"
  labels:
    backup: tandoor-media
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: cluster-replicated
  resources:
    requests:
      storage: 5Gi
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tandoor
  namespace: default
spec:
  interval: 1m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      # D2 yes (E3: Longhorn RWO only, no NFS/RWX/hostPath; all E3 UIDs/GIDs are 0). D4 no: no documented non-root mode, so root stays inside the user namespace.
      hostUsers: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"
        defaultContainerOptions:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
        initContainers:
          # Seeds the emptyDir with the image's http.d (nginx template + errorpages); boot.sh writes Recipes.conf into it.
          seed-http:
            image:
              repository: ghcr.io/tandoorrecipes/recipes
              tag: 2.7.2@sha256:1b6d43c3c0f5d2888aa564d9daf29883212b79ad496f59f3c684c099eb1a57b9
            command: ["sh", "-c", "cp -R /opt/recipes/http.d/. /seed/"]
        containers:
          main:
            image:
              repository: ghcr.io/tandoorrecipes/recipes
              tag: 2.7.2@sha256:1b6d43c3c0f5d2888aa564d9daf29883212b79ad496f59f3c684c099eb1a57b9
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                # nginx master (root) chowns /tmp/*_temp to uid 100 and setuid/setgid for workers. No NET_BIND_SERVICE: port 8080 (TANDOOR_PORT) below.
                drop: ["ALL"]
                add: ["CHOWN", "SETUID", "SETGID"]
            probes:
              liveness:
                enabled: true
                type: HTTP
                path: /
                spec:
                  initialDelaySeconds: 60
                  periodSeconds: 30
                  failureThreshold: 5
              readiness:
                enabled: true
                type: HTTP
                path: /
                spec:
                  initialDelaySeconds: 60
                  failureThreshold: 10
              startup:
                enabled: true
                type: HTTP
                path: /
                spec:
                  failureThreshold: 30
            env:
              TZ: Europe/Berlin
              TANDOOR_PORT: "8080"
              # E6: Python would write 25 __pycache__ dirs into the read-only root; disabling bytecode writes avoids 25 mount points
              PYTHONDONTWRITEBYTECODE: "1"
              SECRET_KEY:
                valueFrom:
                  secretKeyRef:
                    name: tandoor-secrets
                    key: SECRET_KEY
              ALLOWED_HOSTS: "*"
              CSRF_TRUSTED_ORIGINS: https://tandoor.${SERVICE_DOMAIN}
              ALLAUTH_TRUSTED_PROXY_COUNT: "2"
              ENABLE_SIGNUP: "0"
              DB_ENGINE: django.db.backends.postgresql
              POSTGRES_HOST: tandoor-postgresql-rw
              POSTGRES_DB: tandoor
              POSTGRES_PORT: "5432"
              POSTGRES_USER:
                valueFrom:
                  secretKeyRef:
                    name: tandoor-postgres-user
                    key: username
              POSTGRES_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: tandoor-postgres-user
                    key: password
              SORT_TREE_BY_NAME: "1"
              EMAIL_HOST: ${SMTP_HOST}
              EMAIL_PORT: "465"
              EMAIL_HOST_USER:
                valueFrom:
                  secretKeyRef:
                    name: tandoor-secrets
                    key: smtp-username
              EMAIL_HOST_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: tandoor-secrets
                    key: smtp-password
              EMAIL_USE_TLS: "0"
              EMAIL_USE_SSL: "1"
              DEFAULT_FROM_EMAIL: tandoor@${SERVICE_DOMAIN}
              SPACE_AI_ENABLED: "1"
    service:
      main:
        controller: main
        ports:
          http:
            port: 80
            targetPort: 8080
    ingress:
      main:
        enabled: false
    route:
      main:
        enabled: true
        kind: HTTPRoute
        parentRefs:
          - group: gateway.networking.k8s.io
            kind: ListenerSet
            name: tandoor
            namespace: default
            sectionName: https
        hostnames:
          - tandoor.${SERVICE_DOMAIN}
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - identifier: main
    persistence:
      media:
        type: persistentVolumeClaim
        existingClaim: tandoor-media
        globalMounts:
          - path: /opt/recipes/mediafiles
      static:
        type: emptyDir
        globalMounts:
          - path: /opt/recipes/staticfiles
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      http-d:
        type: emptyDir
        advancedMounts:
          main:
            main:
              - path: /opt/recipes/http.d
            seed-http:
              - path: /seed
      gunicorn:
        type: emptyDir
        globalMounts:
          - path: /root/.gunicorn
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tandoor-gateway
  namespace: default
spec:
  interval: 1m
  chart:
    spec:
      chart: ./charts/gateway-route
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  values:
    name: tandoor
    hostname: tandoor.${SERVICE_DOMAIN}
