apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-postgresql
  namespace: default
spec:
  # https://github.com/immich-app/immich-charts/issues/149
  # https://github.com/immich-app/immich/discussions/14280
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ImageCatalog
    name: vectorchord
    major: 16
  instances: 1
  # single instance: a PDB cannot protect anything and only blocks node drains
  enablePDB: false
  postgresql:
    shared_preload_libraries:
      - "vchord.so"
  managed:
    services:
      disabledDefaultServices: ["ro", "r"]
    roles:
      - name: stashbackup
        passwordSecret:
          name: postgres-backup-user
        login: true
        superuser: false
        inRoles:
          - pg_read_all_data
      - name: immich
        superuser: true
        login: true
        passwordSecret:
          name: immich-postgres-user
  bootstrap:
    initdb:
      database: immich
      owner: immich
      secret:
        name: immich-postgres-user
      postInitSQL:
        - CREATE EXTENSION IF NOT EXISTS "vector";
        - CREATE EXTENSION IF NOT EXISTS "vchord";
        - CREATE EXTENSION IF NOT EXISTS "cube" CASCADE;
        - CREATE EXTENSION IF NOT EXISTS "earthdistance" CASCADE;
  storage:
    size: 4Gi
    storageClass: cluster-replicated
---
apiVersion: k8up.io/v1
kind: PreBackupPod
metadata:
  name: immich-database-backup
  namespace: default
  labels:
    backup: immich-database
  annotations:
    k8up.io/backup: "true"
spec:
  backupCommand: sh -c 'PGHOST="$POSTGRES_HOST" PGUSER="$POSTGRES_USER" PGPASSWORD="$POSTGRES_PASSWORD" pg_dumpall --clean'
  pod:
    spec:
      # Hardening (D2, D3, D7, D8): no NFS or hostPath volume, so a user namespace; uid 26 is the image USER (E4); default SA is unbound (E5)
      hostUsers: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 26
        runAsGroup: 26
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: immich-database-backup
          image: ghcr.io/cloudnative-pg/postgresql:16.15-standard-trixie@sha256:8de65fffcc01ccecc12cf669f466719c4b85e0053b7f8364cda29338ead6bb36
          command:
            - "sleep"
            - "infinity"
          env:
            - name: POSTGRES_HOST
              value: immich-postgresql-rw
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-backup-user
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-backup-user
                  key: password
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: immich-database
  namespace: default
spec:
  backend:
    repoPasswordSecretRef:
      name: k8up-restic-secrets
      key: restic-password
    s3:
      bucket: Habitat-Giggle9-Composer/immich
  backup:
    labelSelectors:
      - matchLabels:
          backup: immich-database
    schedule: "19 4/6 * * *"
    concurrentRunsAllowed: false
    podConfigRef:
      name: immich-database-backup
  prune:
    schedule: "49 0 1 * *"
    concurrentRunsAllowed: false
    podConfigRef:
      name: immich-database-prune
    retention:
      keepHourly: 6
      keepDaily: 14
      keepWeekly: 12
      keepMonthly: 6
      keepYearly: 2
---
apiVersion: k8up.io/v1
kind: PodConfig
metadata:
  name: immich-database-backup
  namespace: default
spec:
  template:
    spec:
      # hostUsers false: the restic backup mounts no NFS volume (D2); image USER 65532 (E4)
      hostUsers: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backup
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: k8up.io/v1
kind: PodConfig
metadata:
  name: immich-database-prune
  namespace: default
spec:
  template:
    spec:
      hostUsers: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prune
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nas-photos
spec:
  capacity:
    storage: 1Mi
  accessModes:
    - ReadWriteMany
  nfs:
    server: 192.168.1.2
    path: /mnt/tank/Bilder
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nas-photos
  namespace: default
  annotations:
    k8up.io/backup: "true"
  labels:
    backup: immich-data
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  resources:
    requests:
      storage: 1Mi
  volumeName: nas-photos
---
apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: immich-data
  namespace: default
spec:
  backend:
    repoPasswordSecretRef:
      name: k8up-restic-secrets
      key: restic-password
    s3:
      bucket: Privatize8-Secret-Starry
  backup:
    labelSelectors:
      - matchLabels:
          backup: immich-data
    schedule: "49 2/6 * * *"
    concurrentRunsAllowed: false
    podConfigRef:
      name: immich-data-backup
  prune:
    schedule: "19 0 1 * *"
    concurrentRunsAllowed: false
    podConfigRef:
      name: immich-data-prune
    retention:
      keepHourly: 6
      keepDaily: 14
      keepWeekly: 12
      keepMonthly: 6
      keepYearly: 2
---
apiVersion: k8up.io/v1
kind: PodConfig
metadata:
  name: immich-data-backup
  namespace: default
spec:
  template:
    spec:
      # hostUsers stays unset: the backup mounts the NFS-backed PVC nas-photos (D2), so only backup pods need the audit-user-namespaces exception
      securityContext:
        runAsNonRoot: true
        runAsUser: 82
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backup
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: k8up.io/v1
kind: PodConfig
metadata:
  name: immich-data-prune
  namespace: default
spec:
  template:
    spec:
      # hostUsers false: the prune job mounts only k8up emptyDirs, no NFS (D2)
      hostUsers: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 82
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prune
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-library
  namespace: default
spec:
  resources:
    requests:
      storage: 100Gi
  storageClassName: cluster-replicated
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: default
spec:
  interval: 1m
  chart:
    spec:
      chart: immich
      version: 0.13.4
      sourceRef:
        kind: HelmRepository
        name: immich-app
        namespace: flux-system
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/immich-app/immich-server
              tag: v3.3.5@sha256:485d546a2e31d6a8b4db8423fcba5c109de8c218d93410af115fd1ccfc4352a6
            env:
              DB_HOSTNAME: immich-postgresql-rw
              DB_USERNAME: immich
              DB_DATABASE_NAME: immich
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: immich-postgres-user
                    key: password
    immich:
      persistence:
        library:
          existingClaim: immich-library
    valkey:
      enabled: true
      persistence:
        data:
          type: persistentVolumeClaim
          storageClass: cluster-scratch
          size: 2Gi
          accessMode: ReadWriteOnce
        tmp:
          type: emptyDir
          globalMounts:
            - path: /tmp
      # Hardening (D2, D3, D5-D8): the data volume is owned by uid 999 (E3), so the process keeps uid 999 and runs in a user namespace
      controllers:
        main:
          pod:
            hostUsers: false
            securityContext:
              runAsNonRoot: true
              runAsUser: 999
              runAsGroup: 1000
              fsGroup: 1000
              fsGroupChangePolicy: OnRootMismatch
              seccompProfile:
                type: RuntimeDefault
          containers:
            main:
              image:
                repository: docker.io/valkey/valkey
                tag: 9.1.2-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
    server:
      service:
        main:
          annotations:
            tailscale.com/expose: "true"
            tailscale.com/hostname: homelab-immich
      ingress:
        main:
          enabled: false
      route:
        main:
          enabled: true
          kind: HTTPRoute
          parentRefs:
            - group: gateway.networking.k8s.io
              kind: ListenerSet
              name: immich
              namespace: default
              sectionName: https
          hostnames:
            - immich.${SERVICE_DOMAIN}
          rules:
            - matches:
                - path:
                    type: PathPrefix
                    value: /
              backendRefs:
                - identifier: main
      controllers:
        main:
          containers:
            main:
              resources:
                requests:
                  cpu: 50m
                  memory: 350Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          pod:
            securityContext:
              seccompProfile:
                type: RuntimeDefault
      persistence:
        external:
          enabled: true
          existingClaim: nas-photos
          globalMounts:
            - path: /mnt/tank/Bilder
        tmp:
          type: emptyDir
          globalMounts:
            - path: /tmp
    machine-learning:
      controllers:
        main:
          containers:
            main:
              image:
                repository: ghcr.io/immich-app/immich-machine-learning
                tag: v3.3.5@sha256:5b28c9352c8374b8a1ed96fbdd8d6755fea6e43510ec43fdf6538aa02ea40f56
              resources:
                requests:
                  cpu: 50m
                  memory: 300Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          pod:
            securityContext:
              seccompProfile:
                type: RuntimeDefault
      persistence:
        cache:
          enabled: true
          type: persistentVolumeClaim
          storageClass: cluster-scratch
          accessMode: ReadWriteMany
          size: 10Gi
        tmp:
          type: emptyDir
          globalMounts:
            - path: /tmp
        root-cache:
          type: emptyDir
          globalMounts:
            - path: /root/.cache
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: immich-server
  namespace: default
spec:
  minReplicas: 1
  maxReplicas: 2
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 300
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - resource:
        name: cpu
        target:
          averageUtilization: 50
          type: Utilization
      type: Resource
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    # should really only be done for the microservices
    # needs https://github.com/immich-app/immich-charts/issues/94
    name: immich-server
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: immich-machine-learning
  namespace: default
spec:
  minReplicas: 1
  maxReplicas: 2
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 300
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - resource:
        name: cpu
        target:
          averageUtilization: 50
          type: Utilization
      type: Resource
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: immich-machine-learning
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich-gateway
  namespace: default
spec:
  interval: 1m
  chart:
    spec:
      chart: ./charts/gateway-route
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  values:
    name: immich
    hostname: immich.${SERVICE_DOMAIN}
