apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: nextcloud-postgresql
  namespace: default
spec:
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ClusterImageCatalog
    name: postgresql
    major: 17
  instances: 1
  # single instance: a PDB cannot protect anything and only blocks node drains
  enablePDB: false
  managed:
    services:
      disabledDefaultServices: ["ro", "r"]
    roles:
      - name: stashbackup
        passwordSecret:
          name: postgres-backup-user
        login: true
        superuser: false
        inRoles:
          - pg_read_all_data
  bootstrap:
    initdb:
      database: nextcloud
      owner: nextcloud
      secret:
        name: nextcloud-postgres-user
  storage:
    size: 4Gi
    storageClass: cluster-replicated
---
apiVersion: k8up.io/v1
kind: PreBackupPod
metadata:
  name: nextcloud-database-backup
  namespace: default
  labels:
    backup: nextcloud-database
  annotations:
    k8up.io/backup: "true"
spec:
  backupCommand: sh -c 'PGHOST="$POSTGRES_HOST" PGUSER="$POSTGRES_USER" PGPASSWORD="$POSTGRES_PASSWORD" pg_dumpall --clean'
  pod:
    spec:
      # Hardening: pinned image (E8); uid 26 from the image (E4); user namespace (D2); no API token (E5, D7); seccomp (D8)
      hostUsers: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 26
        runAsGroup: 26
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nextcloud-database-backup
          image: ghcr.io/cloudnative-pg/postgresql:17.11-standard-trixie@sha256:ed6923f9ba2399cf9070379a353c710c29ced8a294be73986a2c3dae7e599ce3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command:
            - "sleep"
            - "infinity"
          env:
            - name: POSTGRES_HOST
              value: nextcloud-postgresql-rw
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-backup-user
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-backup-user
                  key: password
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: nextcloud-database
  namespace: default
spec:
  backend:
    repoPasswordSecretRef:
      name: k8up-restic-secrets
      key: restic-password
    s3:
      bucket: Habitat-Giggle9-Composer/nextcloud
  backup:
    labelSelectors:
      - matchLabels:
          backup: nextcloud-database
    schedule: "33 4/6 * * *"
    concurrentRunsAllowed: false
    podConfigRef:
      name: nextcloud-database-backup
  prune:
    schedule: "3 0 1 * *"
    concurrentRunsAllowed: false
    podConfigRef:
      name: nextcloud-prune
    retention:
      keepHourly: 6
      keepDaily: 14
      keepWeekly: 12
      keepMonthly: 6
      keepYearly: 2
---
apiVersion: k8up.io/v1
kind: PodConfig
metadata:
  name: nextcloud-database-backup
  namespace: default
spec:
  template:
    spec:
      # Hardening: user namespace (D2, no NFS in this pod); uid 65532 (non-root, k8up image); read-only root (D6). The SA token stays mounted: the backup job execs into the PreBackupPod (pod-executor, bound by k8up-executor; E5)
      hostUsers: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backup
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nextcloud
  namespace: default
spec:
  interval: 1m
  chart:
    spec:
      chart: nextcloud
      version: 9.4.1
      sourceRef:
        kind: HelmRepository
        name: nextcloud
        namespace: flux-system
  values:
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
    image:
      flavor: fpm-alpine
      registry: docker.io
      repository: library/nextcloud
      tag: 35.0.2-fpm-alpine@sha256:ee5b5612f24984941cdfaeeccb073e048370fd1e44104719149820eae3e28419
    resources:
      requests:
        cpu: 50m
        memory: 150Mi
    # https://github.com/nextcloud/helm/issues/10
    # https://github.com/nextcloud/helm/issues/399
    startupProbe:
      enabled: true
      periodSeconds: 5
      timeoutSeconds: 30
      failureThreshold: 120
      successThreshold: 1
    livenessProbe:
      timeoutSeconds: 30
    readinessProbe:
      timeoutSeconds: 30
    ingress:
      enabled: false
    httpRoute:
      enabled: true
      parentRefs:
        - group: gateway.networking.k8s.io
          kind: ListenerSet
          name: nextcloud
          namespace: default
          sectionName: https
      hostnames:
        - nextcloud.${SERVICE_DOMAIN}
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
    phpClientHttpsFix:
      enabled: true
    nextcloud:
      host: nextcloud.${SERVICE_DOMAIN}
      existingSecret:
        enabled: true
        secretName: nextcloud-secrets
        # https://github.com/xperimental/nextcloud-exporter?tab=readme-ov-file#token-authentication
        tokenKey: metrics-token
      trustedDomains:
        - localhost
        - nextcloud
        - nextcloud.${SERVICE_DOMAIN}
      defaultConfigs:
        imaginary.config.php: true
      configs:
        proxy.config.php: |-
          <?php
          $CONFIG = array (
            'trusted_proxies' => array(
              0 => '127.0.0.1',
              1 => '172.16.0.0/24',
              2 => '172.32.0.0/16',
              3 => 'fd08:172:16::/112',
              4 => 'fd08:172:32::/56',
            ),
            'forwarded_for_headers' => array('HTTP_X_FORWARDED_FOR'),
          );
      mail:
        enabled: true
        fromAddress: nextcloud
        domain: ${SERVICE_DOMAIN}
        smtp:
          port: 465
          secure: tls
          authtype: LOGIN
      extraVolumes:
        - name: paperless-consume
          nfs:
            server: 192.168.1.2
            path: /mnt/tank/Dokumente/Paperless/consume
        - name: photo-auto-upload-fabi
          nfs:
            server: 192.168.1.2
            path: /mnt/tank/Bilder/Fabi/Handy
        - name: photo-auto-upload-dani
          nfs:
            server: 192.168.1.2
            path: /mnt/tank/Bilder/Dani/Handy
        # Hardening (D6): writable paths for the read-only root filesystem; php-confd seeds the fpm entrypoint's redis-session.ini
        - name: tmp
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: php-confd
          emptyDir: {}
      extraVolumeMounts:
        - name: paperless-consume
          mountPath: /var/www/html/data/ntauthority/files/consumption/
        - name: photo-auto-upload-fabi
          mountPath: /var/www/html/data/ntauthority/files/auto-upload/
        - name: photo-auto-upload-dani
          mountPath: /var/www/html/data/RedRaven/files/auto-upload/
        - name: tmp
          mountPath: /tmp
        - name: nginx-run
          mountPath: /run
        - name: nginx-cache
          mountPath: /var/cache/nginx
      # Hardening (D3-D8): php-fpm runs as www-data (uid 82, E4) in the host user namespace (D2 no: inline NFS volumes); read-only root (D6)
      securityContext:
        runAsNonRoot: true
        runAsUser: 82
        runAsGroup: 82
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      # Pod level: fsGroup keeps the PVCs writable for uid 82; OnRootMismatch avoids a recursive chown of the 100Gi data volume on every start (E3)
      podSecurityContext:
        runAsNonRoot: true
        fsGroup: 82
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      # D6: entrypoint.sh configure_redis_session rewrites conf.d/redis-session.ini on every start (line 129); this creates that file in the php-confd emptyDir, which the fpm container mounts as a single file
      extraInitContainers:
        - name: init-redis-session-ini
          image: docker.io/library/nextcloud:35.0.2-fpm-alpine@sha256:ee5b5612f24984941cdfaeeccb073e048370fd1e44104719149820eae3e28419
          command: ["touch", "/usr/local/etc/php/conf.d/redis-session.ini"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 82
            runAsGroup: 82
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: php-confd
              mountPath: /usr/local/etc/php/conf.d
    imaginary:
      enabled: true
      resources:
        requests:
          cpu: 10m
          memory: 1Gi
      image:
        registry: docker.io
        repository: h2non/imaginary
        tag: 1.2.4@sha256:7facb4221047a5e79b9e902f380247f4e5bf4376400d0badbeb738d3e1c2f654
      # Hardening: pinned image (E8); uid 1000 (E2); read-only root (D6); drop ALL (D5); RuntimeDefault seccomp (D8)
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      podSecurityContext:
        seccompProfile:
          type: RuntimeDefault
    metrics:
      enabled: true
      server: https://nextcloud.${SERVICE_DOMAIN}
      https: true
      serviceMonitor:
        enabled: true
        labels:
          release: kube-prometheus-stack
      resources:
        requests:
          cpu: 10m
          memory: 20Mi
      image:
        registry: docker.io
        repository: xperimental/nextcloud-exporter
        tag: 0.9.2@sha256:512ddd1f1e1ea0ea7b4f0821c9740bcefa5fc15deb57fb9cd05dfb68e7e8390d
      # Hardening: pinned image (E8); uid 1000 (E2); read-only root (D6); drop ALL (D5); RuntimeDefault seccomp (D8)
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      podSecurityContext:
        seccompProfile:
          type: RuntimeDefault
    nginx:
      enabled: true
      ipFamilies:
        - IPv4
        - IPv6
      image:
        repository: docker.io/library/nginx
        tag: alpine@sha256:a3554c0d0b48177b1413c26e01f695334428020d9df01243fbae3e11cfd17417
      # Hardening: uid 101 is the image's nginx user (E4); read-only root (D6); drop ALL (D5); no privilege escalation (D8)
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
    redis:
      enabled: false
    externalRedis:
      enabled: true
      host: nextcloud-redis
      port: "6379"
      existingSecret:
        enabled: true
        secretName: nextcloud-secrets
        passwordKey: redis-password
    cronjob:
      enabled: true
      type: cronjob
      cronjob:
        annotations:
          healthcheckSecret: nextcloud-cron
          healthcheckImage: ghcr.io/anokfireball/base-image:3.24.3@sha256:5b9f5d72791bc19e943e8632ab617624c89b7d0fdb3d32be070a3e09a7bca03c
        affinity:
          podAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - nextcloud
                    - key: app.kubernetes.io/component
                      operator: In
                      values:
                        - app
                topologyKey: kubernetes.io/hostname
        securityContext:
          runAsNonRoot: true
          runAsUser: 82
          runAsGroup: 82
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
    internalDatabase:
      enabled: false
    externalDatabase:
      enabled: true
      type: postgresql
      host: nextcloud-postgresql-rw
      database: nextcloud
      existingSecret:
        enabled: false
        secretName: nextcloud-postgres-user
        usernameKey: username
        passwordKey: password
    postgresql:
      enabled: false
    service:
      annotations:
        tailscale.com/expose: "true"
        tailscale.com/hostname: homelab-nextcloud
    persistence:
      enabled: true
      storageClass: cluster-replicated
      size: 2Gi
      nextcloudData:
        enabled: true
        annotations:
          k8up.io/backup: "true"
          k8up.io/backup-restic-args: |
            [
              "--exclude", "nextcloud.log",
              "--exclude", "nextcloud.log.*",
              "--exclude", "appdata_*/preview",
              "--exclude", "*/files_external",
              "--exclude", "*/files/auto-upload"
            ]
        labels:
          backup: nextcloud-data
        storageClass: cluster-replicated
        size: 100Gi
  postRenderers:
    - kustomize:
        patches:
          # Hardening (D7): app, cron, imaginary and metrics pods never call the API (E5: default SA has no bindings)
          - target:
              kind: Deployment
              name: nextcloud
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: nextcloud
              spec:
                template:
                  spec:
                    automountServiceAccountToken: false
                    containers:
                      - name: nextcloud
                        volumeMounts:
                          # D6: the entrypoint rewrites this one file on every start (entrypoint.sh:129); mounting only the file keeps the rest of conf.d read-only
                          - name: php-confd
                            mountPath: /usr/local/etc/php/conf.d/redis-session.ini
                            subPath: redis-session.ini
          - target:
              kind: CronJob
              name: nextcloud-cron
            patch: |
              apiVersion: batch/v1
              kind: CronJob
              metadata:
                name: nextcloud-cron
              spec:
                jobTemplate:
                  spec:
                    template:
                      spec:
                        automountServiceAccountToken: false
          - target:
              kind: Deployment
              name: nextcloud-imaginary
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: nextcloud-imaginary
              spec:
                template:
                  spec:
                    automountServiceAccountToken: false
                    hostUsers: false
                    volumes:
                      - name: tmp
                        emptyDir: {}
                    containers:
                      - name: imaginary
                        volumeMounts:
                          - name: tmp
                            mountPath: /tmp
          - target:
              kind: Deployment
              name: nextcloud-metrics
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: nextcloud-metrics
              spec:
                template:
                  spec:
                    automountServiceAccountToken: false
                    hostUsers: false
                    volumes:
                      - name: tmp
                        emptyDir: {}
                    containers:
                      - name: metrics-exporter
                        volumeMounts:
                          - name: tmp
                            mountPath: /tmp
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nextcloud-gateway
  namespace: default
spec:
  interval: 1m
  chart:
    spec:
      chart: ./charts/gateway-route
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  values:
    name: nextcloud
    hostname: nextcloud.${SERVICE_DOMAIN}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nextcloud-dav-redirects
  namespace: default
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: nextcloud
      namespace: default
      sectionName: https
  hostnames:
    - nextcloud.${SERVICE_DOMAIN}
  rules:
    - matches:
        - path:
            type: Exact
            value: /.well-known/caldav
      filters:
        - type: RequestRedirect
          requestRedirect:
            statusCode: 301
            path:
              type: ReplaceFullPath
              replaceFullPath: /remote.php/dav
    - matches:
        - path:
            type: Exact
            value: /.well-known/carddav
      filters:
        - type: RequestRedirect
          requestRedirect:
            statusCode: 301
            path:
              type: ReplaceFullPath
              replaceFullPath: /remote.php/dav
---
apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: nextcloud-data
  namespace: default
spec:
  backend:
    repoPasswordSecretRef:
      name: k8up-restic-secrets
      key: restic-password
    s3:
      bucket: Overshoot-Deviant-Stopwatch1
  backup:
    labelSelectors:
      - matchLabels:
          backup: nextcloud-data
    schedule: "14 1/6 * * *"
    concurrentRunsAllowed: false
    podConfigRef:
      name: nextcloud-data-backup
  prune:
    schedule: "44 0 1 * *"
    concurrentRunsAllowed: false
    podConfigRef:
      name: nextcloud-prune
    retention:
      keepHourly: 6
      keepDaily: 14
      keepWeekly: 12
      keepMonthly: 6
      keepYearly: 2
---
apiVersion: k8up.io/v1
kind: PodConfig
metadata:
  name: nextcloud-data-backup
  namespace: default
spec:
  template:
    spec:
      # Hardening: Longhorn RWO only, no NFS (D2); files are uid/gid 82 (E3), so uid 82 is kept from the former Schedule podSecurityContext; read-only root (D6); no fsGroup, to avoid a recursive chown of the 100Gi volume
      hostUsers: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 82
        runAsGroup: 82
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backup
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: k8up.io/v1
kind: PodConfig
metadata:
  name: nextcloud-prune
  namespace: default
spec:
  template:
    spec:
      # Prune jobs only touch the S3 repository, not a PVC (D2 yes). The job's container is named "prune" (live Job spec), so container-level hardening (D5, D6, D8) must target that name. /tmp, /.cache and /k8up are k8up emptyDirs, so read-only root is compatible.
      hostUsers: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prune
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
