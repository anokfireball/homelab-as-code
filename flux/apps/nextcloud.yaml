apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nextcloud-redis
  namespace: default
spec:
  interval: 1m
  chart:
    spec:
      chart: valkey
      version: 0.12.0
      sourceRef:
        kind: HelmRepository
        name: valkey
        namespace: flux-system
  values:
    fullnameOverride: nextcloud-redis
    auth:
      enabled: true
      usersExistingSecret: nextcloud-secrets
      aclUsers:
        default:
          permissions: "~* &* +@all"
          passwordKey: redis-password
    # Cache/file-locking only; contents are reconstructible. An emptyDir keeps
    # this off RWO storage, whose single-node attachment deadlocks a rolling
    # update when the replacement pod is scheduled onto a different node.
    dataStorage:
      enabled: false
    image:
      tag: 9.1.2@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
  postRenderers:
    - kustomize:
        patches:
          # Hardening (D2): user namespace. uid 1000, drop ALL, read-only root, RuntimeDefault and no API token are already chart defaults (E2, E5)
          - target:
              kind: Deployment
              name: nextcloud-redis
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: nextcloud-redis
              spec:
                template:
                  spec:
                    hostUsers: false
