apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: n8n-postgresql
  namespace: default
spec:
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ClusterImageCatalog
    name: postgresql
    major: 17
  instances: 1
  # single instance: a PDB cannot protect anything and only blocks node drains
  enablePDB: false
  managed:
    services:
      disabledDefaultServices: ["ro", "r"]
    roles:
      - name: stashbackup
        passwordSecret:
          name: postgres-backup-user
        login: true
        superuser: false
        inRoles:
          - pg_read_all_data
  bootstrap:
    initdb:
      database: n8n
      owner: n8n
      secret:
        name: n8n-postgres-user
  storage:
    size: 5Gi
    storageClass: cluster-replicated
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: n8n
  namespace: default
spec:
  interval: 1m
  chart:
    spec:
      chart: n8n
      version: 23.2.8
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  values:
    image:
      repository: ghcr.io/n8n-io/n8n
      tag: "2.46.0@sha256:0a0e0640806e9426ab9c1498186175332810551b28129b5cfcd36060a9623f32"
      pullPolicy: IfNotPresent
    runnersImage:
      repository: n8nio/runners
      tag: "2.45.4@sha256:168fa154306a2b53436e30c1c7b386a37c880cbabd65f0d01e41d11e3c8ea3ce"
      pullPolicy: IfNotPresent
    service:
      main:
        annotations:
          tailscale.com/expose: "true"
          tailscale.com/hostname: homelab-n8n
        ports:
          main:
            port: 5678
            targetPort: 5678
    persistence:
      data:
        enabled: true
        mountPath: "/data"
        storageClass: cluster-scratch
        size: 5Gi
    redis:
      enabled: false
    cnpg:
      main:
        enabled: false
    portal:
      open:
        enabled: true
    securityContext:
      container:
        runAsUser: 1000
        runAsGroup: 1000
        readOnlyRootFilesystem: true
      pod:
        fsGroup: 1000
    workload:
      main:
        annotations:
          reloader.stakater.com/auto: "true"
        podSpec:
          hostUsers: false
          automountServiceAccountToken: false
          containers:
            main:
              probes:
                liveness:
                  path: "/healthz"
                readiness:
                  path: "/healthz"
                startup:
                  path: "/healthz"
              envFrom:
                - secretRef:
                    name: n8n-config
                    expandObjectName: false
              env:
                DB_TYPE: postgresdb
                DB_POSTGRESDB_HOST: n8n-postgresql-rw
                DB_POSTGRESDB_PORT: 5432
                DB_POSTGRESDB_USER:
                  secretKeyRef:
                    name: n8n-postgres-user
                    expandObjectName: false
                    key: username
                DB_POSTGRESDB_PASSWORD:
                  secretKeyRef:
                    name: n8n-postgres-user
                    expandObjectName: false
                    key: password
                DB_POSTGRESDB_DATABASE: n8n
                QUEUE_BULL_REDIS_HOST: ""
                QUEUE_BULL_REDIS_PORT: 6379
                QUEUE_BULL_REDIS_PASSWORD: ""
                GENERIC_TIMEZONE: "Europe/Berlin"
                N8N_DEFAULT_LOCALE: "de-DE"
                N8N_USER_FOLDER: /data
                N8N_EDITOR_BASE_URL: https://n8n.${SERVICE_DOMAIN}/
                WEBHOOK_URL: https://n8n.${SERVICE_DOMAIN}/
                N8N_RUNNERS_ENABLED: "true"
                N8N_RUNNERS_MODE: "external"
                N8N_RUNNERS_BROKER_LISTEN_ADDRESS: "0.0.0.0"
                N8N_RUNNERS_AUTH_TOKEN:
                  secretKeyRef:
                    name: n8n-runners-auth
                    expandObjectName: false
                    key: token
            task-runner:
              enabled: true
              imageSelector: runnersImage
              env:
                N8N_RUNNERS_TASK_BROKER_URI: "http://localhost:5679"
                N8N_RUNNERS_AUTH_TOKEN:
                  secretKeyRef:
                    name: n8n-runners-auth
                    expandObjectName: false
                    key: token
              probes:
                liveness:
                  enabled: false
                readiness:
                  enabled: false
                startup:
                  enabled: false
    ingress:
      main:
        enabled: false
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: n8n-gateway
  namespace: default
spec:
  interval: 1m
  chart:
    spec:
      chart: ./charts/gateway-route
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  values:
    name: n8n
    hostname: n8n.${SERVICE_DOMAIN}
    route:
      enabled: true
      backend:
        name: n8n
        port: 5678
---
apiVersion: k8up.io/v1
kind: PreBackupPod
metadata:
  name: n8n-database-backup
  namespace: default
  labels:
    backup: n8n-database
  annotations:
    k8up.io/backup: "true"
spec:
  backupCommand: sh -c 'PGHOST="$POSTGRES_HOST" PGUSER="$POSTGRES_USER" PGPASSWORD="$POSTGRES_PASSWORD" pg_dumpall --clean'
  pod:
    spec:
      automountServiceAccountToken: false
      hostUsers: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 26
        runAsGroup: 26
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: n8n-database-backup
          image: ghcr.io/cloudnative-pg/postgresql:17.11-standard-trixie@sha256:ed6923f9ba2399cf9070379a353c710c29ced8a294be73986a2c3dae7e599ce3
          command:
            - "sleep"
            - "infinity"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          env:
            - name: POSTGRES_HOST
              value: n8n-postgresql-rw
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-backup-user
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-backup-user
                  key: password
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: n8n-database
  namespace: default
spec:
  backend:
    repoPasswordSecretRef:
      name: k8up-restic-secrets
      key: restic-password
    s3:
      bucket: Habitat-Giggle9-Composer/n8n
  backup:
    labelSelectors:
      - matchLabels:
          backup: n8n-database
    schedule: "53 4/6 * * *"
    concurrentRunsAllowed: false
    podConfigRef:
      name: n8n-database-backup
  prune:
    schedule: "23 0 1 * *"
    concurrentRunsAllowed: false
    podConfigRef:
      name: n8n-database-prune
    retention:
      keepHourly: 6
      keepDaily: 14
      keepWeekly: 12
      keepMonthly: 6
      keepYearly: 2
---
apiVersion: k8up.io/v1
kind: PodConfig
metadata:
  name: n8n-database-backup
  namespace: default
spec:
  template:
    spec:
      hostUsers: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backup
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: k8up.io/v1
kind: PodConfig
metadata:
  name: n8n-database-prune
  namespace: default
spec:
  template:
    spec:
      hostUsers: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prune
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
