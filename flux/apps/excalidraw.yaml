apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: excalidraw
  namespace: default
spec:
  interval: 1m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      hostUsers: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    controllers:
      main:
        defaultContainerOptions:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
        initContainers:
          seed-conf:
            image:
              repository: excalidraw/excalidraw
              tag: latest@sha256:f7ee194addd607bf831d2af0f0a34463dd4225e426cf35199ef0b12a803398e9
            command: ["sh"]
            args: ["-c", "cp -R /etc/nginx/conf.d/. /seed/"]
        containers:
          main:
            image:
              repository: excalidraw/excalidraw
              # official images are not verisoned beyond "latest" currently
              tag: latest@sha256:f7ee194addd607bf831d2af0f0a34463dd4225e426cf35199ef0b12a803398e9
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
    persistence:
      run:
        type: emptyDir
        globalMounts:
          - path: /run
      nginx-cache:
        type: emptyDir
        globalMounts:
          - path: /var/cache/nginx
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      # seeded from the image's conf.d by the seed-conf init container; the entrypoint rewrites default.conf in place
      nginx-conf:
        type: emptyDir
        advancedMounts:
          main:
            main:
              - path: /etc/nginx/conf.d
            seed-conf:
              - path: /seed
    service:
      main:
        controller: main
        ports:
          http:
            port: 80
    ingress:
      main:
        enabled: false
    route:
      main:
        enabled: true
        kind: HTTPRoute
        parentRefs:
          - group: gateway.networking.k8s.io
            kind: ListenerSet
            name: excalidraw
            namespace: default
            sectionName: https
        hostnames:
          - excalidraw.${SERVICE_DOMAIN}
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - identifier: main
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: excalidraw-gateway
  namespace: default
spec:
  interval: 1m
  chart:
    spec:
      chart: ./charts/gateway-route
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  values:
    name: excalidraw
    hostname: excalidraw.${SERVICE_DOMAIN}
