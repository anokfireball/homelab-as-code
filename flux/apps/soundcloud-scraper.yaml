apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: soundcloud-scraper
  namespace: default
spec:
  interval: 1m
  chart:
    spec:
      chart: app-template
      version: 5.2.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    controllers:
      main:
        type: cronjob
        cronjob:
          schedule: "*/15 * * * *"
          concurrencyPolicy: Replace
        annotations:
          healthcheckSecret: soundcloud-scraper-secrets
          healthcheckImage: ghcr.io/anokfireball/base-image:3.24.2@sha256:ec0f0361cbe50eb1cb598da877f44bc4daa3189e9d02512c042544086bd506a7
        containers:
          main:
            image:
              repository: ghcr.io/anokfireball/soundcloud-scraper
              tag: v1.3.1@sha256:3524cb7be69f42f79902f8b2441a1cd8fa00e5c8a180091c88ee6bfd0354a5c2
            env:
              DATA_DIR: /data
              SOUNDCLOUD_USERNAME: psykko0
            envFrom:
              - secret: soundcloud-scraper-secrets
    persistence:
      data:
        type: persistentVolumeClaim
        storageClass: cluster-replicated
        accessMode: ReadWriteOnce
        size: 500Mi
