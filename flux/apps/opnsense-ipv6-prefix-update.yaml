apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opnsense-ipv6-prefix-update
  namespace: default
spec:
  interval: 1m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    defaultPodOptions:
      hostUsers: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
    controllers:
      main:
        type: cronjob
        cronjob:
          schedule: "*/1 * * * *"
        annotations:
          healthcheckSecret: opnsense-ipv6-prefix-update-secrets
          healthcheckImage: ghcr.io/anokfireball/base-image:3.24.3@sha256:5b9f5d72791bc19e943e8632ab617624c89b7d0fdb3d32be070a3e09a7bca03c
        containers:
          main:
            image:
              repository: ghcr.io/anokfireball/opnsense-ipv6-prefix-update
              tag: v1.0.7@sha256:8073ce1257d284c76d96d2f4b134a7a803617ebe6614def0da91197177d3c12f
            env:
              OPNSENSE_HOST: 192.168.1.1
              OPNSENSE_PORT: 80
              OPNSENSE_SSL: "false"
              OPNSENSE_VERIFY_SSL: "true"
              IPV6_PREFIX_LENGTH: 57
            envFrom:
              - secret: opnsense-ipv6-prefix-update-secrets
            securityContext:
              runAsNonRoot: true
              runAsUser: 65534
              runAsGroup: 65534
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
