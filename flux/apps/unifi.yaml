apiVersion: mongodbcommunity.mongodb.com/v1
kind: MongoDBCommunity
metadata:
  name: unifi-mongodb
  namespace: default
spec:
  # Keep this single-member ReplicaSet minimal for Unifi; expand later only if needed.
  members: 1
  type: ReplicaSet
  version: "9.0.4"
  security:
    authentication:
      modes:
        - SCRAM
  users:
    - name: unifi-admin
      db: admin
      passwordSecretRef:
        name: unifi-secrets
        key: mongodb-root-password
      roles:
        - name: root
          db: admin
      scramCredentialsSecretName: unifi-admin-scram
    - name: unifi
      db: admin
      passwordSecretRef:
        name: unifi-secrets
        key: mongodb-password
      roles:
        - name: clusterMonitor
          db: admin
        - name: dbOwner
          db: unifi
        - name: dbOwner
          db: unifi_stat
        - name: dbOwner
          db: unifi_audit
        - name: dbOwner
          db: unifi_restore
      scramCredentialsSecretName: unifi-scram
  statefulSet:
    spec:
      serviceName: unifi-mongodb-svc
      # Pod hardening (D2): data/logs are Longhorn RWO PVCs and mongod runs as uid 2000 only.
      template:
        spec:
          hostUsers: false
      volumeClaimTemplates:
        - metadata:
            name: data-volume
          spec:
            accessModes:
              - ReadWriteOnce
            storageClassName: cluster-replicated
            resources:
              requests:
                storage: 2Gi
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: unifi-controller
  namespace: default
spec:
  interval: 1m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    defaultPodOptions:
      # D2: no NFS/RWX/hostPath volumes; /config is Longhorn RWO and all its files are uid/gid 911 (<= 65535).
      hostUsers: false
      # D7: E5 empty (no RBAC bound to unifi-controller SA).
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      annotations:
        k8up.io/backup: "true"
        k8up.io/backupcommand: sh -c 'cat "$(ls -t /config/data/backup/*.unf | head -n1)"'
        k8up.io/file-extension: .unf
        k8up.io/backupcommand-container: main
      labels:
        backup: unifi-data
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/linuxserver/unifi-network-application
              tag: 10.6.109@sha256:8389f585c6443af7051b4696a09e4bb5408636da7f99c5a0e5a883595c1d434c
            env:
              TZ: Europe/Berlin
              MONGO_HOST: unifi-mongodb-svc
              MONGO_PORT: 27017
              MONGO_USER: unifi
              MONGO_PASS:
                valueFrom:
                  secretKeyRef:
                    name: unifi-secrets
                    key: mongodb-password
              MONGO_DBNAME: unifi
              MONGO_AUTHSOURCE: admin
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /setup/
                    port: 8080
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /setup/
                    port: 8080
            resources:
              requests:
                cpu: 20m
                memory: 800Mi
            # readOnlyRootFilesystem stays unset: LSIO init rewrites /etc/passwd and /etc/group and links /usr/lib/unifi/{data,logs,run} on every start (Step 8 exception).
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
                # Each add-back fails without it under drop ALL: CHOWN (init chown of /config, /app, /defaults), SETUID/SETGID (s6-applyuidgid: unable to set supplementary group list, java as 911), DAC_OVERRIDE (root init writes into 911-owned /config and /defaults).
                add: ["CHOWN", "DAC_OVERRIDE", "SETGID", "SETUID"]
    service:
      external:
        controller: main
        type: LoadBalancer
        annotations:
          metallb.io/allow-shared-ip: default
          metallb.io/address-pool: default-vip
        ports:
          controller:
            port: 8080
            protocol: HTTP
          speedtest:
            port: 6789
            protocol: TCP
          stun:
            port: 3478
            protocol: UDP
          syslog:
            port: 5514
            protocol: UDP
          discovery:
            port: 10001
            protocol: UDP
          l2discovery:
            port: 1900
            protocol: UDP
      internal:
        controller: main
        ports:
          https:
            port: 8443
            protocol: HTTPS
    ingress:
      main:
        enabled: false
    persistence:
      config:
        type: persistentVolumeClaim
        storageClass: cluster-replicated
        accessMode: ReadWriteOnce
        size: 2Gi
        globalMounts:
          - path: /config
---
apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: unifi-data
  namespace: default
spec:
  backend:
    repoPasswordSecretRef:
      name: k8up-restic-secrets
      key: restic-password
    s3:
      bucket: Brunette-Repeater-Founding8
  backup:
    labelSelectors:
      - matchLabels:
          backup: unifi-data
    schedule: "21 2 * * *"
    concurrentRunsAllowed: false
    podConfigRef:
      name: unifi-data-backup
  prune:
    schedule: "51 0 1 * *"
    concurrentRunsAllowed: false
    podConfigRef:
      name: unifi-data-prune
    retention:
      keepHourly: 6
      keepDaily: 14
      keepWeekly: 12
      keepMonthly: 6
      keepYearly: 2
---
apiVersion: k8up.io/v1
kind: PodConfig
metadata:
  name: unifi-data-backup
  namespace: default
spec:
  template:
    spec:
      # restic only streams what the unifi pod's backupcommand prints; it needs no volumes
      hostUsers: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backup
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: k8up.io/v1
kind: PodConfig
metadata:
  name: unifi-data-prune
  namespace: default
spec:
  template:
    spec:
      hostUsers: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prune
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: unifi-gateway
  namespace: default
spec:
  interval: 1m
  chart:
    spec:
      chart: ./charts/gateway-route
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  values:
    name: unifi
    hostname: unifi.${SERVICE_DOMAIN}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: unifi-tls-backend
  namespace: default
spec:
  endpoints:
    - fqdn:
        hostname: unifi-controller-internal.default.svc.cluster.local
        port: 8443
  tls:
    insecureSkipVerify: true
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: unifi
  namespace: default
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: unifi
      namespace: default
      sectionName: https
  hostnames:
    - unifi.${SERVICE_DOMAIN}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: unifi-tls-backend
