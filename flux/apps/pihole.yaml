apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pihole
  namespace: default
spec:
  interval: 1m
  chart:
    spec:
      chart: pihole
      version: 2.39.0
      sourceRef:
        kind: HelmRepository
        name: mojo2600
        namespace: flux-system
  values:
    dualStack:
      enabled: false
    serviceDns:
      mixedService: true
      type: LoadBalancer
      externalTrafficPolicy: Local
      annotations:
        metallb.io/address-pool: dns-vip
    serviceDhcp:
      enabled: false
    ingress:
      enabled: false
    resources:
      requests:
        cpu: 10m
        memory: 100Mi
    admin:
      enabled: false
    extraEnvVars:
      FTLCONF_dns_cache_size: 0
      # No password is set (admin.enabled: false), so FTL >= v6.8 (GHSA-322h-f873-hp54) serves the
      # dashboard only under an IP, localhost, pi.hole, its hostname or webserver.domain; any other
      # Host, such as the gateway route below, gets a 403.
      FTLCONF_webserver_domain: pihole.${SERVICE_DOMAIN}
    DNS1: 192.168.1.1
    DNS2: fe80::1
    dnsmasq:
      customSettings:
        # https://docs.pi-hole.net/ftldns/interfaces/#all
        useAllInterfaces: except-interface=nonexisting
    adlists:
      # everything but the kitchen sink
      - https://big.oisd.nl
      - https://raw.githubusercontent.com/hagezi/dns-blocklists/main/adblock/pro.txt
      - https://raw.githubusercontent.com/RooneyMcNibNug/pihole-stuff/master/SNAFU.txt
      - https://v.firebog.net/hosts/static/w3kbl.txt
      # ads
      - https://raw.githubusercontent.com/anudeepND/blacklist/master/adservers.txt
      - https://raw.githubusercontent.com/bigdargon/hostsVN/master/hosts
      - https://v.firebog.net/hosts/Easylist.txt
      - https://adguardteam.github.io/AdGuardSDNSFilter/Filters/filter.txt
      - https://raw.githubusercontent.com/badmojr/1Hosts/master/Lite/hosts.txt
      - https://raw.githubusercontent.com/privacy-protection-tools/anti-AD/master/anti-ad-domains.txt
      # tracking
      - https://gitlab.com/quidsup/notrack-blocklists/raw/master/notrack-blocklist.txt
      - https://hostfiles.frogeye.fr/multiparty-trackers-hosts.txt
      - https://v.firebog.net/hosts/Easyprivacy.txt
      - https://v.firebog.net/hosts/Prigent-Ads.txt
      - https://filters.adtidy.org/extension/ublock/filters/3.txt
      # trackers hidden behind first-party CNAMEs
      - https://raw.githubusercontent.com/AdguardTeam/cname-trackers/master/data/combined_disguised_trackers_justdomains.txt
      - https://raw.githubusercontent.com/AdguardTeam/cname-trackers/master/data/combined_original_trackers.txt
      # dangerous stuff
      - https://gitlab.com/quidsup/notrack-blocklists/raw/master/notrack-malware.txt
      # URLhaus itself needs an abuse.ch Auth-Key since 2026-10; this mirror fetches it with one.
      - https://malware-filter.gitlab.io/malware-filter/urlhaus-filter-hosts.txt
      - https://phishing.army/download/phishing_army_blocklist_extended.txt
      - https://raw.githubusercontent.com/AssoEchap/stalkerware-indicators/master/generated/hosts_full
      - https://raw.githubusercontent.com/DandelionSprout/adfilt/master/Alternate%20versions%20Anti-Malware%20List/AntiMalwareHosts.txt
      - https://raw.githubusercontent.com/durablenapkin/scamblocklist/master/hosts.txt
      - https://raw.githubusercontent.com/hagezi/dns-blocklists/main/adblock/tif.txt
      - https://raw.githubusercontent.com/RPiList/specials/master/Blocklisten/Phishing-Angriffe
      - https://raw.githubusercontent.com/RPiList/specials/refs/heads/master/Blocklisten/notserious
      - https://v.firebog.net/hosts/Prigent-Crypto.txt
      - https://v.firebog.net/hosts/Prigent-Malware.txt
      # DNS-verified live phishing domains; lists qrco.de (allowed below)
      - https://raw.githubusercontent.com/phishdestroy/destroylist/main/dns/active_domains.txt
      # spam
      - https://raw.githubusercontent.com/matomo-org/referrer-spam-blacklist/master/spammers.txt
      # bad reputation
      - https://raw.githubusercontent.com/autinerd/anti-axelspringer-hosts/master/axelspringer-hosts
      - https://raw.githubusercontent.com/hagezi/dns-blocklists/main/adblock/gambling.txt
      - https://raw.githubusercontent.com/RPiList/specials/master/Blocklisten/Fake-Science
      - https://raw.githubusercontent.com/StevenBlack/hosts/master/alternates/fakenews-gambling/hosts
      # device / service specific
      - https://raw.githubusercontent.com/Perflyst/PiHoleBlocklist/master/SmartTV.txt
      - https://a.dove.isdumb.one/pihole.txt
      # DOH (DNS is totalitarian in this network!)
      - https://raw.githubusercontent.com/jpgpi250/piholemanual/master/DOH/DOHadb.txt
      - https://raw.githubusercontent.com/dibdot/DoH-IP-blocklists/master/doh-domains_overall.txt
    whitelist:
      - ${SMTP_HOST}
      - jnn-pa.googleapis.com
      - qrco.de
      - idealo.de
      - www.idealo.de
      - flug.idealo.de
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
    podDnsConfig:
      enabled: true
      policy: None
      nameservers:
        - 192.168.1.1
        - fe80::1
    image:
      repository: pihole/pihole
      # digest is the multi-arch index of the tag below (= chart appVersion)
      tag: "2026.11.0@sha256:66c798d79a95c2691f280329c3611dba1746117c61c9f331907ca35a06a52778"
    # D5: drop ALL, add back only what V2 showed failing (see PR body). NET_BIND_SERVICE is not
    # needed: pods set net.ipv4.ip_unprivileged_port_start=0, so FTL binds 53/80/443 unprivileged.
    capabilities:
      drop: ["ALL"]
      add: [CHOWN, DAC_OVERRIDE, FOWNER, KILL, SETFCAP, SETGID, SETUID]
    # D6: emptyDirs for every E6 path (root filesystem stays writable for /crontab.txt, see Kyverno exception).
    extraVolumes:
      tmp:
        emptyDir: {}
      run:
        emptyDir: {}
      var-tmp:
        emptyDir: {}
      var-log-pihole:
        emptyDir: {}
      etc-crontabs:
        emptyDir: {}
    extraVolumeMounts:
      tmp:
        mountPath: /tmp
      run:
        mountPath: /run
      var-tmp:
        mountPath: /var/tmp
      var-log-pihole:
        mountPath: /var/log/pihole
      etc-crontabs:
        mountPath: /etc/crontabs
  # Chart has no knobs for pod hostUsers/seccomp/automount or container allowPrivilegeEscalation.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: pihole
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: pihole
              spec:
                template:
                  spec:
                    automountServiceAccountToken: false
                    hostUsers: false
                    securityContext:
                      seccompProfile:
                        type: RuntimeDefault
                    containers:
                      - name: pihole
                        securityContext:
                          allowPrivilegeEscalation: false
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pihole-gateway
  namespace: default
spec:
  interval: 1m
  chart:
    spec:
      chart: ./charts/gateway-route
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  values:
    name: pihole
    hostname: pihole.${SERVICE_DOMAIN}
    route:
      enabled: true
      backend:
        name: pihole-web
        port: 80
