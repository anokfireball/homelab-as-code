apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
  namespace: arrchive
spec:
  interval: 1m
  chart:
    spec:
      chart: jellyfin
      version: 3.7.0
      sourceRef:
        kind: HelmRepository
        name: jellyfin
        namespace: flux-system
  values:
    image:
      repository: ghcr.io/jellyfin/jellyfin
      tag: 10.11.11@sha256:45f648c382a0c8b552582fcea40e95cb17c5d475473a891cba0eb7523fb92112
    serviceAccount:
      # no RBAC bindings for this ServiceAccount (Step 2 E5); no API token needed
      automount: false
    deploymentStrategy:
      type: Recreate
    ingress:
      enabled: false
    httpRoute:
      enabled: true
      parentRefs:
        - group: gateway.networking.k8s.io
          kind: ListenerSet
          name: jellyfin
          namespace: arrchive
          sectionName: https
    volumes:
      - name: nas-filme
        nfs:
          server: 192.168.1.2
          path: /mnt/tank/Filme
      - name: nas-serien
        nfs:
          server: 192.168.1.2
          path: /mnt/tank/Serien
      - name: tmp
        emptyDir: {}
      - name: dictionaries
        emptyDir: {}
      # - name: gpu
      #   hostPath:
      #     path: /dev/dri/renderD128
    volumeMounts:
      - name: nas-filme
        mountPath: /mnt/tank/Filme
      - name: nas-serien
        mountPath: /mnt/tank/Serien
      - name: tmp
        mountPath: /tmp
      - name: dictionaries
        mountPath: /jellyfin/Dictionaries
      # - name: gpu
      #   mountPath: /dev/dri/renderD128
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      # one-time recursive chgrp of /config (group 993 today); OnRootMismatch keeps later starts cheap
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]
    jellyfin:
      env:
        # ASP.NET Data Protection writes $HOME/.aspnet; uid 1000 has no passwd entry (HOME=/) and / is read-only.
        - name: HOME
          value: /tmp
    persistence:
      config:
        storageClass: cluster-replicated
        size: 10Gi
      media:
        enabled: false
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin-gateway
  namespace: arrchive
spec:
  interval: 1m
  chart:
    spec:
      chart: ./charts/gateway-route
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  values:
    name: jellyfin
    hostname: jellyfin.${SERVICE_DOMAIN}
