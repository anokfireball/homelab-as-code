apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: paperless-ngx-postgresql
  namespace: default
spec:
  # Current paperless-ngx is built with PG 15, also use that as long as it is supported
  # https://github.com/paperless-ngx/paperless-ngx/blob/v2.13.5/Dockerfile#L96
  # https://packages.debian.org/de/bookworm/postgresql-client
  # https://www.postgresql.org/support/versioning/
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ClusterImageCatalog
    name: postgresql
    major: 15
  instances: 1
  # single instance: a PDB cannot protect anything and only blocks node drains
  enablePDB: false
  managed:
    services:
      disabledDefaultServices: ["ro", "r"]
    roles:
      - name: stashbackup
        passwordSecret:
          name: postgres-backup-user
        login: true
        superuser: false
        inRoles:
          - pg_read_all_data
  bootstrap:
    initdb:
      database: paperless-ngx
      owner: paperless-ngx
      secret:
        name: paperless-postgres-user
  storage:
    size: 2Gi
    storageClass: cluster-replicated
---
apiVersion: k8up.io/v1
kind: PreBackupPod
metadata:
  name: paperless-database-backup
  namespace: default
  labels:
    backup: paperless-database
  annotations:
    k8up.io/backup: "true"
spec:
  # Hold the dump until restic reads stdin; pending output kills the exec stream.
  backupCommand: sh -c 'sleep 60 && PGHOST="$POSTGRES_HOST" PGUSER="$POSTGRES_USER" PGPASSWORD="$POSTGRES_PASSWORD" pg_dumpall --clean'
  pod:
    spec:
      hostUsers: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 26
        runAsGroup: 26
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: paperless-database-backup
          image: ghcr.io/cloudnative-pg/postgresql:15.20-standard-trixie@sha256:811ff8a5a3d5c56bc0b6a3ff78792927d559277eccf724c25eff9853e5144b4f
          command:
            - "sleep"
            - "infinity"
          env:
            - name: POSTGRES_HOST
              value: paperless-ngx-postgresql-rw
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-backup-user
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-backup-user
                  key: password
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: paperless-database
  namespace: default
spec:
  backend:
    repoPasswordSecretRef:
      name: k8up-restic-secrets
      key: restic-password
    s3:
      bucket: Habitat-Giggle9-Composer/paperless
  backup:
    labelSelectors:
      - matchLabels:
          backup: paperless-database
    schedule: "39 4/6 * * *"
    concurrentRunsAllowed: false
    podConfigRef:
      name: paperless-database-backup
  prune:
    schedule: "9 0 1 * *"
    concurrentRunsAllowed: false
    podConfigRef:
      name: paperless-database-prune
    retention:
      keepHourly: 6
      keepDaily: 14
      keepWeekly: 12
      keepMonthly: 6
      keepYearly: 2
---
apiVersion: k8up.io/v1
kind: PodConfig
metadata:
  name: paperless-database-backup
  namespace: default
spec:
  template:
    spec:
      hostUsers: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backup
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
---
apiVersion: k8up.io/v1
