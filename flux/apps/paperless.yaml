          - key: paperless_vlm_ocr--parser.py
            path: paperless_vlm_ocr/parser.py
          - key: paperless_vlm_ocr--scan.py
            path: paperless_vlm_ocr/scan.py
          - key: paperless_vlm_ocr--vlm.py
            path: paperless_vlm_ocr/vlm.py
        globalMounts:
          - path: /usr/src/paperless/vlm-ocr
            readOnly: true
      data:
        type: persistentVolumeClaim
        storageClass: cluster-replicated
        accessMode: ReadWriteOnce
        size: 2Gi
        globalMounts:
          - path: /usr/src/paperless/data
      consume:
        type: nfs
        server: 192.168.1.2
        path: /mnt/tank/Dokumente/Paperless/consume
        globalMounts:
          - path: /usr/src/paperless/consume
      media:
        type: persistentVolumeClaim
        storageClass: cluster-replicated
        accessMode: ReadWriteOnce
        size: 25Gi
        globalMounts:
          - path: /usr/src/paperless/media
      export:
        existingClaim: nas-dokumente-export
        globalMounts:
          - path: /usr/src/paperless/export
      run:
        type: emptyDir
        globalMounts:
          - path: /run
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperless-ngx-export
  namespace: default
spec:
  interval: 1m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    global:
      alwaysAppendIdentifierToResourceName: true
    defaultPodOptions:
      affinity:
        # co-locate with paperless so its RWO data/media volumes can attach
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/instance: paperless-ngx
                  app.kubernetes.io/controller: main
              topologyKey: kubernetes.io/hostname
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    controllers:
      main:
        type: cronjob
        cronjob:
          schedule: "* * * * *"
          concurrencyPolicy: Forbid
        annotations:
          healthcheckSecret: paperless-secrets
          healthcheckImage: ghcr.io/anokfireball/base-image:3.24.4@sha256:cb0ec79a5183ad6fae8a73766dbd9cf2a69628dc9c966c0eed9a6ea217fa0f2c
        containers:
          main:
            image:
              repository: ghcr.io/paperless-ngx/paperless-ngx
              tag: 3.5.1@sha256:8508853b8a0f8394074260957d0be186c8c64f346973b24a7583de4580f306b9
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            command:
              - /bin/bash
              - -c
              - |
                set -euo pipefail
                DIRTY_FILE="/usr/src/paperless/export/.paperless-dirty"
                if [ -f "$DIRTY_FILE" ]; then
                  MTIME=$(stat -c %Y "$DIRTY_FILE" 2>/dev/null || echo 0)
                  AGE=$(( $(date +%s) - MTIME ))
                  if [ "$AGE" -ge 600 ]; then
                    # invoke via bash so the with-contenv shebang is bypassed and
                    # the process env (k8s) is inherited directly (no s6 envdir).
                    bash /usr/local/bin/document_exporter /usr/src/paperless/export --no-progress-bar
                    rm -f "$DIRTY_FILE"
                  fi
                fi
            env:
              PAPERLESS_DBENGINE: postgresql
              PAPERLESS_DBHOST: paperless-ngx-postgresql-rw
              PAPERLESS_DBUSER: paperless-ngx
              PAPERLESS_DBNAME: paperless-ngx
              PAPERLESS_REDIS: redis://paperless-ngx-redis-master:6379
              PAPERLESS_DBPASS:
                valueFrom:
                  secretKeyRef:
                    name: paperless-postgres-user
                    key: password
              PAPERLESS_SECRET_KEY:
                valueFrom:
                  secretKeyRef:
                    name: paperless-secrets
                    key: paperless-secret-key
    persistence:
      media:
        type: persistentVolumeClaim
        existingClaim: paperless-ngx-media
        globalMounts:
          - path: /usr/src/paperless/media
      data:
        type: persistentVolumeClaim
        existingClaim: paperless-ngx-data
        globalMounts:
          - path: /usr/src/paperless/data
      export:
        type: nfs
        server: 192.168.1.2
        path: /mnt/tank/Dokumente/Paperless/export
        globalMounts:
          - path: /usr/src/paperless/export
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperless-ngx-gateway
  namespace: default
spec:
  interval: 1m
  chart:
    spec:
      chart: ./charts/gateway-route
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  values:
    name: paperless-ngx
    hostname: paperless.${SERVICE_DOMAIN}
