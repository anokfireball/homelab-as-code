apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: paperless-ngx-postgresql
  namespace: default
spec:
  # Current paperless-ngx is built with PG 15, also use that as long as it is supported
  # https://github.com/paperless-ngx/paperless-ngx/blob/v2.13.5/Dockerfile#L96
  # https://packages.debian.org/de/bookworm/postgresql-client
  # https://www.postgresql.org/support/versioning/
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ClusterImageCatalog
    name: postgresql
    major: 15
  instances: 1
  # single instance: a PDB cannot protect anything and only blocks node drains
  enablePDB: false
  managed:
    services:
      disabledDefaultServices: ["ro", "r"]
    roles:
      - name: stashbackup
        passwordSecret:
          name: postgres-backup-user
        login: true
        superuser: false
        inRoles:
          - pg_read_all_data
  bootstrap:
    initdb:
      database: paperless-ngx
      owner: paperless-ngx
      secret:
        name: paperless-postgres-user
  storage:
    size: 2Gi
    storageClass: cluster-replicated
---
apiVersion: k8up.io/v1
kind: PreBackupPod
metadata:
  name: paperless-database-backup
  namespace: default
  labels:
    backup: paperless-database
  annotations:
    k8up.io/backup: "true"
spec:
  backupCommand: sh -c 'PGHOST="$POSTGRES_HOST" PGUSER="$POSTGRES_USER" PGPASSWORD="$POSTGRES_PASSWORD" pg_dumpall --clean'
  pod:
    spec:
      hostUsers: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 26
        runAsGroup: 26
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: paperless-database-backup
          image: ghcr.io/cloudnative-pg/postgresql:15.19-standard-trixie@sha256:d3c7416df846a21024cce4768c16d52220315521a1395b5f645ff1a0b36e08f1
          command:
            - "sleep"
            - "infinity"
          env:
            - name: POSTGRES_HOST
              value: paperless-ngx-postgresql-rw
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-backup-user
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-backup-user
                  key: password
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: paperless-database
  namespace: default
spec:
  backend:
    repoPasswordSecretRef:
      name: k8up-restic-secrets
      key: restic-password
    s3:
      bucket: Habitat-Giggle9-Composer/paperless
  backup:
    labelSelectors:
      - matchLabels:
          backup: paperless-database
    schedule: "39 4/6 * * *"
    concurrentRunsAllowed: false
    podConfigRef:
      name: paperless-database-backup
  prune:
    schedule: "9 0 1 * *"
    concurrentRunsAllowed: false
    podConfigRef:
      name: paperless-database-prune
    retention:
      keepHourly: 6
      keepDaily: 14
      keepWeekly: 12
      keepMonthly: 6
      keepYearly: 2
---
apiVersion: k8up.io/v1
kind: PodConfig
metadata:
  name: paperless-database-backup
  namespace: default
spec:
  template:
    spec:
      hostUsers: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backup
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
---
apiVersion: k8up.io/v1
kind: PodConfig
metadata:
  name: paperless-database-prune
  namespace: default
spec:
  template:
    spec:
      hostUsers: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prune
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperless-ngx-redis
  namespace: default
spec:
  interval: 1m
  chart:
    spec:
      chart: valkey
      version: 0.12.0
      sourceRef:
        kind: HelmRepository
        name: valkey
        namespace: flux-system
  values:
    fullnameOverride: paperless-ngx-redis-master
    image:
      repository: valkey/valkey
      # 9.1.2 = chart appVersion (0.12.0); index digest from docker buildx imagetools inspect
      tag: 9.1.2@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
    # Celery broker only; contents are reconstructible. An emptyDir keeps this
    # off RWO storage, whose single-node attachment deadlocks a rolling update
    # when the replacement pod is scheduled onto a different node.
    dataStorage:
      enabled: false
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: paperless-ngx-redis-master
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: paperless-ngx-redis-master
              spec:
                template:
                  spec:
                    # the valkey chart has no hostUsers value; this pod has only configMap and emptyDir volumes
                    hostUsers: false
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nas-dokumente-export
spec:
  capacity:
    storage: 1Mi
  accessModes:
    - ReadWriteOnce
  nfs:
    server: 192.168.1.2
    path: /mnt/tank/Dokumente/Paperless/export
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nas-dokumente-export
  namespace: default
  annotations:
    # Export dir is populated by the paperless-ngx-export CronJob, which runs a
    # debounced document_exporter 10min after the last ingested document (via
    # the .paperless-dirty sentinel written by the post-consume script). restic
    # then backs up this directory incrementally via the paperless-data Schedule.
    k8up.io/backup: "true"
  labels:
    backup: paperless-data
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  resources:
    requests:
      storage: 1Mi
  volumeName: nas-dokumente-export
---
apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: paperless-data
  namespace: default
spec:
  backend:
    repoPasswordSecretRef:
      name: k8up-restic-secrets
      key: restic-password
    s3:
      bucket: Sighing-Guacamole-Shading7
  backup:
    labelSelectors:
      - matchLabels:
          backup: paperless-data
    schedule: "32 0/6 * * *"
    concurrentRunsAllowed: false
    podConfigRef:
      name: paperless-data-backup
  prune:
    schedule: "02 0 1 * *"
    concurrentRunsAllowed: false
    podConfigRef:
      name: paperless-data-prune
    retention:
      keepHourly: 6
      keepDaily: 14
      keepWeekly: 12
      keepMonthly: 6
      keepYearly: 2
---
apiVersion: k8up.io/v1
kind: PodConfig
metadata:
  name: paperless-data-backup
  namespace: default
spec:
  template:
    spec:
      # no hostUsers: backup mounts the NFS-backed PVC nas-dokumente-export (PolicyException audit-user-namespaces-default-paperless-data-backup)
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backup
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
---
apiVersion: k8up.io/v1
