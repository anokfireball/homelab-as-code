apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperless-ngx-redis
  namespace: default
spec:
  interval: 1m
  chart:
    spec:
      chart: valkey
      version: 1.0.0
      sourceRef:
        kind: HelmRepository
        name: valkey
        namespace: flux-system
  values:
    fullnameOverride: paperless-ngx-redis-master
    image:
      repository: valkey/valkey
      # index digest from docker buildx imagetools inspect
      tag: 9.1.3@sha256:3add1a336a920ea54770a001ab6feb3da5fceea96a40373a3a2cd469b815f0b7
    # Celery broker only; contents are reconstructible. An emptyDir keeps this
    # off RWO storage, whose single-node attachment deadlocks a rolling update
    # when the replacement pod is scheduled onto a different node.
    persistence:
      enabled: false
    # Required: chart 1.0 defaults to Recreate, which SSA rejects against the
    # live rollingUpdate block. RollingUpdate is safe on an emptyDir.
    deploymentStrategy: RollingUpdate
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: paperless-ngx-redis-master
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: paperless-ngx-redis-master
              spec:
                template:
                  spec:
                    # the valkey chart has no hostUsers value; this pod has only configMap and emptyDir volumes
                    hostUsers: false
---
