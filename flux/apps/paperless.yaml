apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperless-ngx
  namespace: default
spec:
  interval: 1m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    global:
      alwaysAppendIdentifierToResourceName: true
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/paperless-ngx/paperless-ngx
              tag: 3.3.4@sha256:9bc6e8248891bcfa6f52fffe8b81e4ea8cae75790c3ec1b9906961a7ba55c969
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                add:
                  # s6 init runs setgroups(2) as uid 1000; without CAP_SETGID it fails with "unable to set supplementary group list"
                  - SETGID
                drop:
                  - ALL
            env:
              PAPERLESS_OCR_LANGUAGES: deu eng
              PAPERLESS_OCR_LANGUAGE: deu+eng
              PAPERLESS_URL: https://paperless.${SERVICE_DOMAIN}
              PAPERLESS_SECRET_KEY:
                valueFrom:
                  secretKeyRef:
                    name: paperless-secrets
                    key: paperless-secret-key
              PAPERLESS_TIME_ZONE: Europe/Berlin
              PAPERLESS_CONSUMER_DELETE_DUPLICATES: true
              PAPERLESS_CONSUMER_RECURSIVE: true
              PAPERLESS_CONSUMER_POLLING_INTERVAL: 60
              PAPERLESS_POST_CONSUME_SCRIPT: /postconsumptionscript/touch.sh
              PAPERLESS_DBHOST: paperless-ngx-postgresql-rw
              PAPERLESS_DBUSER: paperless-ngx
              PAPERLESS_DBENGINE: postgresql
              PAPERLESS_DBPASS:
                valueFrom:
                  secretKeyRef:
                    name: paperless-postgres-user
                    key: password
              PAPERLESS_DBNAME: paperless-ngx
              PAPERLESS_REDIS: redis://paperless-ngx-redis-master:6379
              # s6 preinit refuses a root-owned /run on an emptyDir when running as uid 1000; opt in to the world-writable /run
              S6_YES_I_WANT_A_WORLD_WRITABLE_RUN_BECAUSE_KUBERNETES: "1"
            probes:
              liveness:
                enabled: true
                spec:
                  initialDelaySeconds: 120
              readiness:
                enabled: true
                spec:
                  initialDelaySeconds: 60
            resources:
              requests:
                cpu: 10m
                memory: 1Gi
    configMaps:
      postconsumptionscript:
        data:
          touch.sh: |
            #!/usr/bin/env bash
            touch /usr/src/paperless/export/.paperless-dirty
    service:
      main:
        controller: main
        annotations:
          tailscale.com/expose: "true"
          tailscale.com/hostname: homelab-paperless
        ports:
          http:
            port: 8000
    ingress:
      main:
        enabled: false
    route:
      main:
        enabled: true
        kind: HTTPRoute
        parentRefs:
          - group: gateway.networking.k8s.io
            kind: ListenerSet
            name: paperless-ngx
            namespace: default
            sectionName: https
        hostnames:
          - paperless.${SERVICE_DOMAIN}
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - identifier: main
    persistence:
      postconsumptionscript:
        type: configMap
        name: paperless-ngx-postconsumptionscript
        defaultMode: 0755
      data:
        type: persistentVolumeClaim
        storageClass: cluster-replicated
        accessMode: ReadWriteOnce
        size: 2Gi
        globalMounts:
          - path: /usr/src/paperless/data
      consume:
        type: nfs
        server: 192.168.1.2
        path: /mnt/tank/Dokumente/Paperless/consume
        globalMounts:
          - path: /usr/src/paperless/consume
      media:
        type: persistentVolumeClaim
        storageClass: cluster-replicated
        accessMode: ReadWriteOnce
        size: 25Gi
        globalMounts:
          - path: /usr/src/paperless/media
      export:
        existingClaim: nas-dokumente-export
        globalMounts:
          - path: /usr/src/paperless/export
      run:
        type: emptyDir
        globalMounts:
          - path: /run
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperless-ngx-export
  namespace: default
spec:
  interval: 1m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    global:
      alwaysAppendIdentifierToResourceName: true
    defaultPodOptions:
      affinity:
        # co-locate with paperless so its RWO data/media volumes can attach
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/instance: paperless-ngx
                  app.kubernetes.io/controller: main
              topologyKey: kubernetes.io/hostname
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    controllers:
      main:
        type: cronjob
        cronjob:
          schedule: "* * * * *"
          concurrencyPolicy: Forbid
        annotations:
          healthcheckSecret: paperless-secrets
          healthcheckImage: ghcr.io/anokfireball/base-image:3.24.3@sha256:3afac981717ee329d4efe0d907f84f1a47daedb1d58cae70e74a40fe8d733d3c
        containers:
          main:
            image:
              repository: ghcr.io/paperless-ngx/paperless-ngx
              tag: 3.3.4@sha256:9bc6e8248891bcfa6f52fffe8b81e4ea8cae75790c3ec1b9906961a7ba55c969
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            command:
              - /bin/bash
              - -c
              - |
                set -euo pipefail
                DIRTY_FILE="/usr/src/paperless/export/.paperless-dirty"
                if [ -f "$DIRTY_FILE" ]; then
                  MTIME=$(stat -c %Y "$DIRTY_FILE" 2>/dev/null || echo 0)
                  AGE=$(( $(date +%s) - MTIME ))
                  if [ "$AGE" -ge 600 ]; then
                    # invoke via bash so the with-contenv shebang is bypassed and
                    # the process env (k8s) is inherited directly (no s6 envdir).
                    bash /usr/local/bin/document_exporter /usr/src/paperless/export --no-progress-bar
                    rm -f "$DIRTY_FILE"
                  fi
                fi
            env:
              PAPERLESS_DBENGINE: postgresql
              PAPERLESS_DBHOST: paperless-ngx-postgresql-rw
              PAPERLESS_DBUSER: paperless-ngx
              PAPERLESS_DBNAME: paperless-ngx
              PAPERLESS_REDIS: redis://paperless-ngx-redis-master:6379
              PAPERLESS_DBPASS:
                valueFrom:
                  secretKeyRef:
                    name: paperless-postgres-user
                    key: password
              PAPERLESS_SECRET_KEY:
                valueFrom:
                  secretKeyRef:
                    name: paperless-secrets
                    key: paperless-secret-key
    persistence:
      media:
        type: persistentVolumeClaim
        existingClaim: paperless-ngx-media
        globalMounts:
          - path: /usr/src/paperless/media
      data:
        type: persistentVolumeClaim
        existingClaim: paperless-ngx-data
        globalMounts:
          - path: /usr/src/paperless/data
      export:
        type: nfs
        server: 192.168.1.2
        path: /mnt/tank/Dokumente/Paperless/export
        globalMounts:
          - path: /usr/src/paperless/export
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperless-ngx-gateway
  namespace: default
spec:
  interval: 1m
  chart:
    spec:
      chart: ./charts/gateway-route
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  values:
    name: paperless-ngx
    hostname: paperless.${SERVICE_DOMAIN}
