apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qbittorrent
  namespace: arrchive
spec:
  interval: 1m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    global:
      alwaysAppendIdentifierToResourceName: true
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          automountServiceAccountToken: false
          securityContext:
            seccompProfile:
              type: RuntimeDefault
            # hostUsers is not set: the inline NFS `downloads` volume rules out user namespaces for this pod (D2).
            # Longhorn volumes get group 1000 via fsGroup; the NFS mount ignores it.
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
        initContainers:
          # s6 (PID 1 of the LSIO image) refuses a /run it does not own. An emptyDir is root-owned and fsGroup
          # cannot change its owner, so this root init only chowns /run (CHOWN) before the app starts.
          run-permissions:
            image:
              repository: ghcr.io/anokfireball/base-image
              tag: 3.24.4@sha256:b20f348d6e11ca59a350ca7cb6e7c99df691dbfb74f9615bc5d83d624ed0d9e8
            command: ["chown"]
            args: ["1000:1000", "/run"]
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
                add: ["CHOWN"]
          # gluetun only knows the VPN servers baked into its image and rebuilds /gluetun/servers.json from them on
          # every start. Providers retire server IPs; once every server matching our filters had stopped answering, the
          # tunnel never came up. This fetches the provider's current list (provider name from gluetun-secrets) into the
          # shared /gluetun before the sidecar starts; gluetun prefers it over the baked-in data. It runs before the kill
          # switch, but only talks to the provider's public server-list API and DoH resolvers, and qBittorrent still
          # waits for the tunnel. A failed fetch fails the init container, so the kubelet retries instead of dialing
          # dead servers.
          gluetun-servers:
            dependsOn: run-permissions
            image:
              repository: ghcr.io/qdm12/gluetun
              tag: v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
            # the kubelet expands $(VAR) from the container env, so the provider stays in the SOPS secret
            command: ["/gluetun-entrypoint", "update", "-enduser", "-providers", "$(VPN_SERVICE_PROVIDER)"]
            env:
              VPN_SERVICE_PROVIDER:
                valueFrom:
                  secretKeyRef:
                    name: gluetun-secrets
                    key: VPN_SERVICE_PROVIDER
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 10m
                memory: 100Mi
          # Native sidecar (restartPolicy: Always): the kubelet starts it before every app container and holds them
          # until its startup probe passes. gluetun's healthcheck only passes once the tunnel is up, and its kill
          # switch is installed before the tunnel, so qBittorrent can never send traffic outside the VPN. As a
          # regular container started after qBittorrent, it left a few seconds at each pod start in which
          # qBittorrent reached trackers from the home IPv4/IPv6 addresses.
          gluetun:
            dependsOn: [run-permissions, gluetun-servers]
            restartPolicy: Always
            image:
              repository: ghcr.io/qdm12/gluetun
              tag: v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
            env:
              # the gluetun-auth Secret is mounted at /gluetun/auth; a path without a file left every control-server
              # route unauthenticated
              HTTP_CONTROL_SERVER_AUTH_CONFIG_FILEPATH: /gluetun/auth/config.toml
            envFrom:
              - secret: gluetun-secrets
            securityContext:
              allowPrivilegeEscalation: false
              # D6 exception (PolicyException audit-readonly-root-filesystem): gluetun writes /etc/passwd at start.
              readOnlyRootFilesystem: false
              capabilities:
                drop: ["ALL"]
                # NET_ADMIN is D1 (tun device, iptables kill switch). The rest are needed by gluetun's root-side
                # setup and openvpn's drop to uid 1000; see the PR body for evidence.
                add:
                  - NET_ADMIN
                  - MKNOD
                  - CHOWN
                  - DAC_OVERRIDE
                  - SETUID
                  - SETGID
                  - KILL
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /gluetun-entrypoint
                      - healthcheck
                  periodSeconds: 2
                  timeoutSeconds: 5
                  # Up to 10 minutes for the tunnel to come up before the kubelet restarts gluetun.
                  failureThreshold: 300
              liveness: &gluetun-probe
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /gluetun-entrypoint
                      - healthcheck
                  periodSeconds: 60
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *gluetun-probe
            resources:
              requests:
                cpu: 10m
                memory: 100Mi
        containers:
          main:
            image:
              repository: ghcr.io/linuxserver/qbittorrent
              tag: 5.3.1@sha256:1fa2f9692501f27ce51c4fffd771d63ec38f1163cb648941c324344b7c5a3915
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - bash
                      - /healthcheck/check-dht.sh
                  periodSeconds: 60
                  timeoutSeconds: 2
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    port: 8080
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 60
            resources:
              requests:
                cpu: 400m
                memory: 400Mi
          port-forward:
            image:
              repository: snoringdragon/gluetun-qbittorrent-port-manager
              tag: 1.3@sha256:679b7a92c494f93b78ad37ef24f3a261e73d0a1a52505ad4f1e39580eedfa14f
            env:
              QBITTORRENT_SERVER: localhost
              QBITTORRENT_PORT: "8080"
              PORT_FORWARDED: "/tmp/gluetun/forwarded_port"
            envFrom:
              - secret: gluetun-secrets
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 10m
                memory: 35Mi
          logs:
            image:
              repository: ghcr.io/anokfireball/base-image
              tag: 3.24.4@sha256:b20f348d6e11ca59a350ca7cb6e7c99df691dbfb74f9615bc5d83d624ed0d9e8
            command: ["tail"]
            args: ["-F", "/config/qBittorrent/logs/qbittorrent.log"]
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
          # Pushes the VPN state to a Gatus external endpoint (script in the healthcheck ConfigMap). It shares gluetun's
          # network namespace, so the push can only leave through the tunnel: while the tunnel is down nothing arrives
          # and the endpoint's heartbeat alerts. GATUS_TOKEN comes from its own optional Secret (not gluetun-secrets, which
          # would hand this container the VPN credentials); without it the script only logs that it is not reporting.
          vpn-report:
            image:
              repository: ghcr.io/anokfireball/base-image
              tag: 3.24.4@sha256:b20f348d6e11ca59a350ca7cb6e7c99df691dbfb74f9615bc5d83d624ed0d9e8
            command: ["sh", "/healthcheck/report-vpn.sh"]
            env:
              GATUS_URL: https://gatus.${SERVICE_DOMAIN}/api/v1/endpoints/services_gluetun-vpn-[push]/external
            envFrom:
              - secretRef:
                  name: qbittorrent-gatus
                  optional: true
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 5m
                memory: 16Mi
    service:
      main:
        controller: main
        ports:
          http:
            port: 8080
      gluetun:
        controller: main
        ports:
          http:
            port: 8000
    ingress:
      main:
        enabled: false
    route:
      main:
        enabled: true
        kind: HTTPRoute
        parentRefs:
          - group: gateway.networking.k8s.io
            kind: ListenerSet
            name: qbittorrent
            namespace: arrchive
            sectionName: https
        hostnames:
          - qbittorrent.${SERVICE_DOMAIN}
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - identifier: main
    configMaps:
      healthcheck:
        data:
          check-dht.sh: |
            #!/bin/bash
            status="$(qbt global info)"
            nodes=$(echo "$status" | sed -n 's/.*DHT nodes:\s*\([0-9]\+\).*/\1/p')
            if [ -n "$nodes" ] && [ "$nodes" -gt 0 ]; then
              exit 0
            fi
            exit 1
          report-vpn.sh: |
            #!/bin/sh
            # One push every 5 minutes; the Gatus endpoint's heartbeat covers pushes that never arrive. Gatus matches
            # the key literally, so the brackets stay in the URL and curl runs with -g. The token is never printed.
            # gluetun writes its public IP and forwarded port only after the tunnel is up, so the first push waits up to
            # 3 minutes for both instead of reporting a false failure; a push that never reached Gatus (HTTP 000, e.g.
            # tunnel down) is retried after 30 s so a recovery shows up quickly.
            state() {
              err=""
              [ -s /tmp/gluetun/ip ] || err="gluetun reports no public IP; "
              case "$(cat /tmp/gluetun/forwarded_port 2>/dev/null)" in
                "" | 0 | *[!0-9]*) err="$err""gluetun reports no forwarded port" ;;
              esac
            }
            # Average round trip to the VPN server's tunnel-side gateway (the next hop of gluetun's 0.0.0.0/1 route),
            # pushed as the result's duration so Gatus charts it as response time. Unprivileged ICMP works because the
            # pod's net.ipv4.ping_group_range allows it; without a reply the push simply carries no duration.
            latency() {
              gw=$(ip -4 route show 0.0.0.0/1 2>/dev/null | awk '{print $3; exit}')
              [ -n "$gw" ] || return 0
              ping -c 3 -W 2 "$gw" 2>/dev/null | sed -n 's|.*= [0-9.]*/\([0-9.]*\)/.*|\1|p'
            }
            waited=0
            state
            while [ -n "$err" ] && [ "$waited" -lt 180 ]; do
              sleep 10
              waited=$((waited + 10))
              state
            done
            while true; do
              if [ -z "$GATUS_TOKEN" ]; then
                echo "no GATUS_TOKEN, not reporting"
                sleep 300
                continue
              fi
              state
              if [ -z "$err" ]; then
                query="success=true"
              else
                query="success=false&error=$(jq -rn --arg e "$err" '$e | @uri')"
              fi
              rtt=$(latency)
              [ -n "$rtt" ] && query="$query&duration=$rtt""ms"
              code=$(curl -g -sS -o /dev/null -w '%{http_code}' -m 20 -X POST \
                -H "Authorization: Bearer $GATUS_TOKEN" "$GATUS_URL?$query")
              echo "$(date -u +%FT%TZ) $query -> HTTP $code"
              if [ "$code" = 000 ]; then sleep 30; else sleep 300; fi
            done
    persistence:
      run:
        type: emptyDir
        advancedMounts:
          main:
            main:
              - path: /run
            run-permissions:
              - path: /run
      tmp:
        type: emptyDir
        advancedMounts:
          main:
            main:
              - path: /tmp
            logs:
              - path: /tmp
            port-forward:
              - path: /tmp
      healthcheck:
        type: configMap
        name: qbittorrent-healthcheck
      gluetun-auth:
        type: secret
        name: gluetun-auth
        advancedMounts:
          main:
            gluetun:
              - path: /gluetun/auth
      gluetun-servers:
        type: emptyDir
        advancedMounts:
          main:
            gluetun-servers:
              - path: /gluetun
            gluetun:
              - path: /gluetun
      gluetun-data:
        type: emptyDir
        advancedMounts:
          main:
            gluetun:
              - path: /tmp/gluetun
            port-forward:
              - path: /tmp/gluetun
                readOnly: true
            vpn-report:
              - path: /tmp/gluetun
                readOnly: true
      config:
        type: persistentVolumeClaim
        storageClass: cluster-replicated
        accessMode: ReadWriteOnce
        size: 500Mi
      logs:
        type: emptyDir
        sizeLimit: 500Mi
        globalMounts:
          - path: /config/qBittorrent/logs/
      incomplete-downloads:
        type: persistentVolumeClaim
        storageClass: cluster-scratch
        accessMode: ReadWriteOnce
        size: 100Gi
      downloads:
        type: nfs
        server: 192.168.1.2
        path: /mnt/tank/Scratch/Torrent
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qbittorrent-gateway
  namespace: arrchive
spec:
  interval: 1m
  chart:
    spec:
      chart: ./charts/gateway-route
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  values:
    name: qbittorrent
    hostname: qbittorrent.${SERVICE_DOMAIN}
