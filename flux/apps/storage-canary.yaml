# Storage canaries; heartbeat via Kyverno healthcheckSecret.
# check.sh: fresh ephemeral volume per run. crossnode.sh: fresh PVC per run, written on
# worker2 (write.sh) and verified on worker3 (verify.sh), so the reader proves provisioning,
# cross-node attach/mount and data end to end.
apiVersion: v1
kind: ConfigMap
metadata:
  name: storage-canary
  namespace: default
data:
  mount.sh: |
    src=$(awk '$2 == "/canary" {print $1}' /proc/mounts)
    case "$src" in
      $MOUNT_PATTERN) ;;
      *) echo "/canary source '$src' does not match '$MOUNT_PATTERN'" >&2; exit 1 ;;
    esac
  check.sh: |
    set -euo pipefail
    . /scripts/mount.sh
    dd if=/dev/urandom of=/tmp/expected bs=1M count=16 status=none
    want=$(sha256sum < /tmp/expected)
    dd if=/tmp/expected of=/canary/data bs=1M oflag=direct conv=fsync status=none
    got=$(dd if=/canary/data bs=1M iflag=direct status=none | sha256sum)
    if [ "$want" != "$got" ]; then
      echo "read-back checksum mismatch on $src" >&2
      exit 1
    fi
    echo "ok: wrote and verified 16MiB on $src"
    . /scripts/leak.sh
  write.sh: |
    set -euo pipefail
    . /scripts/mount.sh
    dd if=/dev/urandom of=/tmp/payload bs=1M count=16 status=none
    sum=$(sha256sum < /tmp/payload | cut -d' ' -f1)
    dd if=/tmp/payload of=/canary/payload bs=1M oflag=direct conv=fsync status=none
    echo "$(date +%s) $NODE_NAME $sum" > /canary/marker.tmp
    mv /canary/marker.tmp /canary/marker
    sync
    echo "ok: wrote 16MiB on $NODE_NAME via $src"
  verify.sh: |
    set -euo pipefail
    . /scripts/mount.sh
    read -r ts writer sum < /canary/marker
    age=$(( $(date +%s) - ts ))
    if [ "$age" -gt "$MAX_AGE" ]; then
      echo "marker from $writer is $age seconds old (max $MAX_AGE)" >&2
      exit 1
    fi
    if [ "$writer" = "$NODE_NAME" ]; then
      echo "marker was written on this node ($writer); no cross-node check" >&2
      exit 1
    fi
    got=$(dd if=/canary/payload bs=1M iflag=direct status=none | sha256sum | cut -d' ' -f1)
    if [ "$got" != "$sum" ]; then
      echo "payload written on $writer does not match on $NODE_NAME" >&2
      exit 1
    fi
    echo "ok: verified data written $age seconds ago on $writer, read on $NODE_NAME via $src"
  leak.sh: |
    cutoff=$(( $(date +%s) - 1800 ))
    leaked=$(kubectl get pv -o json | jq -r --arg p "$CLAIM_PREFIX" --argjson cutoff "$cutoff" \
      '.items[] | select(.spec.claimRef.namespace == "default" and (.spec.claimRef.name | startswith($p))
        and (.metadata.creationTimestamp | fromdateiso8601) < $cutoff) | .metadata.name')
    if [ -n "$leaked" ]; then
      echo "canary volumes older than 30m were not cleaned up:" $leaked >&2
      exit 1
    fi
  crossnode.sh: |
    set -euo pipefail
    claim="${CLAIM_PREFIX}$(date +%s)"
    trap 'kubectl delete pod -l canary-run="$claim" --ignore-not-found --wait=false >/dev/null 2>&1 || true
          kubectl delete pvc "$claim" --ignore-not-found --wait=false >/dev/null 2>&1 || true' EXIT
    # Owned by this pod so GC removes the PVC even if the trap never runs.
    kubectl create -f - <<EOF
    apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: $claim
      ownerReferences:
        - {apiVersion: v1, kind: Pod, name: $POD_NAME, uid: $POD_UID}
    spec:
      accessModes: [$ACCESS_MODE]
      storageClassName: $STORAGE_CLASS
      resources:
        requests:
          storage: 1Gi
    EOF
    # step <script> <node>: run a pod on <node> mounting the PVC and wait for it to finish.
    step() {
      local script=$1 node=$2 name="$claim-${1%.sh}" phase=""
      kubectl create -f - <<EOF
    apiVersion: v1
    kind: Pod
    metadata:
      name: $name
      labels:
        canary-run: $claim
      ownerReferences:
        - {apiVersion: v1, kind: Pod, name: $POD_NAME, uid: $POD_UID}
    spec:
      restartPolicy: Never
      hostUsers: $HOST_USERS
      nodeSelector:
        kubernetes.io/hostname: $node
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: canary
          image: $IMAGE
          command: ["bash", "/scripts/$script"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - {name: MOUNT_PATTERN, value: "$MOUNT_PATTERN"}
            - {name: MAX_AGE, value: "$MAX_AGE"}
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - {name: canary, mountPath: /canary}
            - {name: scripts, mountPath: /scripts}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: scripts
          configMap:
            name: storage-canary
        - name: canary
          persistentVolumeClaim:
            claimName: $claim
        - name: tmp
          emptyDir: {}
    EOF
      for _ in $(seq 120); do
        phase=$(kubectl get pod "$name" -o jsonpath='{.status.phase}')
        if [ "$phase" = Succeeded ] || [ "$phase" = Failed ]; then break; fi
        sleep 2
      done
      kubectl logs "$name" || true
      # Release the volume before the next step attaches it elsewhere (matters for RWO).
      kubectl delete pod "$name" --wait=true >/dev/null
      [ "$phase" = Succeeded ] || { echo "$script on $node ended in phase '$phase'" >&2; exit 1; }
    }
    step write.sh "$WRITER_NODE"
    step verify.sh "$READER_NODE"
    . /scripts/leak.sh
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: storage-canary
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: storage-canary
rules:
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: storage-canary
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: storage-canary
subjects:
  - kind: ServiceAccount
    name: storage-canary
    namespace: default
  - kind: ServiceAccount
    name: storage-canary-crossnode
    namespace: default
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: storage-canary-crossnode
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: storage-canary-crossnode
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["create", "get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: storage-canary-crossnode
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: storage-canary-crossnode
subjects:
  - kind: ServiceAccount
    name: storage-canary-crossnode
    namespace: default
