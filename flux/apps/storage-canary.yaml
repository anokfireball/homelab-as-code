apiVersion: batch/v1
kind: CronJob
metadata:
  name: longhorn-canary-rwx-write
  namespace: default
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 300
      ttlSecondsAfterFinished: 600
      template:
        spec:
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/hostname: worker2
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
          containers:
            - name: canary
              image: ghcr.io/anokfireball/base-image:3.24.2@sha256:38fd8456ca419d38e5c903a57971490e8d910286cdd0f1536397969f757b7097
              command: ["bash", "/scripts/write.sh"]
              env:
                - name: MOUNT_PATTERN
                  value: "*:/pvc-*"
                - name: NODE_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: spec.nodeName
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 64Mi
              volumeMounts:
                - name: canary
                  mountPath: /canary
                - name: scripts
                  mountPath: /scripts
          volumes:
            - name: scripts
              configMap:
                name: storage-canary
            - name: canary
              persistentVolumeClaim:
                claimName: longhorn-canary-rwx
---
