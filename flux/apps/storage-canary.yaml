# nas-replicated-hdd itself is Retain.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nas-replicated-hdd-canary
provisioner: nas-hdd
reclaimPolicy: Delete
volumeBindingMode: Immediate
allowVolumeExpansion: true
parameters:
  fsType: nfs
mountOptions:
  - noatime
  - nfsvers=3
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: longhorn-canary-replicated
  namespace: default
  annotations:
    healthcheckSecret: longhorn-canary-replicated
    healthcheckImage: ghcr.io/anokfireball/base-image:3.24.3@sha256:5b9f5d72791bc19e943e8632ab617624c89b7d0fdb3d32be070a3e09a7bca03c
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 600
      ttlSecondsAfterFinished: 600
      template:
        spec:
          restartPolicy: Never
          hostUsers: false
          serviceAccountName: storage-canary
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: canary
              image: ghcr.io/anokfireball/base-image:3.24.3@sha256:5b9f5d72791bc19e943e8632ab617624c89b7d0fdb3d32be070a3e09a7bca03c
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              command: ["bash", "/scripts/check.sh"]
              env:
                - name: MOUNT_PATTERN
                  value: /dev/longhorn/*
                - name: CLAIM_PREFIX
                  value: longhorn-canary-replicated-
                - name: HOME
                  value: /tmp
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 128Mi
              volumeMounts:
                - name: canary
                  mountPath: /canary
                - name: scripts
                  mountPath: /scripts
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: scripts
              configMap:
                name: storage-canary
            - name: canary
              ephemeral:
                volumeClaimTemplate:
                  spec:
                    accessModes: ["ReadWriteOnce"]
                    storageClassName: cluster-replicated-canary
                    resources:
                      requests:
                        storage: 1Gi
            - name: tmp
              emptyDir: {}
