# Cross-node canaries: crossnode.sh creates a fresh PVC per run, writes on WRITER_NODE, verifies on READER_NODE.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: longhorn-canary-rwx
  namespace: default
  annotations:
    healthcheckSecret: longhorn-canary-rwx
    healthcheckImage: ghcr.io/anokfireball/base-image:3.24.3@sha256:5b9f5d72791bc19e943e8632ab617624c89b7d0fdb3d32be070a3e09a7bca03c
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 600
      ttlSecondsAfterFinished: 600
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: storage-canary-crossnode
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: canary
              image: ghcr.io/anokfireball/base-image:3.24.3@sha256:5b9f5d72791bc19e943e8632ab617624c89b7d0fdb3d32be070a3e09a7bca03c
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              command: ["bash", "/scripts/crossnode.sh"]
              env:
                - name: CLAIM_PREFIX
                  value: longhorn-canary-rwx-
                - name: STORAGE_CLASS
                  value: cluster-replicated-canary
                - name: ACCESS_MODE
                  value: ReadWriteMany
                - name: MOUNT_PATTERN
                  value: "*:/pvc-*"
                - name: HOST_USERS
                  value: "true"
                - name: IMAGE
                  value: ghcr.io/anokfireball/base-image:3.24.3@sha256:5b9f5d72791bc19e943e8632ab617624c89b7d0fdb3d32be070a3e09a7bca03c
                - name: WRITER_NODE
                  value: worker2
                - name: READER_NODE
                  value: worker3
                - name: MAX_AGE
                  value: "300"
                - name: POD_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.name
                - name: POD_UID
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.uid
                - name: HOME
                  value: /tmp
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 128Mi
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: scripts
              configMap:
                name: storage-canary
            - name: tmp
              emptyDir: {}
