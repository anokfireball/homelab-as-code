                    fieldRef:
                      fieldPath: metadata.uid
                - name: HOME
                  value: /tmp
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 128Mi
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: scripts
              configMap:
                name: storage-canary
            - name: tmp
              emptyDir: {}
