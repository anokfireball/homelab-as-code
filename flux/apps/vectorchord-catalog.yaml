---
# Immich's CNPG operand uses the immutable-style VectorChord image rather than
# the stock CloudNativePG postgres image, so it gets its own (namespaced)
# ImageCatalog, referenced by immich.yaml via spec.imageCatalogRef.
#
# Image version managed by Renovate (see renovate.json customManagers).
apiVersion: postgresql.cnpg.io/v1
kind: ImageCatalog
metadata:
  name: vectorchord
  namespace: default
spec:
  images:
    - major: 16
      # pinned to the vectorchord/pgvector line immich builds its postgres
      # images from:
      # https://github.com/immich-app/base-images/blob/main/postgres/versions.yaml
      image: ghcr.io/tensorchord/cloudnative-vectorchord:16.14-1.1.1@sha256:4a26ca6aad2482289f4a3d3317ccbf1439ce3de140994598375a1f4c4e2e9f8d
