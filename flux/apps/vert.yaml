apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vert
  namespace: default
spec:
  interval: 1m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    # nginx master is started as uid 101 (the image's nginx user) instead of root: it needs no capabilities,
    # and hostUsers=false maps that uid into a user namespace (every UID/GID in the image is <= 65535, no PVCs).
    defaultPodOptions:
      hostUsers: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    controllers:
      main:
        defaultContainerOptions:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
        # The image's entrypoint rewrites /etc/nginx/conf.d/default.conf at start, and that file must be shipped
        # from the image, so seed the emptyDir from the same image before nginx starts.
        initContainers:
          seed-conf:
            image:
              repository: ghcr.io/vert-sh/vert
              tag: main@sha256:51edb89e7c57197b0281ba8427fb27eea63730a3683b10d422061afab2708a49
            command: ["sh", "-c", "cp -R /etc/nginx/conf.d/. /seed/"]
        containers:
          main:
            image:
              repository: ghcr.io/vert-sh/vert
              tag: main@sha256:51edb89e7c57197b0281ba8427fb27eea63730a3683b10d422061afab2708a49
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
    service:
      main:
        controller: main
        ports:
          http:
            port: 80
    ingress:
      main:
        enabled: false
    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      run:
        type: emptyDir
        globalMounts:
          - path: /run
      nginx-cache:
        type: emptyDir
        globalMounts:
          - path: /var/cache/nginx
      nginx-conf:
        type: emptyDir
        advancedMounts:
          main:
            main:
              - path: /etc/nginx/conf.d
            seed-conf:
              - path: /seed
    route:
      main:
        enabled: true
        kind: HTTPRoute
        parentRefs:
          - group: gateway.networking.k8s.io
            kind: ListenerSet
            name: vert
            namespace: default
            sectionName: https
        hostnames:
          - vert.${SERVICE_DOMAIN}
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - identifier: main
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vert-gateway
  namespace: default
spec:
  interval: 1m
  chart:
    spec:
      chart: ./charts/gateway-route
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  values:
    name: vert
    hostname: vert.${SERVICE_DOMAIN}
