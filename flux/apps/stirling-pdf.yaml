apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: stirling-pdf
  namespace: default
spec:
  interval: 1m
  chart:
    spec:
      chart: stirling-pdf-chart
      version: 4.0.0
      sourceRef:
        kind: HelmRepository
        name: stirling-pdf
        namespace: flux-system
  values:
    image:
      registry: ghcr.io
      repository: stirling-tools/stirling-pdf
      tag: 3.2.1-fat@sha256:f1b01de1a9d64546556b2ac027ac0d088b0840acb02b3afdbaa1d48a2aa96a2f
    # https://docs.stirlingpdf.com/Configuration/
    envs:
      - name: SYSTEM_DEFAULTLOCALE
        value: de-DE
      - name: SYSTEM_SHOWUPDATE
        value: "false"
      - name: SYSTEM_GOOGLEVISIBILITY
        value: "false"
      - name: SYSTEM_ENABLEANALYTICS
        value: "false"
      - name: METRICS_ENABLED
        value: "false"
      - name: SECURITY_ENABLELOGIN
        value: "false"
      # v3 meters automation/API/AI runs against a local free tier; disable
      # account-link billing entirely (kill switch, no stirling.com linking)
      - name: STIRLING_BILLING_ACCOUNTLINK_ENABLED
        value: "false"
      # v3 defaults to Shenandoah GC (~20m idle CPU, upstream #8278); restore
      # the v2 "balanced" G1 profile. Memory % flags are appended by init.
      - name: JAVA_BASE_OPTS
        value: >-
          -XX:+ExitOnOutOfMemoryError -XX:+HeapDumpOnOutOfMemoryError
          -XX:HeapDumpPath=/configs/heap_dumps -XX:+UseG1GC
          -XX:MaxGCPauseMillis=200 -XX:G1HeapRegionSize=4m
          -XX:G1PeriodicGCInterval=60000 -XX:+UseStringDeduplication
          -XX:+UseCompactObjectHeaders -XX:+ExplicitGCInvokesConcurrent
          -Dspring.threads.virtual.enabled=true -Djava.awt.headless=true
    ingress:
      enabled: false
    httpRoute:
      enabled: true
      parentRefs:
        - group: gateway.networking.k8s.io
          kind: ListenerSet
          name: stirling-pdf
          namespace: default
          sectionName: https
      hostnames:
        - stirling-pdf.${SERVICE_DOMAIN}
    resources:
      requests:
        cpu: 10m
        memory: 600Mi
    securityContext:
      enabled: true
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
      seccompProfile:
        type: RuntimeDefault
    # Hardening (D4, D6, D8): the image's PUID/PGID default to 1000 (E4, upstream Dockerfile), so the pod runs
    # as 1000 instead of root. The chart's non-root path copies /usr/local/bin into an emptyDir; root filesystem
    # is read-only and every E6 path is an emptyDir.
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]
    deployment:
      extraVolumes:
        - name: fonts-tmpfs
          emptyDir:
            medium: Memory
            sizeLimit: 100Mi
        - name: tmp
          emptyDir: {}
        - name: home
          emptyDir: {}
        - name: logs
          emptyDir: {}
        - name: custom-files
          emptyDir: {}
        - name: pipeline
          emptyDir: {}
        - name: storage
          emptyDir: {}
        - name: engine-data
          emptyDir: {}
      extraVolumeMounts:
        - name: fonts-tmpfs
          mountPath: /usr/share/fonts/truetype
        - name: tmp
          mountPath: /tmp
        - name: home
          mountPath: /home/stirlingpdfuser
        - name: logs
          mountPath: /logs
        - name: custom-files
          mountPath: /customFiles
        - name: pipeline
          mountPath: /pipeline
        - name: storage
          mountPath: /storage
        - name: engine-data
          mountPath: /opt/stirling-engine/data
    # /api/v1/info/status is reachable unauthenticated since v3 (403 in v2)
    probes:
      liveness:
        enabled: true
        initialDelaySeconds: 60
        periodSeconds: 30
        timeoutSeconds: 5
      readiness:
        enabled: true
        initialDelaySeconds: 20
        periodSeconds: 10
        timeoutSeconds: 5
  # The chart has no hostUsers knob. UID/GID 1000 and all volumes are emptyDirs, so the pod fits a user namespace (D2=yes).
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: stirling-pdf-stirling-pdf-chart
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: stirling-pdf-stirling-pdf-chart
              spec:
                template:
                  spec:
                    hostUsers: false
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: stirling-pdf-gateway
  namespace: default
spec:
  interval: 1m
  chart:
    spec:
      chart: ./charts/gateway-route
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  values:
    name: stirling-pdf
    hostname: stirling-pdf.${SERVICE_DOMAIN}
