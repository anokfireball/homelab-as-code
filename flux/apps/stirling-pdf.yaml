apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: stirling-pdf
  namespace: default
spec:
  interval: 1m
  chart:
    spec:
      chart: stirling-pdf-chart
      version: 4.0.0
      sourceRef:
        kind: HelmRepository
        name: stirling-pdf
        namespace: flux-system
  values:
    image:
      registry: ghcr.io
      repository: stirling-tools/stirling-pdf
      tag: 3.2.1-fat@sha256:f1b01de1a9d64546556b2ac027ac0d088b0840acb02b3afdbaa1d48a2aa96a2f
    # https://docs.stirlingpdf.com/Configuration/
    envs:
      - name: SYSTEM_DEFAULTLOCALE
        value: de-DE
      - name: SYSTEM_SHOWUPDATE
        value: "false"
      - name: SYSTEM_GOOGLEVISIBILITY
        value: "false"
      - name: SYSTEM_ENABLEANALYTICS
        value: "false"
      - name: METRICS_ENABLED
        value: "false"
      - name: SECURITY_ENABLELOGIN
        value: "false"
      # v3 meters automation/API/AI runs against a local free tier; disable
      # account-link billing entirely (kill switch, no stirling.com linking)
      - name: STIRLING_BILLING_ACCOUNTLINK_ENABLED
        value: "false"
      # v3 defaults to Shenandoah GC (~20m idle CPU, upstream #8278); restore
      # the v2 "balanced" G1 profile. Memory % flags are appended by init.
      - name: JAVA_BASE_OPTS
        value: >-
          -XX:+ExitOnOutOfMemoryError -XX:+HeapDumpOnOutOfMemoryError
          -XX:HeapDumpPath=/configs/heap_dumps -XX:+UseG1GC
          -XX:MaxGCPauseMillis=200 -XX:G1HeapRegionSize=4m
          -XX:G1PeriodicGCInterval=60000 -XX:+UseStringDeduplication
          -XX:+UseCompactObjectHeaders -XX:+ExplicitGCInvokesConcurrent
          -Dspring.threads.virtual.enabled=true -Djava.awt.headless=true
    ingress:
      enabled: false
    httpRoute:
      enabled: true
      parentRefs:
        - group: gateway.networking.k8s.io
          kind: ListenerSet
          name: stirling-pdf
          namespace: default
          sectionName: https
      hostnames:
        - stirling-pdf.${SERVICE_DOMAIN}
    resources:
      requests:
        cpu: 10m
        memory: 600Mi
    securityContext:
      enabled: false
    deployment:
      extraVolumes:
        - name: fonts-tmpfs
          emptyDir:
            medium: Memory
            sizeLimit: 100Mi
      extraVolumeMounts:
        - name: fonts-tmpfs
          mountPath: /usr/share/fonts/truetype
    # /api/v1/info/status is reachable unauthenticated since v3 (403 in v2)
    probes:
      liveness:
        enabled: true
        initialDelaySeconds: 60
        periodSeconds: 30
        timeoutSeconds: 5
      readiness:
        enabled: true
        initialDelaySeconds: 20
        periodSeconds: 10
        timeoutSeconds: 5
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: stirling-pdf-gateway
  namespace: default
spec:
  interval: 1m
  chart:
    spec:
      chart: ./charts/gateway-route
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  values:
    name: stirling-pdf
    hostname: stirling-pdf.${SERVICE_DOMAIN}
