apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: vaultwarden-postgresql
  namespace: default
spec:
  # Current Vaultwarden is built with PG 15, also use that as long as it is supported
  # https://github.com/dani-garcia/vaultwarden/blob/1.32.6/docker/Dockerfile.alpine#L56-L57
  # https://www.postgresql.org/support/versioning/
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ClusterImageCatalog
    name: postgresql
    major: 15
  instances: 1
  # single instance: a PDB cannot protect anything and only blocks node drains
  enablePDB: false
  managed:
    services:
      disabledDefaultServices: ["ro", "r"]
    roles:
      - name: stashbackup
        passwordSecret:
          name: postgres-backup-user
        login: true
        superuser: false
        inRoles:
          - pg_read_all_data
  bootstrap:
    initdb:
      database: vaultwarden
      owner: vaultwarden
      secret:
        name: bitwarden-postgres-user
  storage:
    size: 2Gi
    storageClass: cluster-replicated
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vaultwarden
  namespace: default
spec:
  interval: 1m
  chart:
    spec:
      chart: vaultwarden
      version: 0.46.3
      sourceRef:
        kind: HelmRepository
        name: guerzon
        namespace: flux-system
  values:
    commonAnnotations:
      reloader.stakater.com/auto: "true"
    image:
      registry: ghcr.io
      repository: dani-garcia/vaultwarden
      tag: 1.37.4-alpine@sha256:19ea2b669945d842dadc3d500f2d6a795866a003330f59a47b9634658bae98bb
      extraVars:
        - key: CONFIG_FILE
          value: /tmp/config.json
    resourceType: Deployment
    # TODO https://github.com/ttionya/vaultwarden-backup as sidedcar?
    storage:
      data:
        name: vaultwarden-data
        class: cluster-replicated
        accessMode: ReadWriteOnce
        size: 1Gi
        # selected by the bitwarden-data k8up Schedule
        labels:
          backup: vaultwarden-data
    initContainers:
      - name: wait-for-postgresql
        # Current Vaultwarden is built with PG 15, also use that as long as it is supported
        # https://github.com/dani-garcia/vaultwarden/blob/1.32.6/docker/Dockerfile.alpine#L56-L57
        # https://www.postgresql.org/support/versioning/
        image: ghcr.io/cloudnative-pg/postgresql:15.19-standard-trixie@sha256:d3c7416df846a21024cce4768c16d52220315521a1395b5f645ff1a0b36e08f1
        command:
          - /bin/sh
          - -ec
          - |
            until pg_isready -h vaultwarden-postgresql-rw -U vaultwarden; do
              echo "Waiting for PostgreSQL to be ready..."
              sleep 2
            done
    resources:
      requests:
        cpu: 10m
        memory: 100Mi
    database:
      type: postgresql
      existingSecret: bitwarden-secrets
      existingSecretKey: database-uri
    pushNotifications:
      enabled: true
      existingSecret: bitwarden-secrets
      installationId:
        existingSecretKey: installation-id
      installationKey:
        existingSecretKey: installation-key
      relayUri: https://api.bitwarden.eu
      identityUri: https://identity.bitwarden.eu
    domain: https://bitwarden.${SERVICE_DOMAIN}
    # TODO hibp API key?
    signupsAllowed: false
    iconBlacklistNonGlobalIps: false
    ipHeader: "X-Forwarded-For"
    adminToken:
      existingSecret: bitwarden-secrets
      existingSecretKey: admin-token
    timeZone: Europe/Berlin
    smtp:
      existingSecret: bitwarden-secrets
      host: ${SMTP_HOST}
      port: 465
      security: force_tls
      from: bitwarden@${SERVICE_DOMAIN}
      fromName: Bitwarden
      heloName: bitwarden.${SERVICE_DOMAIN}
      username:
        existingSecretKey: smtp-username
      password:
        existingSecretKey: smtp-password
      authMechanism: Login
    service:
      annotations:
        tailscale.com/expose: "true"
        tailscale.com/hostname: homelab-bitwarden
    ingress:
      enabled: false
    httpRoute:
      enabled: true
      parentRefs:
        - group: gateway.networking.k8s.io
          kind: ListenerSet
          name: bitwarden
          namespace: default
          sectionName: https
      hostnames:
        - bitwarden.${SERVICE_DOMAIN}
  # The chart cannot set custom PVC annotations, and k8up runs with skipWithoutAnnotation.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: PersistentVolumeClaim
              name: vaultwarden-data-vaultwarden-0
            patch: |
              apiVersion: v1
              kind: PersistentVolumeClaim
              metadata:
                name: vaultwarden-data-vaultwarden-0
                annotations:
                  k8up.io/backup: "true"
          # Hardening (D2/D4, D5-D8, D7): root inside a user namespace; no API token (E5 unbound SA); tmp is the only writable path (E6)
          - target:
              kind: Deployment
              name: vaultwarden
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: vaultwarden
              spec:
                template:
                  spec:
                    automountServiceAccountToken: false
                    hostUsers: false
                    securityContext:
                      seccompProfile:
                        type: RuntimeDefault
                    initContainers:
                      - name: wait-for-postgresql
                        securityContext:
                          runAsNonRoot: true
                          runAsUser: 26
                          runAsGroup: 26
                          allowPrivilegeEscalation: false
                          readOnlyRootFilesystem: true
                          capabilities:
                            drop: ["ALL"]
                        volumeMounts:
                          - name: tmp
                            mountPath: /tmp
                    containers:
                      - name: vaultwarden
                        securityContext:
                          allowPrivilegeEscalation: false
                          readOnlyRootFilesystem: true
                          capabilities:
                            drop: ["ALL"]
                        volumeMounts:
                          - name: tmp
                            mountPath: /tmp
                    volumes:
                      - name: tmp
                        emptyDir: {}
---
apiVersion: k8up.io/v1
kind: PreBackupPod
metadata:
  name: bitwarden-database-backup
  namespace: default
  labels:
    backup: bitwarden-database
  annotations:
    k8up.io/backup: "true"
spec:
  backupCommand: sh -c 'PGHOST="$POSTGRES_HOST" PGUSER="$POSTGRES_USER" PGPASSWORD="$POSTGRES_PASSWORD" pg_dumpall --clean'
  pod:
    spec:
      # Hardening: image is pinned by digest (E8); non-root uid 26 from the image (E4), user namespace (D2)
      hostUsers: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 26
        runAsGroup: 26
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bitwarden-database-backup
          image: ghcr.io/cloudnative-pg/postgresql:15.19-standard-trixie@sha256:d3c7416df846a21024cce4768c16d52220315521a1395b5f645ff1a0b36e08f1
          command:
            - "sleep"
            - "infinity"
          env:
            - name: POSTGRES_HOST
              value: vaultwarden-postgresql-rw
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-backup-user
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-backup-user
                  key: password
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: bitwarden-database
  namespace: default
spec:
  backend:
    repoPasswordSecretRef:
      name: k8up-restic-secrets
      key: restic-password
    s3:
      bucket: Habitat-Giggle9-Composer/bitwarden
  backup:
    labelSelectors:
      - matchLabels:
          backup: bitwarden-database
    schedule: "23 4/6 * * *"
    concurrentRunsAllowed: false
    podConfigRef:
      name: bitwarden-database-backup
  prune:
    schedule: "53 0 1 * *"
    concurrentRunsAllowed: false
    retention:
      keepHourly: 6
      keepDaily: 14
      keepWeekly: 12
      keepMonthly: 6
      keepYearly: 2
---
apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: bitwarden-data
  namespace: default
spec:
  backend:
    repoPasswordSecretRef:
      name: k8up-restic-secrets
      key: restic-password
    s3:
      bucket: Habitat-Giggle9-Composer/bitwarden-data
  backup:
    labelSelectors:
      - matchLabels:
          backup: vaultwarden-data
    schedule: "29 5/6 * * *"
    concurrentRunsAllowed: false
    podConfigRef:
      name: bitwarden-data-backup
  # vaultwarden runs as root; some attachments are root-owned with mode 0600
  podSecurityContext:
    runAsUser: 0
  prune:
    schedule: "59 0 1 * *"
    concurrentRunsAllowed: false
    retention:
      keepHourly: 6
      keepDaily: 14
      keepWeekly: 12
      keepMonthly: 6
      keepYearly: 2
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bitwarden-gateway
  namespace: default
spec:
  interval: 1m
  chart:
    spec:
      chart: ./charts/gateway-route
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  values:
    name: bitwarden
    hostname: bitwarden.${SERVICE_DOMAIN}
---
apiVersion: k8up.io/v1
kind: PodConfig
metadata:
  name: bitwarden-data-backup
  namespace: default
spec:
  template:
    spec:
      # vaultwarden runs as root inside its user namespace; its root-owned data (e.g. mode 0600 attachments) is only readable as that uid
      hostUsers: false
      securityContext:
        runAsUser: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backup
          # as root, restic's cache defaults to /root/.cache on the read-only root; k8up mounts its cache emptyDir at /.cache
          env:
            - name: RESTIC_CACHE_DIR
              value: /.cache
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: k8up.io/v1
kind: PodConfig
metadata:
  name: bitwarden-database-backup
  namespace: default
spec:
  template:
    spec:
      hostUsers: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backup
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
