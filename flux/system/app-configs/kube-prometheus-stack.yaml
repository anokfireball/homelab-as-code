apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring-system
spec:
  interval: 1m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 92.16.2
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  # Helm hook Jobs (CRD upgrade, admission webhook create/patch) have no chart value for hostUsers.
  # They run as non-root with no host access and only mount a ServiceAccount token and ConfigMap/emptyDir.
  # Hook Jobs are patched below; postRenderStrategy combined (helm-controller's default) is pinned so they stay reachable.
  postRenderStrategy: combined
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Job
            patch: |
              - op: add
                path: /spec/template/spec/hostUsers
                value: false
  values:
    crds:
      upgradeJob:
        enabled: true
        image:
          busybox:
            # Pinned by digest through the tag: the chart only renders upgradeJob.image.busybox.sha when the
            # unrelated upgradeJob.image.sha is set.
            # renovate: datasource=docker depName=docker.io/busybox
            tag: "1.38@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4"
          kubectl:
            # renovate: datasource=docker depName=registry.k8s.io/kubectl
            tag: v1.37.2@sha256:fe049faa65ae483ac200009a949a68fa4c9985daea12c9cb1195c9c7965301fc
    alertmanager:
      ingress:
        enabled: false
      alertmanagerSpec:
        retention: 168h
        # The digest rides in image.tag, so the operator needs the bare version; Renovate rewrites both lines together.
        # renovate: datasource=docker depName=quay.io/prometheus/alertmanager
        version: v0.34.2
        image:
          tag: v0.34.2@sha256:39d8bb3966c694a124428a3a88fbcffd40bd069129ecd47c059f8a3f17c55f3b
        # The config-reloader watches a mounted directory and reloads over localhost; it never calls the API.
        automountServiceAccountToken: false
        # PVC is cluster-scratch (Longhorn RWO); uids 1000/2000 only.
        hostUsers: false
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: cluster-scratch
              resources:
                requests:
                  storage: 1Gi
    grafana:
      enabled: false
      forceDeployDatasources: true
      forceDeployDashboards: true
      defaultDashboardsEnabled: true
      defaultDashboardsTimezone: Europe/Berlin
      defaultDashboardsEditable: true
      sidecar:
        dashboards:
          annotations:
            grafana_dashboard_folder: kube-prometheus-stack
    prometheus:
      ingress:
        enabled: false
      prometheusSpec:
        retention: 90d
        retentionSize: 250GiB
        # The digest rides in image.tag, so the operator needs the bare version; Renovate rewrites both lines together.
        # renovate: datasource=docker depName=quay.io/prometheus/prometheus
        version: v3.15.1-distroless
        image:
          tag: v3.15.1-distroless@sha256:451a845bae1d51622b41af1780eb2ad911bbb79a9855bc8e9bb67fabbc03f934
        # hostUsers stays unset: the TSDB PVC is nas-replicated-hdd (StorageClass fsType nfs), which cannot be
        # idmapped. Covered by the audit-user-namespaces PolicyException.
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: nas-replicated-hdd
              resources:
                requests:
                  storage: 250Gi
        podMonitorSelectorNilUsesHelmValues: false
        serviceMonitorSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
    prometheusOperator:
      # No hostPath, NFS or host namespaces; uid 65534 only.
      hostUsers: false
      image:
        # renovate: datasource=docker depName=quay.io/prometheus-operator/prometheus-operator
        tag: v0.94.2@sha256:c7edf0379b7271ef1705dce258d2bb73820e299cc95559369e9f6fc3321639ec
      # Operator-chosen image: injected into every Prometheus and Alertmanager pod as the config-reloader.
      prometheusConfigReloader:
        image:
          # renovate: datasource=docker depName=quay.io/prometheus-operator/prometheus-config-reloader
          tag: v0.94.2@sha256:a1897c67478bc23434534e91ad3855280771196b1daf17144db9dbcb655bef71
      # Operator-chosen default for ThanosRuler/Thanos sidecars (not deployed today).
      thanosImage:
        # renovate: datasource=docker depName=quay.io/thanos/thanos
        tag: v0.42.5@sha256:0a546b98a8dd47735456ab389983675ee363d68127e334937a9fceeea10da5e7
      admissionWebhooks:
        patch:
          image:
            # renovate: datasource=docker depName=ghcr.io/jkroepke/kube-webhook-certgen
            tag: 1.11.0@sha256:778d97dc3986355625e14392419b3364c487a7c807d4d86ddad1df369129b082
          # Pod-level securityContext of both admission Jobs (create secret, patch webhook).
          securityContext:
            seccompProfile:
              type: RuntimeDefault
    kube-state-metrics:
      hostUsers: false
      image:
        # renovate: datasource=docker depName=registry.k8s.io/kube-state-metrics/kube-state-metrics
        tag: v2.20.0@sha256:42cfe3723a5f058171c627537fb57a3ea0f26e4380fa18555a95cb1a1b4cfc5b
    prometheus-node-exporter:
      # Host network, host PID and hostPath mounts of / , /proc and /sys are required: infrastructure component (D1).
      # hostUsers cannot be set with hostNetwork; the chart leaves it unset.
      image:
        # The digest rides in the tag, so the chart's distroless suffix is spelled out in it.
        distroless: false
        # renovate: datasource=docker depName=quay.io/prometheus/node-exporter
        tag: v1.12.1-distroless@sha256:8c9bac11973b94b59be88d6e11fee4429aa743c8846cdc75d65b18db33f6a106
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alertmanager-gateway
  namespace: monitoring-system
spec:
  interval: 1m
  chart:
    spec:
      chart: ./charts/gateway-route
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  values:
    name: alertmanager
    hostname: alertmanager.${SERVICE_DOMAIN}
    route:
      enabled: true
      backend:
        name: kube-prometheus-stack-alertmanager
        port: 9093
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-gateway
  namespace: monitoring-system
spec:
  interval: 1m
  chart:
    spec:
      chart: ./charts/gateway-route
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  values:
    name: prometheus
    hostname: prometheus.${SERVICE_DOMAIN}
    route:
      enabled: true
      backend:
        name: kube-prometheus-stack-prometheus
        port: 9090
