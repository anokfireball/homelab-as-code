apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn-gateway
  namespace: longhorn-system
spec:
  interval: 1m
  chart:
    spec:
      chart: ./charts/gateway-route
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  values:
    name: longhorn
    hostname: longhorn.${SERVICE_DOMAIN}
    route:
      enabled: true
      backend:
        name: longhorn-frontend
        port: 80
---
kind: StorageClass
apiVersion: storage.k8s.io/v1
metadata:
  name: cluster-scratch
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
parameters:
  numberOfReplicas: "1"
  dataLocality: best-effort
  recurringJobSelector: |
    [
       {
         "name":"base",
         "isGroup":true
       }
     ]
---
kind: StorageClass
apiVersion: storage.k8s.io/v1
metadata:
  name: cluster-replicated
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Retain
parameters:
  numberOfReplicas: "3"
  dataLocality: best-effort
  replicaAutoBalance: best-effort
  recurringJobSelector: |
    [
       {
         "name":"base",
         "isGroup":true
       },
       {
         "name":"daily-backup",
         "isGroup":false
       }
     ]
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: daily-backup
  namespace: longhorn-system
spec:
  cron: 45 23 * * *
  name: daily-backup
  retain: 7
  task: backup
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: daily-snapshot-cleanup
  namespace: longhorn-system
spec:
  cron: 30 23 * * *
  groups:
    - base
  name: daily-snapshot-cleanup
  task: snapshot-cleanup
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: weekly-trim
  namespace: longhorn-system
spec:
  cron: 0 0 * * 0
  groups:
    - base
  name: weekly-trim
  task: filesystem-trim
---
# Longhorn's global toleration (operator: Exists) also tolerates the cordon taint, so share-manager
# pods of RWX volumes get rescheduled onto the node being drained and its drain never finishes.
# upgrade.yaml labels the node homelab.io/draining while it is cordoned; keep share-managers off it.
# failurePolicy Ignore: storage must not depend on Kyverno being up.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: longhorn-share-manager-avoid-draining-nodes
spec:
  failurePolicy: Ignore
  rules:
    - name: avoid-draining-nodes
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - longhorn-system
              selector:
                matchLabels:
                  longhorn.io/component: share-manager
              operations:
                - CREATE
      mutate:
        patchStrategicMerge:
          spec:
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: homelab.io/draining
                          operator: DoesNotExist
