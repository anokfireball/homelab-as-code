apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: mutate-tls-certificate-size
spec:
  failurePolicy: Fail
  rules:
    - name: set-privateKey-details
      match:
        any:
          - resources:
              kinds:
                - cert-manager.io/v1/Certificate
      mutate:
        patchStrategicMerge:
          spec:
            privateKey:
              +(algorithm): ECDSA
              +(size): 256
              +(rotationPolicy): Always
