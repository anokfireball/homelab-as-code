apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: mutate-tls-certificate-size
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["cert-manager.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["certificates"]
  # Defaults only: privateKey fields a Certificate sets itself are kept.
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: |
          Object{
            spec: Object.spec{
              privateKey: Object.spec.privateKey{
                algorithm: object.spec.?privateKey.?algorithm.orValue('ECDSA'),
                size: object.spec.?privateKey.?size.orValue(256),
                rotationPolicy: object.spec.?privateKey.?rotationPolicy.orValue('Always')
              }
            }
          }
