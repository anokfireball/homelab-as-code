apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: monitoring-system
spec:
  interval: 1m
  chart:
    spec:
      chart: grafana
      version: 10.5.15
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  values:
    hostUsers: false
    securityContext:
      runAsNonRoot: true
      runAsUser: 472
      runAsGroup: 472
      fsGroup: 472
      fsGroupChangePolicy: OnRootMismatch
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      readOnlyRootFilesystem: true
    image:
      registry: docker.io
      repository: grafana/grafana
      tag: "13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f"
    initChownData:
      enabled: false
    extraEmptyDirMounts:
      - name: tmp
        mountPath: /tmp
    extraVolumes:
      - name: sc-tmp
        emptyDir: {}
    ingress:
      enabled: false
    # The RWO PVC can only attach to one node; a rolling update deadlocks when the new pod lands elsewhere.
    deploymentStrategy:
      type: Recreate
    persistence:
      enabled: true
      storageClassName: cluster-scratch
      size: 1Gi
    admin:
      existingSecret: grafana-secrets
      userKey: admin-user
      passwordKey: admin-password
    grafana.ini:
      server:
        domain: grafana.${SERVICE_DOMAIN}
        root_url: https://grafana.${SERVICE_DOMAIN}
    sidecar:
      image:
        registry: quay.io
        repository: kiwigrid/k8s-sidecar
        tag: "2.5.0@sha256:a6b3f707f883108376514489a94d6629109a327b2978e1d826cd104c4ca436df"
      securityContext:
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
      alerts:
        enabled: true
        label: grafana_alert
        labelValue: "1"
        extraMounts:
          - name: sc-tmp
            mountPath: /tmp
      dashboards:
        enabled: true
        searchNamespace: ALL
        label: grafana_dashboard
        labelValue: "1"
        folderAnnotation: grafana_dashboard_folder
        extraMounts:
          - name: sc-tmp
            mountPath: /tmp
        provider:
          foldersFromFilesStructure: true
      datasources:
        enabled: true
        searchNamespace: ALL
        label: grafana_datasource
        labelValue: "1"
        extraMounts:
          - name: sc-tmp
            mountPath: /tmp
      plugins:
        enabled: true
        label: grafana_plugin
        labelValue: "1"
        extraMounts:
          - name: sc-tmp
            mountPath: /tmp
      notifiers:
        enabled: true
        label: grafana_notifier
        labelValue: "1"
        extraMounts:
          - name: sc-tmp
            mountPath: /tmp
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana-gateway
  namespace: monitoring-system
spec:
  interval: 1m
  chart:
    spec:
      chart: ./charts/gateway-route
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  values:
    name: grafana
    hostname: grafana.${SERVICE_DOMAIN}
    route:
      enabled: true
      backend:
        name: grafana
        port: 80
