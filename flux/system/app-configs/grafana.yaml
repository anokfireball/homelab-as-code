apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: monitoring-system
spec:
  interval: 1m
  chart:
    spec:
      chart: grafana
      version: 10.5.15
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  values:
    hostUsers: false
    securityContext:
      runAsNonRoot: true
      runAsUser: 472
      runAsGroup: 472
      fsGroup: 472
      fsGroupChangePolicy: OnRootMismatch
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      readOnlyRootFilesystem: true
    image:
      registry: docker.io
      repository: grafana/grafana
      tag: "13.3.0@sha256:488984b716c0862639f91a698adbe2862677a5a07bad42da5f03f3030883b205"
    initChownData:
      enabled: false
    extraEmptyDirMounts:
      - name: tmp
        mountPath: /tmp
    extraVolumes:
      - name: sc-tmp
        emptyDir: {}
    ingress:
      enabled: false
    # The RWO PVC can only attach to one node; a rolling update deadlocks when the new pod lands elsewhere.
    deploymentStrategy:
      type: Recreate
    persistence:
      enabled: true
      storageClassName: cluster-scratch
      size: 1Gi
    admin:
      existingSecret: grafana-secrets
      userKey: admin-user
      passwordKey: admin-password
    grafana.ini:
      server:
        domain: grafana.${SERVICE_DOMAIN}
        root_url: https://grafana.${SERVICE_DOMAIN}
    sidecar:
      image:
        registry: quay.io
        repository: kiwigrid/k8s-sidecar
        tag: "2.14.1@sha256:092dbe0c335fba9af414a27630ca68f34df6185784fa847d9954187e69dbfdd7"
      securityContext:
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
      alerts:
        enabled: true
        label: grafana_alert
        labelValue: "1"
        extraMounts:
          - name: sc-tmp
            mountPath: /tmp
      dashboards:
        enabled: true
        searchNamespace: ALL
        label: grafana_dashboard
        labelValue: "1"
        folderAnnotation: grafana_dashboard_folder
        extraMounts:
          - name: sc-tmp
            mountPath: /tmp
        provider:
          foldersFromFilesStructure: true
      datasources:
        enabled: true
        searchNamespace: ALL
        label: grafana_datasource
        labelValue: "1"
        extraMounts:
          - name: sc-tmp
            mountPath: /tmp
      plugins:
        enabled: true
        label: grafana_plugin
        labelValue: "1"
        extraMounts:
          - name: sc-tmp
            mountPath: /tmp
      notifiers:
        enabled: true
        label: grafana_notifier
        labelValue: "1"
        extraMounts:
          - name: sc-tmp
            mountPath: /tmp
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana-gateway
  namespace: monitoring-system
spec:
  interval: 1m
  chart:
    spec:
      chart: ./charts/gateway-route
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  values:
    name: grafana
    hostname: grafana.${SERVICE_DOMAIN}
    route:
      enabled: true
      backend:
        name: grafana
        port: 80
---
# Grafana-managed alerts for the MutatingAdmissionPolicies (failurePolicy Ignore admits a pod without the mutation and
# reports the failure only in apiserver_mutating_admission_policy_check_total). Loaded by the alerts sidecar
# (label grafana_alert); notifications go straight to the Pushover contact point, not the default email policy.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alert-rules-map
  namespace: monitoring-system
  labels:
    grafana_alert: "1"
data:
  map-alert-rules.yaml: |-
    apiVersion: 1
    groups:
      - orgId: 1
        name: mutating-admission-policy
        folder: Kubernetes
        interval: 1m
        rules:
          - uid: map-admission-errors
            title: MAP admission policy errors
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 1200
                  to: 0
                datasourceUid: prometheus
                model:
                  refId: A
                  datasource:
                    type: prometheus
                    uid: prometheus
                  # Clause 1: more errors on an existing series. Clause 2: a series that first appeared in the last
                  # 15m (the first error after an apiserver restart, which increase() cannot see), counted only while
                  # that apiserver was scraped for the whole window, so a Prometheus or scrape gap cannot fake it.
                  expr: |-
                    (sum by (policy, policy_binding, error_type) (increase(apiserver_mutating_admission_policy_check_total{error_type!="no_error"}[15m])) > 0)
                    or
                    count by (policy, policy_binding, error_type) (
                      (apiserver_mutating_admission_policy_check_total{error_type!="no_error"}
                        unless apiserver_mutating_admission_policy_check_total{error_type!="no_error"} offset 15m)
                      and on (instance) (sum_over_time(up{job="apiserver"}[20m]) > 30)
                    )
                  instant: true
                  range: false
                  intervalMs: 1000
                  maxDataPoints: 43200
              - refId: C
                relativeTimeRange:
                  from: 0
                  to: 0
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  conditions:
                    - evaluator:
                        params: [0]
                        type: gt
                      operator:
                        type: and
                      query:
                        params: [C]
                      reducer:
                        type: last
                        params: []
                      type: query
            noDataState: OK
            execErrState: Alerting
            for: 0s
            labels:
              severity: warning
            annotations:
              summary: 'MAP {{ $labels.policy }}: {{ $labels.error_type }} (binding {{ $labels.policy_binding }})'
              description: >-
                A MutatingAdmissionPolicy failed to evaluate. With failurePolicy Ignore the pod was admitted without
                that mutation; check the newest pods matched by the binding.
            notification_settings:
              receiver: Pushover
      - orgId: 1
        name: mutating-admission-policy-metric
        folder: Kubernetes
        # 14 days of history per evaluation: hourly is enough for a check that only fires after two quiet weeks.
        interval: 1h
        rules:
          - uid: map-metric-missing
            title: MAP admission metric missing for 14 days
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 1209600
                  to: 0
                datasourceUid: prometheus
                model:
                  refId: A
                  datasource:
                    type: prometheus
                    uid: prometheus
                  expr: absent_over_time(apiserver_mutating_admission_policy_check_total[14d])
                  instant: true
                  range: false
                  intervalMs: 1000
                  maxDataPoints: 43200
              - refId: C
                relativeTimeRange:
                  from: 0
                  to: 0
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  conditions:
                    - evaluator:
                        params: [0]
                        type: gt
                      operator:
                        type: and
                      query:
                        params: [C]
                      reducer:
                        type: last
                        params: []
                      type: query
            noDataState: OK
            execErrState: Alerting
            for: 0s
            labels:
              severity: warning
            annotations:
              summary: No apiserver has exported apiserver_mutating_admission_policy_check_total for 14 days
              description: >-
                The metric is ALPHA: after a Kubernetes upgrade, check whether it was renamed and update both MAP alert
                rules. Otherwise no pod matched any MutatingAdmissionPolicy binding for 14 days.
            notification_settings:
              receiver: Pushover
