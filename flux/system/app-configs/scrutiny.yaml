apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: scrutiny-influxdb
  namespace: monitoring-system
spec:
  interval: 1m
  chart:
    spec:
      chart: influxdb2
      version: 2.1.2
      sourceRef:
        kind: HelmRepository
        name: influxdata
        namespace: flux-system
  values:
    service:
      port: 8086
    adminUser:
      organization: scrutiny
      bucket: metrics
      user: admin
      existingSecret: scrutiny-influxdb-admin
    persistence:
      enabled: true
      storageClass: nas-replicated-hdd
      size: 50Gi
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: scrutiny-web
  namespace: monitoring-system
spec:
  interval: 1m
  chart:
    spec:
      chart: app-template
      version: 5.2.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    controllers:
      hub:
        containers:
          web:
            image:
              repository: ghcr.io/starosdev/scrutiny
              tag: 1.76.2-web@sha256:e92a5cc0dc8452be6454234d9d4f97f199021c70a33ded87ffc0c81378dded93
            env:
              - name: SCRUTINY_WEB_INFLUXDB_HOST
                value: scrutiny-influxdb-influxdb2
              - name: SCRUTINY_WEB_INFLUXDB_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: scrutiny-influxdb-admin
                    key: admin-token
              - name: SCRUTINY_WEB_METRICS_ENABLED
                value: "true"
    service:
      main:
        controller: hub
        ports:
          http:
            port: 8080
    ingress:
      main:
        enabled: false
    route:
      main:
        enabled: true
        kind: HTTPRoute
        parentRefs:
          - group: gateway.networking.k8s.io
            kind: ListenerSet
            name: scrutiny-web
            namespace: monitoring-system
            sectionName: https
        hostnames:
          - scrutiny.${SERVICE_DOMAIN}
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - identifier: main
    persistence:
      config:
        type: persistentVolumeClaim
        storageClass: cluster-replicated
        accessMode: ReadWriteOnce
        size: 1Gi
        globalMounts:
          - path: /opt/scrutiny/config
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: scrutiny-collector
  namespace: monitoring-system
spec:
  interval: 1m
  chart:
    spec:
      chart: app-template
      version: 5.2.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    global:
      alwaysAppendIdentifierToResourceName: true
    defaultPodOptions:
      tolerations:
        - operator: Exists
    controllers:
      spoke:
        type: daemonset
        containers:
          collector:
            image:
              repository: ghcr.io/starosdev/scrutiny
              tag: 1.76.2-collector@sha256:58f607dd848c25cc779d7ac3a0a5efb8b3bd5d1742c3e62c6db5303808d12c4f
            env:
              - name: COLLECTOR_API_ENDPOINT
                value: http://scrutiny-web:8080
              - name: COLLECTOR_CRON_SCHEDULE
                value: "*/15 * * * *"
              - name: COLLECTOR_HOST_ID
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
            securityContext:
              privileged: true
              capabilities:
                add:
                  - SYS_RAWIO # SATA
                  - SYS_ADMIN # NVMe
    configMaps:
      config:
        data:
          collector.yaml: |
            allow_listed_devices:
            - /dev/sda
            - /dev/nvme0
    persistence:
      config:
        type: configMap
        name: scrutiny-collector-config
        globalMounts:
          - path: /opt/scrutiny/config/collector.yaml
            subPath: collector.yaml
      udev:
        type: hostPath
        hostPath: /run/udev
        globalMounts:
          - path: /run/udev
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: scrutiny-web-gateway
  namespace: monitoring-system
spec:
  interval: 1m
  chart:
    spec:
      chart: ./charts/gateway-route
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  values:
    name: scrutiny-web
    hostname: scrutiny.${SERVICE_DOMAIN}
