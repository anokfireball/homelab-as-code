apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: scrutiny-influxdb
  namespace: monitoring-system
spec:
  interval: 1m
  chart:
    spec:
      chart: influxdb2
      version: 2.1.2
      sourceRef:
        kind: HelmRepository
        name: influxdata
        namespace: flux-system
  values:
    service:
      port: 8086
    adminUser:
      organization: scrutiny
      bucket: metrics
      user: admin
      existingSecret: scrutiny-influxdb-admin
    persistence:
      enabled: true
      storageClass: nas-replicated-hdd
      size: 50Gi
    image:
      repository: influxdb
      tag: 2.9.1-alpine@sha256:385d5fe4746f4c087d6468519f023b24b425c0848a63b3185de8681e0f94d285
    # The image entrypoint only chowns and su-execs when started as root; uid 1000 already owns the data.
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]
    volumes:
      - name: tmp
        emptyDir: {}
      - name: cache
        emptyDir: {}
      - name: config
        emptyDir: {}
    mountPoints:
      - name: tmp
        mountPath: /tmp
      - name: cache
        mountPath: /home/influxdb/.cache
      - name: config
        mountPath: /etc/influxdb2
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: StatefulSet
              name: scrutiny-influxdb-influxdb2
            patch: |
              apiVersion: apps/v1
              kind: StatefulSet
              metadata:
                name: scrutiny-influxdb-influxdb2
              spec:
                template:
                  spec:
                    automountServiceAccountToken: false
                    securityContext:
                      seccompProfile:
                        type: RuntimeDefault
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: scrutiny-web
  namespace: monitoring-system
spec:
  interval: 1m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    defaultPodOptions:
      # The config PVC is Longhorn RWO (no NFS or hostPath), so the pod can run in a user namespace.
      hostUsers: false
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
    controllers:
      hub:
        containers:
          web:
            image:
              repository: ghcr.io/starosdev/scrutiny
              tag: 1.76.9-web@sha256:151ae51b29e694e48b01f95db5f704a174f5e57cc6b49a409b4fa76aa31ee1a7
            env:
              - name: SCRUTINY_WEB_INFLUXDB_HOST
                value: scrutiny-influxdb-influxdb2
              - name: SCRUTINY_WEB_INFLUXDB_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: scrutiny-influxdb-admin
                    key: admin-token
              - name: SCRUTINY_WEB_METRICS_ENABLED
                value: "true"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
    service:
      main:
        controller: hub
        ports:
          http:
            port: 8080
    ingress:
      main:
        enabled: false
    route:
      main:
        enabled: true
        kind: HTTPRoute
        parentRefs:
          - group: gateway.networking.k8s.io
            kind: ListenerSet
            name: scrutiny-web
            namespace: monitoring-system
            sectionName: https
        hostnames:
          - scrutiny.${SERVICE_DOMAIN}
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - identifier: main
    persistence:
      config:
        type: persistentVolumeClaim
        storageClass: cluster-replicated
        accessMode: ReadWriteOnce
        size: 1Gi
        globalMounts:
          - path: /opt/scrutiny/config
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: scrutiny-collector
  namespace: monitoring-system
spec:
  interval: 1m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    global:
      alwaysAppendIdentifierToResourceName: true
    defaultPodOptions:
      tolerations:
        - operator: Exists
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
    controllers:
      spoke:
        type: daemonset
        containers:
          collector:
            image:
              repository: ghcr.io/starosdev/scrutiny
              tag: 1.76.9-collector@sha256:48fbe760ae5916c19551f62ca065e3ee4be5e9baa38884e3cd1b3f3ac477dde8
            env:
              - name: COLLECTOR_API_ENDPOINT
                value: http://scrutiny-web:8080
              - name: COLLECTOR_CRON_SCHEDULE
                value: "*/15 * * * *"
              - name: COLLECTOR_HOST_ID
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
            securityContext:
              privileged: true
              # privileged already grants SYS_RAWIO (SATA) and SYS_ADMIN (NVMe)
              capabilities:
                drop: ["ALL"]
    configMaps:
      config:
        data:
          collector.yaml: |
            allow_listed_devices:
            - /dev/sda
            - /dev/nvme0
    persistence:
      config:
        type: configMap
        name: scrutiny-collector-config
        globalMounts:
          - path: /opt/scrutiny/config/collector.yaml
            subPath: collector.yaml
      udev:
        type: hostPath
        hostPath: /run/udev
        globalMounts:
          - path: /run/udev
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: scrutiny-web-gateway
  namespace: monitoring-system
spec:
  interval: 1m
  chart:
    spec:
      chart: ./charts/gateway-route
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  values:
    name: scrutiny-web
    hostname: scrutiny.${SERVICE_DOMAIN}
