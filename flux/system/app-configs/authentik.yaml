apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: authentik
spec:
  interval: 1m
  chart:
    spec:
      chart: authentik
      version: 2026.8.5
      sourceRef:
        kind: HelmRepository
        name: goauthentik
        namespace: flux-system
  values:
    global:
      image:
        repository: ghcr.io/goauthentik/server
        tag: "2026.8.5@sha256:602227a86455d6772e3d16b7d852713c4f864f40df5df894abd1285bb53979a5"
    authentik:
      existingSecret:
        secretName: authentik-secrets
      error_reporting:
        enabled: false
    server:
      ingress:
        enabled: false
    postgresql:
      enabled: false
  # The chart has no hostUsers value, so the pod hardening is patched in after rendering.
  # No volume at /data: authentik only enables uploads when /data is a mount, and it is not one today.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: authentik-server
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: authentik-server
              spec:
                template:
                  spec:
                    hostUsers: false
                    # runs as the default ServiceAccount, which has no RBAC bindings
                    automountServiceAccountToken: false
                    securityContext:
                      runAsNonRoot: true
                      runAsUser: 1000
                      runAsGroup: 1000
                      seccompProfile:
                        type: RuntimeDefault
                    containers:
                      - name: server
                        securityContext:
                          allowPrivilegeEscalation: false
                          readOnlyRootFilesystem: true
                          capabilities:
                            drop: ["ALL"]
                        volumeMounts:
                          - name: tmp
                            mountPath: /tmp
                    volumes:
                      - name: tmp
                        emptyDir: {}
          # The worker keeps its token: it manages outposts through the authentik ServiceAccount.
          - target:
              kind: Deployment
              name: authentik-worker
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: authentik-worker
              spec:
                template:
                  spec:
                    hostUsers: false
                    securityContext:
                      runAsNonRoot: true
                      runAsUser: 1000
                      runAsGroup: 1000
                      seccompProfile:
                        type: RuntimeDefault
                    containers:
                      - name: worker
                        securityContext:
                          allowPrivilegeEscalation: false
                          readOnlyRootFilesystem: true
                          capabilities:
                            drop: ["ALL"]
                        volumeMounts:
                          - name: tmp
                            mountPath: /tmp
                    volumes:
                      - name: tmp
                        emptyDir: {}
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: authentik-postgresql
  namespace: authentik
spec:
  instances: 1
  # single instance: a PDB cannot protect anything and only blocks node drains
  enablePDB: false
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ClusterImageCatalog
    name: postgresql
    major: 18
  enableSuperuserAccess: false
  managed:
    roles:
      - name: stashbackup
        passwordSecret:
          name: postgres-backup-user
        login: true
        superuser: false
        inRoles:
          - pg_read_all_data
  bootstrap:
    initdb:
      database: authentik
      owner: authentik
      encoding: UTF8
      localeCollate: C
      localeCType: C
      secret:
        name: authentik-postgres-user
  storage:
    size: 10Gi
    storageClass: cluster-scratch
---
apiVersion: k8up.io/v1
kind: PreBackupPod
metadata:
  name: authentik-database-backup
  namespace: authentik
  labels:
    backup: authentik-database
  annotations:
    k8up.io/backup: "true"
spec:
  # Hold the dump until restic reads stdin; pending output kills the exec stream.
  backupCommand: sh -c 'sleep 60 && PGHOST="$POSTGRES_HOST" PGUSER="$POSTGRES_USER" PGPASSWORD="$POSTGRES_PASSWORD" pg_dumpall --clean'
  pod:
    spec:
      # Hardening: image pinned by digest (E8), non-root uid 26 from the image (E4), user namespace (D2)
      hostUsers: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 26
        runAsGroup: 26
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: authentik-database-backup
          image: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie@sha256:39add80f5b1e573e2f6b641c66fd1a2f8dede67ca0330e870285bc1078551390
          command:
            - "sleep"
            - "infinity"
          env:
            - name: POSTGRES_HOST
              value: authentik-postgresql-rw
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-backup-user
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-backup-user
                  key: password
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: authentik-database
  namespace: authentik
spec:
  backend:
    repoPasswordSecretRef:
      name: k8up-restic-secrets
      key: restic-password
    s3:
      bucket: Habitat-Giggle9-Composer/authentik
  backup:
    labelSelectors:
      - matchLabels:
          backup: authentik-database
    schedule: "41 4/6 * * *"
    concurrentRunsAllowed: false
    podConfigRef:
      name: authentik-database-backup
  prune:
    schedule: "31 0 1 * *"
    concurrentRunsAllowed: false
    podConfigRef:
      name: authentik-database-prune
    retention:
      keepHourly: 6
      keepDaily: 14
      keepWeekly: 12
      keepMonthly: 6
      keepYearly: 2
---
# k8up job pod for the backup Schedule above (D2, D5-D8). Runs in a user namespace as the image's uid 65532 (E4).
# It keeps its ServiceAccount token: k8up execs into the PreBackupPod and syncs Snapshot objects through the API.
# The restic container's writes go to k8up's own /k8up, /tmp and /.cache volumes, so its root filesystem is read-only.
apiVersion: k8up.io/v1
kind: PodConfig
metadata:
  name: authentik-database-backup
  namespace: authentik
spec:
  template:
    spec:
      hostUsers: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backup
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
# k8up job pod for the prune Schedule above (the prune container is named prune). Prune only talks to the restic
# repository, so it gets no API token; its Snapshot sync logs "cannot sync snapshots to the cluster" and the next
# backup re-syncs the list.
apiVersion: k8up.io/v1
kind: PodConfig
metadata:
  name: authentik-database-prune
  namespace: authentik
spec:
  template:
    spec:
      hostUsers: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prune
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik-gateway
  namespace: authentik
spec:
  interval: 1m
  chart:
    spec:
      chart: ./charts/gateway-route
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  values:
    name: authentik
    hostname: authentik.${SERVICE_DOMAIN}
    route:
      enabled: true
      backend:
        name: authentik-server
        port: 80
    redirect:
      enabled: false
