apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: monitoring-system
spec:
  interval: 1m
  chart:
    spec:
      chart: loki
      version: 7.6.0
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  values:
    deploymentMode: SingleBinary
    loki:
      image:
        registry: docker.io
        repository: grafana/loki
        tag: "3.7.10@sha256:b43c257ccfc925d4a50b8717cac61a3b51df8c48d01847936057e5c4075a24a7"
      podSecurityContext:
        seccompProfile:
          type: RuntimeDefault
      storage:
        type: filesystem
      commonConfig:
        replication_factor: 1
      schemaConfig:
        configs:
          - from: "2024-04-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
      pattern_ingester:
        enabled: true
      limits_config:
        allow_structured_metadata: true
        volume_enabled: true
      ruler:
        enable_api: true
    gateway:
      enabled: true
      hostUsers: false
      image:
        registry: docker.io
        repository: nginxinc/nginx-unprivileged
        tag: "1.31-alpine@sha256:b5047b9b76845eac124358373c6852377c52e4b05834a47647e955dd91cb8f1e"
      podSecurityContext:
        seccompProfile:
          type: RuntimeDefault
      ingress:
        enabled: false
    singleBinary:
      replicas: 1
      persistence:
        size: 500Gi
        storageClass: nas-replicated-hdd
    write:
      replicas: 0
    read:
      replicas: 0
    backend:
      replicas: 0
    ingester:
      replicas: 0
    querier:
      replicas: 0
    queryFrontend:
      replicas: 0
    queryScheduler:
      replicas: 0
    distributor:
      replicas: 0
    compactor:
      replicas: 0
    indexGateway:
      replicas: 0
    bloomGateway:
      replicas: 0
    lokiCanary:
      hostUsers: false
      image:
        registry: docker.io
        repository: grafana/loki-canary
        tag: "3.7.10@sha256:fb5e3e189f46c61196067c88afc37f82dcc9bd5a886180cdd4370b0b0110669e"
    memcached:
      image:
        repository: memcached
        tag: "1.6.45-alpine@sha256:084fb554292d1447bc2c68b80c2331b98834514f56c866bc21a61be3c2ee376d"
      podSecurityContext:
        seccompProfile:
          type: RuntimeDefault
    memcachedExporter:
      image:
        repository: prom/memcached-exporter
        tag: "v0.18.0@sha256:1458b31d4cae1a6618e85c8d31ecc49c4ebdcee3c8530be8d80d93e8792c4a58"
    chunksCache:
      hostUsers: false
    resultsCache:
      hostUsers: false
    sidecar:
      image:
        registry: docker.io
        repository: kiwigrid/k8s-sidecar
        tag: "2.14.3@sha256:52d311dcedd587421a236c4d6c621f05614c40a51386e955e0699dca97ec0880"
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: DaemonSet
              name: loki-canary
            patch: |
              apiVersion: apps/v1
              kind: DaemonSet
              metadata:
                name: loki-canary
              spec:
                template:
                  spec:
                    automountServiceAccountToken: false
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki-gateway-route
  namespace: monitoring-system
spec:
  interval: 1m
  chart:
    spec:
      chart: ./charts/gateway-route
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  values:
    name: loki
    hostname: loki.${SERVICE_DOMAIN}
    route:
      enabled: true
      backend:
        name: loki-gateway
        port: 80
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-datasource
  namespace: monitoring-system
  labels:
    grafana_datasource: "1"
data:
  datasource.yaml: |-
    apiVersion: 1
    datasources:
      - name: "Loki"
        type: loki
        uid: loki
        url: http://loki.monitoring-system:3100/
        jsonData:
          httpHeaderName1: 'X-Scope-OrgID'
        secureJsonData:
          httpHeaderValue1: '1'
