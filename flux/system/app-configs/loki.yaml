apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: monitoring-system
spec:
  interval: 1m
  chart:
    spec:
      chart: loki
      version: 7.5.0
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  values:
    deploymentMode: SingleBinary
    loki:
      image:
        registry: docker.io
        repository: grafana/loki
        tag: "3.6.16@sha256:79f3fbf2a3eca97dd735e2aa0871a2fc15365a81c68dea67f639b092c301f454"
      podSecurityContext:
        seccompProfile:
          type: RuntimeDefault
      storage:
        type: filesystem
      commonConfig:
        replication_factor: 1
      schemaConfig:
        configs:
          - from: "2024-04-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
      pattern_ingester:
        enabled: true
      limits_config:
        allow_structured_metadata: true
        volume_enabled: true
      ruler:
        enable_api: true
    gateway:
      enabled: true
      hostUsers: false
      image:
        registry: docker.io
        repository: nginxinc/nginx-unprivileged
        tag: "1.29-alpine@sha256:0c79d56aee561a1d81c63f00eee5fb5fe29279560cdc55e91425133104c7fbe6"
      podSecurityContext:
        seccompProfile:
          type: RuntimeDefault
      ingress:
        enabled: false
    singleBinary:
      replicas: 1
      persistence:
        size: 500Gi
        storageClass: nas-replicated-hdd
    write:
      replicas: 0
    read:
      replicas: 0
    backend:
      replicas: 0
    ingester:
      replicas: 0
    querier:
      replicas: 0
    queryFrontend:
      replicas: 0
    queryScheduler:
      replicas: 0
    distributor:
      replicas: 0
    compactor:
      replicas: 0
    indexGateway:
      replicas: 0
    bloomGateway:
      replicas: 0
    lokiCanary:
      hostUsers: false
      image:
        registry: docker.io
        repository: grafana/loki-canary
        tag: "3.6.16@sha256:6d53ce040b436e558936fe05514729c230e9e04edf1fe411d02701025e515924"
    memcached:
      image:
        repository: memcached
        tag: "1.6.45-alpine@sha256:6d687bc26426d092694743054fc674fc54d3c161fefa1ad20b54192f8580a8c1"
      podSecurityContext:
        seccompProfile:
          type: RuntimeDefault
    memcachedExporter:
      image:
        repository: prom/memcached-exporter
        tag: "v0.18.0@sha256:1458b31d4cae1a6618e85c8d31ecc49c4ebdcee3c8530be8d80d93e8792c4a58"
    chunksCache:
      hostUsers: false
    resultsCache:
      hostUsers: false
    sidecar:
      image:
        registry: docker.io
        repository: kiwigrid/k8s-sidecar
        tag: "2.5.0@sha256:a6b3f707f883108376514489a94d6629109a327b2978e1d826cd104c4ca436df"
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: DaemonSet
              name: loki-canary
            patch: |
              apiVersion: apps/v1
              kind: DaemonSet
              metadata:
                name: loki-canary
              spec:
                template:
                  spec:
                    automountServiceAccountToken: false
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki-gateway-route
  namespace: monitoring-system
spec:
  interval: 1m
  chart:
    spec:
      chart: ./charts/gateway-route
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  values:
    name: loki
    hostname: loki.${SERVICE_DOMAIN}
    route:
      enabled: true
      backend:
        name: loki-gateway
        port: 80
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-datasource
  namespace: monitoring-system
  labels:
    grafana_datasource: "1"
data:
  datasource.yaml: |-
    apiVersion: 1
    datasources:
      - name: "Loki"
        type: loki
        uid: loki
        url: http://loki.monitoring-system:3100/
        jsonData:
          httpHeaderName1: 'X-Scope-OrgID'
        secureJsonData:
          httpHeaderValue1: '1'
