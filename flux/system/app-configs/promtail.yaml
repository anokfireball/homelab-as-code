apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: promtail
  namespace: monitoring-system
spec:
  interval: 1m
  chart:
    spec:
      chart: promtail
      version: 6.17.1
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  values:
    # promtail stays uid 0: D1 hostPath /var/log/pods and /var/lib/docker/containers (root-owned node logs). Namespace stays privileged.
    image:
      # renovate: datasource=docker depName=docker.io/grafana/promtail
      tag: "3.6.11@sha256:a761cb834cfaeee29745440d4884d6748f0a08d8f68928db1d707018c1dcfbe9"
    config:
      clients:
        - url: http://loki.monitoring-system:3100/loki/api/v1/push
          headers:
            X-Scope-OrgID: "1"
    podSecurityContext:
      runAsUser: 0
      runAsGroup: 0
      seccompProfile:
        type: RuntimeDefault
    sidecar:
      configReloader:
        enabled: true
        image:
          # renovate: datasource=docker depName=ghcr.io/jimmidyson/configmap-reload
          tag: "v0.12.0@sha256:a7c754986900e41fc47656bdc8dfce33227112a7cce547e0d9ef5d279f4f8e99"
        containerSecurityContext:
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
          allowPrivilegeEscalation: false
