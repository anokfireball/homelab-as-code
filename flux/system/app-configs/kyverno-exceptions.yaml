---
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: audit-readonly-root-filesystem-renovate-system-renovate
  namespace: kyverno-system
spec:
  policyRefs:
    - name: audit-readonly-root-filesystem
      kind: ValidatingPolicy
  # Background scans report the CronJob, its Jobs and their Pods separately.
  matchConditions:
    - name: renovate
      expression: >-
        object.metadata.namespace == 'renovate-system' &&
        ((object.kind == 'CronJob' && object.metadata.name == 'renovate') ||
        object.metadata.?ownerReferences.orValue([]).exists(o, (o.kind == 'CronJob' && o.name == 'renovate') ||
        (o.kind == 'Job' && o.name.matches('^renovate-[0-9]+$'))))
  properties:
    reason: >-
      Renovate's slim image installs tools at runtime (binarySource=install, e.g. flux for gotk-components.yaml)
      into /opt/containerbase next to the git and docker it ships, and an init container seeding a writable copy
      would run after renovate because add-healthcheck-to-cronjobs prepends the moved container to initContainers.
---
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: audit-user-namespaces-default-storage-canary
  namespace: kyverno-system
spec:
  policyRefs:
    - name: audit-user-namespaces
      kind: ValidatingPolicy
  # Background scans report the CronJob, its Jobs and their Pods separately.
  matchConditions:
    - name: storage-canary-nfs-or-rwx
      expression: >-
        object.metadata.namespace == 'default' &&
        ((object.kind == 'CronJob' && object.metadata.name in ['nas-canary-replicated', 'nas-canary-scratch',
        'longhorn-canary-rwx', 'longhorn-canary-rwx-write']) ||
        object.metadata.?ownerReferences.orValue([]).exists(o, (o.kind == 'CronJob' && o.name in ['nas-canary-replicated',
        'nas-canary-scratch', 'longhorn-canary-rwx', 'longhorn-canary-rwx-write']) ||
        (o.kind == 'Job' && o.name.matches('^(nas-canary-replicated|nas-canary-scratch|longhorn-canary-rwx|longhorn-canary-rwx-write)-[0-9]+$'))))
  properties:
    reason: >-
      The nas-canary-* CronJobs mount NFS PVCs (nas-replicated-hdd-canary on nas-hdd, nas-scratch-ssd on nas-ssd) and
      longhorn-canary-rwx-write/longhorn-canary-rwx mount a Longhorn ReadWriteMany volume served over NFS; these cannot
      be idmapped, so hostUsers=false cannot be set. The pods still run as uid 65534 with all capabilities dropped.
---
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: audit-user-namespaces-monitoring-system-loki
  namespace: kyverno-system
spec:
  policyRefs:
    - name: audit-user-namespaces
      kind: ValidatingPolicy
  matchConditions:
    - name: loki
      expression: >-
        object.metadata.namespace == 'monitoring-system' &&
        object.metadata.?labels[?'app.kubernetes.io/name'].orValue('') == 'loki' &&
        object.metadata.?labels[?'app.kubernetes.io/component'].orValue('') == 'single-binary'
  properties:
    reason: >-
      Loki's single-binary StatefulSet mounts its 500Gi chunk PVC from storage class nas-replicated-hdd
      (provisioner nas-hdd, fsType nfs), which cannot be idmapped, so the pod must stay in the host user namespace.
---
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: audit-readonly-root-filesystem-monitoring-system-scrutiny-collector
  namespace: kyverno-system
spec:
  policyRefs:
    - name: audit-readonly-root-filesystem
      kind: ValidatingPolicy
  matchConditions:
    - name: scrutiny-collector
      expression: >-
        object.metadata.namespace == 'monitoring-system' &&
        object.metadata.?labels[?'app.kubernetes.io/controller'].orValue('') == 'spoke' &&
        object.metadata.?labels[?'app.kubernetes.io/instance'].orValue('') == 'scrutiny-collector' &&
        object.metadata.?labels[?'app.kubernetes.io/name'].orValue('') == 'scrutiny-collector'
  properties:
    reason: >-
      The privileged collector writes /env.sh into / and /etc/cron.d/scrutiny at start, and cron, apt and the crond pid
      write /run, /var/lib/apt and /var/backups (E6), so its root filesystem must stay writable (D6).
---
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: audit-user-namespaces-monitoring-system-scrutiny-influxdb-influxdb2
  namespace: kyverno-system
spec:
  policyRefs:
    - name: audit-user-namespaces
      kind: ValidatingPolicy
  matchConditions:
    - name: scrutiny-influxdb-influxdb2
      expression: >-
        object.metadata.namespace == 'monitoring-system' &&
        object.metadata.?labels[?'app.kubernetes.io/instance'].orValue('') == 'scrutiny-influxdb' &&
        object.metadata.?labels[?'app.kubernetes.io/name'].orValue('') == 'influxdb2'
  properties:
    reason: >-
      The data PVC scrutiny-influxdb-influxdb2 is on the nas-replicated-hdd class (freenas-nfs NFS export), which cannot be idmapped, so hostUsers: false is not possible (D2).
---
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: audit-user-namespaces-monitoring-system-kube-prometheus-stack-prometheus
  namespace: kyverno-system
spec:
  policyRefs:
    - name: audit-user-namespaces
      kind: ValidatingPolicy
  matchConditions:
    - name: prometheus
      expression: >-
        object.metadata.namespace == 'monitoring-system' &&
        object.metadata.?labels[?'operator.prometheus.io/name'].orValue('') == 'kube-prometheus-stack-prometheus'
  properties:
    reason: >-
      Prometheus TSDB PVC is nas-replicated-hdd (StorageClass fsType nfs, NFS export), which cannot be idmapped for hostUsers: false.
---
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: audit-image-digest-default-unifi-mongodb
  namespace: kyverno-system
spec:
  policyRefs:
    - name: audit-image-digest
      kind: ValidatingPolicy
  matchConditions:
    - name: unifi-mongodb
      expression: >-
        object.metadata.namespace == 'default' &&
        object.metadata.?labels[?'app'].orValue('') == 'unifi-mongodb-svc'
  properties:
    reason: >-
      The operator derives the mongod image tag from MongoDBCommunity spec.version and imageType
      (quay.io/mongodb/mongodb-community-server:9.0.4-ubi8), and that image is unsigned; a digest in the
      operator values would pin every MongoDB version to one image. The operator-chosen hook, readiness probe and agent are digest-pinned in mongodb-kubernetes.yaml.
---
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: audit-readonly-root-filesystem-default-unifi-controller
  namespace: kyverno-system
spec:
  policyRefs:
    - name: audit-readonly-root-filesystem
      kind: ValidatingPolicy
  matchConditions:
    - name: unifi-controller
      expression: >-
        object.metadata.namespace == 'default' &&
        object.metadata.?labels[?'app.kubernetes.io/controller'].orValue('') == 'main' &&
        object.metadata.?labels[?'app.kubernetes.io/instance'].orValue('') == 'unifi-controller' &&
        object.metadata.?labels[?'app.kubernetes.io/name'].orValue('') == 'unifi-controller'
  properties:
    reason: >-
      The LinuxServer s6-overlay init runs as root (PID 1 uid 0) and rewrites /etc/passwd and /etc/group and links /usr/lib/unifi/{data,logs,run} on every start, and the image has no documented non-root mode, so the root filesystem must stay writable.
---
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: audit-readonly-root-filesystem-default-pihole
  namespace: kyverno-system
spec:
  policyRefs:
    - name: audit-readonly-root-filesystem
      kind: ValidatingPolicy
  # Background scans report the Deployment, its ReplicaSets and its Pods separately.
  matchConditions:
    - name: pihole
      expression: >-
        object.metadata.namespace == 'default' &&
        object.metadata.?labels[?'app'].orValue('') == 'pihole' &&
        object.metadata.?labels[?'release'].orValue('') == 'pihole'
  properties:
    reason: >-
      pihole's start.sh runs `sed -i` on /crontab.txt in the image root on every start (start_cron randomises the
      gravity/updatechecker times), so / must stay writable; /etc/pihole, /run, /tmp, /var/tmp, /var/log/pihole and
      /etc/crontabs are emptyDirs.
---
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: audit-user-namespaces-default-wger
  namespace: kyverno-system
spec:
  policyRefs:
    - name: audit-user-namespaces
      kind: ValidatingPolicy
  matchConditions:
    - name: wger-rwx
      expression: >-
        object.metadata.namespace == 'default' &&
        object.metadata.?labels[?'app.kubernetes.io/name'].orValue('') in ['wger-app', 'wger-celery', 'wger-celery-worker', 'wger-nginx']
  properties:
    reason: >-
      wger's media, static and celery-beat PVCs are Longhorn ReadWriteMany volumes (cluster-replicated) served over NFS by the
      share manager, which cannot be idmapped, so these pods must stay in the host user namespace.
---
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: audit-readonly-root-filesystem-default-fresh-rss
  namespace: kyverno-system
spec:
  policyRefs:
    - name: audit-readonly-root-filesystem
      kind: ValidatingPolicy
  # Background scans report the Deployment, its ReplicaSet and its Pods; all carry the same labels.
  matchConditions:
    - name: fresh-rss
      expression: >-
        object.metadata.namespace == 'default' &&
        object.metadata.?labels[?'app.kubernetes.io/controller'].orValue('') == 'main' &&
        object.metadata.?labels[?'app.kubernetes.io/instance'].orValue('') == 'fresh-rss' &&
        object.metadata.?labels[?'app.kubernetes.io/name'].orValue('') == 'fresh-rss'
  properties:
    reason: >-
      fresh-rss entrypoint.sh writes /etc/localtime, /etc/timezone, /etc/php*/php.ini, the Apache LISTEN config and
      Docker/env.txt on every start, and crond and httpd write /run (E6), so the root filesystem must stay writable (D6).
---
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: audit-user-namespaces-default-paperless-data-backup
  namespace: kyverno-system
spec:
  policyRefs:
    - name: audit-user-namespaces
      kind: ValidatingPolicy
  # Background scans report the Job and its Pods separately.
  matchConditions:
    - name: paperless-data-backup
      expression: >-
        object.metadata.namespace == 'default' &&
        ((object.kind == 'Job' && object.metadata.name.matches('^backup-paperless-data-backup-[a-z0-9]+-[0-9]+$')) ||
        object.metadata.?ownerReferences.orValue([]).exists(o, o.kind == 'Job' && o.name.matches('^backup-paperless-data-backup-[a-z0-9]+-[0-9]+$')))
  properties:
    reason: >-
      k8up backup of the paperless-data Schedule mounts the static NFS PV nas-dokumente-export
      (192.168.1.2:/mnt/tank/Dokumente/Paperless/export). NFS cannot be idmapped, so hostUsers cannot be set;
      the Job runs as 1000:1000 with a read-only root filesystem, dropped capabilities and RuntimeDefault seccomp.
---
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: audit-readonly-root-filesystem-arrchive-qbittorrent
  namespace: kyverno-system
spec:
  policyRefs:
    - name: audit-readonly-root-filesystem
      kind: ValidatingPolicy
  matchConditions:
    - name: qbittorrent
      expression: >-
        object.metadata.namespace == 'arrchive' &&
        object.metadata.?labels[?'app.kubernetes.io/instance'].orValue('') == 'qbittorrent' &&
        object.metadata.?labels[?'app.kubernetes.io/controller'].orValue('') == 'main'
  properties:
    reason: >-
      gluetun (root with NET_ADMIN, D1) writes /etc/passwd at start to add its nonrootuser (uid 1000) for openvpn (E6),
      which is outside any dedicated directory, so its root filesystem must stay writable (D6); the other containers are read-only.
---
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: audit-user-namespaces-default-immich-server
  namespace: kyverno-system
spec:
  policyRefs:
    - name: audit-user-namespaces
      kind: ValidatingPolicy
  matchConditions:
    - name: immich-server
      expression: >-
        object.metadata.namespace == 'default' &&
        object.metadata.?labels[?'app.kubernetes.io/controller'].orValue('') == 'main' &&
        object.metadata.?labels[?'app.kubernetes.io/instance'].orValue('') == 'immich' &&
        object.metadata.?labels[?'app.kubernetes.io/name'].orValue('') == 'server'
  properties:
    reason: >-
      Library volume immich-library is Longhorn ReadWriteMany (share-manager NFS) and the external library is the NFS PV
      nas-photos (192.168.1.2:/mnt/tank/Bilder), so hostUsers=false is impossible (D2); the root-owned library also
      rules out a non-root uid without a chown.
---
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: audit-user-namespaces-default-immich-machine-learning
  namespace: kyverno-system
spec:
  policyRefs:
    - name: audit-user-namespaces
      kind: ValidatingPolicy
  matchConditions:
    - name: immich-machine-learning
      expression: >-
        object.metadata.namespace == 'default' &&
        object.metadata.?labels[?'app.kubernetes.io/controller'].orValue('') == 'main' &&
        object.metadata.?labels[?'app.kubernetes.io/instance'].orValue('') == 'immich' &&
        object.metadata.?labels[?'app.kubernetes.io/name'].orValue('') == 'machine-learning'
  properties:
    reason: >-
      Model cache volume immich-machine-learning is Longhorn ReadWriteMany (share-manager NFS), so hostUsers=false is
      impossible (D2); its root-owned contents rule out a non-root uid without a chown.
---
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: audit-user-namespaces-default-immich-data-backup
  namespace: kyverno-system
spec:
  policyRefs:
    - name: audit-user-namespaces
      kind: ValidatingPolicy
  # Backup jobs only. The prune jobs have their own PodConfig (immich-data-prune) with hostUsers=false and no NFS volume.
  matchConditions:
    - name: immich-data-backup
      expression: >-
        object.metadata.namespace == 'default' && object.metadata.?ownerReferences.orValue([]).exists(o,
        o.kind == 'Job' && o.name.matches('^backup-immich-data-backup-[a-z0-9]+-[0-9]+$'))
  properties:
    reason: >-
      The backup job mounts the NFS-backed PVC nas-photos (bound to the NFS PV, D2), where hostUsers=false is impossible;
      PodConfig immich-data-backup leaves hostUsers unset.
---
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: audit-image-signature-cloudnative-pg-default-immich-database-backup
  namespace: kyverno-system
spec:
  policyRefs:
    - name: audit-image-signature-cloudnative-pg
      kind: ImageValidatingPolicy
  matchConditions:
    - name: immich-database-prebackup
      expression: >-
        object.metadata.namespace == 'default' &&
        object.spec.containers.exists(c, c.name == 'immich-database-backup' &&
        c.image == 'ghcr.io/cloudnative-pg/postgresql:16.15-standard-trixie@sha256:2b6f4c13a459dcf9bb070b1286c85295f381b34114a85d8092cbdbdd88265f3a')
  properties:
    reason: >-
      No cosign signature exists for this digest, and Kyverno CLI v1.19.2 fails the policy for it, while the same policy
      passes for the bitwarden CNPG 15.19 digest; scoped to the immich PreBackupPod container only.
---
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: audit-readonly-root-filesystem-longhorn-system-longhorn-pre-upgrade
  namespace: kyverno-system
spec:
  policyRefs:
    - name: audit-readonly-root-filesystem
      kind: ValidatingPolicy
  # Background scans report the Job and its Pod separately.
  matchConditions:
    - name: longhorn-pre-upgrade
      expression: >-
        object.metadata.namespace == 'longhorn-system' &&
        ((object.kind == 'Job' && object.metadata.name == 'longhorn-pre-upgrade') ||
        object.metadata.?ownerReferences.orValue([]).exists(o, o.kind == 'Job' && o.name == 'longhorn-pre-upgrade'))
  properties:
    reason: >-
      The pre-upgrade hook runs on every Helm upgrade as a privileged pod with the host /proc (D1). Its root filesystem
      stays writable because the write set of its environment check is not verified from source; a read-only root would
      turn an unverified write into a failed upgrade (D6, Step 8).
---
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: audit-user-namespaces-default-immich-data-backup-job
  namespace: kyverno-system
spec:
  policyRefs:
    - name: audit-user-namespaces
      kind: ValidatingPolicy
  # Background scans also report the backup Job object itself; its pod template carries the same unset hostUsers.
  matchConditions:
    - name: immich-data-backup-job
      expression: >-
        object.metadata.namespace == 'default' && object.kind == 'Job' &&
        object.metadata.name.matches('^backup-immich-data-backup-[a-z0-9]+-[0-9]+$')
  properties:
    reason: >-
      Job object of the immich data backup (see audit-user-namespaces-default-immich-data-backup): nas-photos is NFS-backed
      (D2), so the pod template leaves hostUsers unset.
---
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: audit-image-digest-flux-system-flux
  namespace: kyverno-system
spec:
  policyRefs:
    - name: audit-image-digest
      kind: ValidatingPolicy
  # Flux controller images are not pinned in Git: flux bootstrap regenerates gotk-components.yaml, and Renovate's
  # flux manager regenerates it on version bumps. An images: digest override in kustomization.yaml would stay
  # on the old digest after an upgrade (silent downgrade), and Renovate's kustomize manager would track it separately.
  matchConditions:
    - name: flux
      expression: >-
        object.metadata.namespace == 'flux-system' &&
        object.metadata.?labels[?'app.kubernetes.io/part-of'].orValue('') == 'flux' &&
        object.spec.containers.all(c, c.image.startsWith('ghcr.io/fluxcd/'))
  properties:
    reason: >-
      Flux controllers (source, kustomize, helm, notification) run the bootstrap-generated gotk-components.yaml
      images ghcr.io/fluxcd/*:v1.9.6, v1.9.6, v1.6.5, v1.9.4 (signed by fluxcd GitHub Actions); a Git digest pin
      would be overwritten by flux bootstrap and Renovate's flux manager on version bumps.
---
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: audit-image-digest-flux-system-flux-controllers
  namespace: kyverno-system
spec:
  policyRefs:
    - name: audit-image-digest
      kind: ValidatingPolicy
  # audit-image-digest-flux-system-flux matches Pods only (spec.containers). Kyverno also evaluates the Deployments and
  # ReplicaSets, which carry the same Flux images under spec.template, so they need this exception too.
  matchConditions:
    - name: flux-controllers
      expression: >-
        object.metadata.namespace == 'flux-system' &&
        object.metadata.?labels[?'app.kubernetes.io/part-of'].orValue('') == 'flux' &&
        has(object.spec.template) &&
        object.spec.template.spec.containers.all(c, c.image.startsWith('ghcr.io/fluxcd/'))
  properties:
    reason: >-
      Same Flux controller images as audit-image-digest-flux-system-flux (not pinned in Git, see that exception),
      on the Deployment and ReplicaSet objects that carry them under spec.template.
---
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: audit-user-namespaces-default-wger-deployments
  namespace: kyverno-system
spec:
  policyRefs:
    - name: audit-user-namespaces
      kind: ValidatingPolicy
  # The Deployment objects carry the chart's app.kubernetes.io/name=wger label, so audit-user-namespaces-default-wger (pod labels) does not match them.
  matchConditions:
    - name: wger-deployments
      expression: >-
        object.kind == 'Deployment' && object.metadata.namespace == 'default' &&
        object.metadata.name in ['wger-app', 'wger-celery', 'wger-celery-worker', 'wger-nginx']
  properties:
    reason: >-
      Same workloads and reason as audit-user-namespaces-default-wger: the Deployments' pod templates leave hostUsers unset
      because wger's Longhorn ReadWriteMany PVCs (media, static, celery-beat) are served over NFS by the share manager and
      cannot be idmapped.
---
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: audit-image-digest-default-unifi-mongodb-statefulset
  namespace: kyverno-system
spec:
  policyRefs:
    - name: audit-image-digest
      kind: ValidatingPolicy
  # The MongoDBCommunity operator generates these StatefulSets without labels, so the pod exception above (pod label app=unifi-mongodb-svc) does not match the StatefulSet objects.
  matchConditions:
    - name: unifi-mongodb-statefulset
      expression: >-
        object.kind == 'StatefulSet' && object.metadata.namespace == 'default' &&
        object.metadata.name in ['unifi-mongodb', 'unifi-mongodb-arb']
  properties:
    reason: >-
      Same operator-chosen mongod image as audit-image-digest-default-unifi-mongodb (quay.io/mongodb/mongodb-community-server:9.0.4-ubi8,
      unsigned, and pinning it would pin every MongoDB version to one image). The StatefulSet objects inherit that image from the
      MongoDBCommunity operator.
---
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: audit-user-namespaces-default-unifi-mongodb-statefulset
  namespace: kyverno-system
spec:
  policyRefs:
    - name: audit-user-namespaces
      kind: ValidatingPolicy
  # Only the StatefulSet objects. The pods are not excepted: unifi-mongodb-0 runs with hostUsers=false.
  matchConditions:
    - name: unifi-mongodb-statefulset
      expression: >-
        object.kind == 'StatefulSet' && object.metadata.namespace == 'default' &&
        object.metadata.name in ['unifi-mongodb', 'unifi-mongodb-arb']
  properties:
    reason: >-
      The MongoDBCommunity operator drops hostUsers from the StatefulSet pod template, so the StatefulSet objects fail even
      though the pods are hardened: the MutatingAdmissionPolicy harden-unifi-mongodb sets hostUsers=false on pods with label
      app=unifi-mongodb-svc at admission (live pod unifi-mongodb-0 reports hostUsers=false).
---
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: audit-user-namespaces-kyverno-system-kyverno-migrate-resources
  namespace: kyverno-system
spec:
  policyRefs:
    - name: audit-user-namespaces
      kind: ValidatingPolicy
  # Background scans report the hook Job and its Pod separately.
  matchConditions:
    - name: kyverno-migrate-resources
      expression: >-
        object.metadata.namespace == 'kyverno-system' &&
        ((object.kind == 'Job' && object.metadata.name == 'kyverno-migrate-resources') ||
        object.metadata.?ownerReferences.orValue([]).exists(o, o.kind == 'Job' && o.name == 'kyverno-migrate-resources'))
  properties:
    reason: >-
      Helm post-upgrade hook Job kyverno-migrate-resources (kyverno chart 3.9.2, crds.migration) cannot take hostUsers: false.
      The chart's hook template has no hostUsers setting, and Helm 3 does not run Flux postRenderers on hook manifests (checked
      with helm v3.18.4: the four controller Deployments were patched, the hook Jobs were not). The pod runs as uid 65534 with a
      read-only root filesystem, all capabilities dropped and RuntimeDefault seccomp.
---
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: audit-service-account-token-kyverno-system-kyverno-migrate-resources
  namespace: kyverno-system
spec:
  policyRefs:
    - name: audit-service-account-token
      kind: ValidatingPolicy
  # Background scans report the hook Job and its Pod separately.
  matchConditions:
    - name: kyverno-migrate-resources
      expression: >-
        object.metadata.namespace == 'kyverno-system' &&
        ((object.kind == 'Job' && object.metadata.name == 'kyverno-migrate-resources') ||
        object.metadata.?ownerReferences.orValue([]).exists(o, o.kind == 'Job' && o.name == 'kyverno-migrate-resources'))
  properties:
    reason: >-
      The hook Job needs its ServiceAccount token: it lists and updates kyverno.io and policies.kyverno.io CRs and CRDs
      (crds.migration keeps automountServiceAccountToken true). The ClusterRole, ClusterRoleBinding and ServiceAccount are
      post-upgrade hook resources deleted on hook success (hook-delete-policy hook-succeeded), so the RoleBinding the control
      looks for is gone by the time background scans evaluate the completed pod.
