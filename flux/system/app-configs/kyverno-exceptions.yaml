---
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: audit-readonly-root-filesystem-renovate-system-renovate
  namespace: kyverno-system
spec:
  policyRefs:
    - name: audit-readonly-root-filesystem
      kind: ValidatingPolicy
  # Background scans report the CronJob, its Jobs and their Pods separately.
  matchConditions:
    - name: renovate
      expression: >-
        object.metadata.namespace == 'renovate-system' &&
        ((object.kind == 'CronJob' && object.metadata.name == 'renovate') ||
        object.metadata.?ownerReferences.orValue([]).exists(o, (o.kind == 'CronJob' && o.name == 'renovate') ||
        (o.kind == 'Job' && o.name.matches('^renovate-[0-9]+$'))))
  properties:
    reason: >-
      Renovate's slim image installs tools at runtime (binarySource=install, e.g. flux for gotk-components.yaml)
      into /opt/containerbase next to the git and docker it ships, and an init container seeding a writable copy
      would run after renovate because add-healthcheck-to-cronjobs prepends the moved container to initContainers.
---
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: audit-user-namespaces-default-storage-canary
  namespace: kyverno-system
spec:
  policyRefs:
    - name: audit-user-namespaces
      kind: ValidatingPolicy
  # Background scans report the CronJob, its Jobs and their Pods separately.
  matchConditions:
    - name: storage-canary-nfs-or-rwx
      expression: >-
        object.metadata.namespace == 'default' &&
        ((object.kind == 'CronJob' && object.metadata.name in ['nas-canary-replicated', 'nas-canary-scratch',
        'longhorn-canary-rwx', 'longhorn-canary-rwx-write']) ||
        object.metadata.?ownerReferences.orValue([]).exists(o, (o.kind == 'CronJob' && o.name in ['nas-canary-replicated',
        'nas-canary-scratch', 'longhorn-canary-rwx', 'longhorn-canary-rwx-write']) ||
        (o.kind == 'Job' && o.name.matches('^(nas-canary-replicated|nas-canary-scratch|longhorn-canary-rwx|longhorn-canary-rwx-write)-[0-9]+$'))))
  properties:
    reason: >-
      The nas-canary-* CronJobs mount NFS PVCs (nas-replicated-hdd-canary on nas-hdd, nas-scratch-ssd on nas-ssd) and
      longhorn-canary-rwx-write/longhorn-canary-rwx mount a Longhorn ReadWriteMany volume served over NFS; these cannot
      be idmapped, so hostUsers=false cannot be set. The pods still run as uid 65534 with all capabilities dropped.
---
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: audit-user-namespaces-monitoring-system-loki
  namespace: kyverno-system
spec:
  policyRefs:
    - name: audit-user-namespaces
      kind: ValidatingPolicy
  matchConditions:
    - name: loki
      expression: >-
        object.metadata.namespace == 'monitoring-system' &&
        object.metadata.?labels[?'app.kubernetes.io/name'].orValue('') == 'loki' &&
        object.metadata.?labels[?'app.kubernetes.io/component'].orValue('') == 'single-binary'
  properties:
    reason: >-
      Loki's single-binary StatefulSet mounts its 500Gi chunk PVC from storage class nas-replicated-hdd
      (provisioner nas-hdd, fsType nfs), which cannot be idmapped, so the pod must stay in the host user namespace.
---
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: audit-readonly-root-filesystem-monitoring-system-scrutiny-collector
  namespace: kyverno-system
spec:
  policyRefs:
    - name: audit-readonly-root-filesystem
      kind: ValidatingPolicy
  matchConditions:
    - name: scrutiny-collector
      expression: >-
        object.metadata.namespace == 'monitoring-system' &&
        object.metadata.?labels[?'app.kubernetes.io/controller'].orValue('') == 'spoke' &&
        object.metadata.?labels[?'app.kubernetes.io/instance'].orValue('') == 'scrutiny-collector' &&
        object.metadata.?labels[?'app.kubernetes.io/name'].orValue('') == 'scrutiny-collector'
  properties:
    reason: >-
      The privileged collector writes /env.sh into / and /etc/cron.d/scrutiny at start, and cron, apt and the crond pid
      write /run, /var/lib/apt and /var/backups (E6), so its root filesystem must stay writable (D6).
---
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: audit-user-namespaces-monitoring-system-scrutiny-influxdb-influxdb2
  namespace: kyverno-system
spec:
  policyRefs:
    - name: audit-user-namespaces
      kind: ValidatingPolicy
  matchConditions:
    - name: scrutiny-influxdb-influxdb2
      expression: >-
        object.metadata.namespace == 'monitoring-system' &&
        object.metadata.?labels[?'app.kubernetes.io/instance'].orValue('') == 'scrutiny-influxdb' &&
        object.metadata.?labels[?'app.kubernetes.io/name'].orValue('') == 'influxdb2'
  properties:
    reason: >-
      The data PVC scrutiny-influxdb-influxdb2 is on the nas-replicated-hdd class (freenas-nfs NFS export), which cannot be idmapped, so hostUsers: false is not possible (D2).
---
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: audit-user-namespaces-monitoring-system-kube-prometheus-stack-prometheus
  namespace: kyverno-system
spec:
  policyRefs:
    - name: audit-user-namespaces
      kind: ValidatingPolicy
  matchConditions:
    - name: prometheus
      expression: >-
        object.metadata.namespace == 'monitoring-system' &&
        object.metadata.?labels[?'operator.prometheus.io/name'].orValue('') == 'kube-prometheus-stack-prometheus'
  properties:
    reason: >-
      Prometheus TSDB PVC is nas-replicated-hdd (StorageClass fsType nfs, NFS export), which cannot be idmapped for hostUsers: false.
---
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: audit-image-digest-default-unifi-mongodb
  namespace: kyverno-system
spec:
  policyRefs:
    - name: audit-image-digest
      kind: ValidatingPolicy
  matchConditions:
    - name: unifi-mongodb
      expression: >-
        object.metadata.namespace == 'default' &&
        object.metadata.?labels[?'app'].orValue('') == 'unifi-mongodb-svc'
  properties:
    reason: >-
      The operator derives the mongod image tag from MongoDBCommunity spec.version and imageType
      (quay.io/mongodb/mongodb-community-server:9.0.4-ubi8), and that image is unsigned; a digest in the
      operator values would pin every MongoDB version to one image. The operator-chosen hook, readiness probe and agent are digest-pinned in mongodb-kubernetes.yaml.
---
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: audit-readonly-root-filesystem-default-unifi-controller
  namespace: kyverno-system
spec:
  policyRefs:
    - name: audit-readonly-root-filesystem
      kind: ValidatingPolicy
  matchConditions:
    - name: unifi-controller
      expression: >-
        object.metadata.namespace == 'default' &&
        object.metadata.?labels[?'app.kubernetes.io/controller'].orValue('') == 'main' &&
        object.metadata.?labels[?'app.kubernetes.io/instance'].orValue('') == 'unifi-controller' &&
        object.metadata.?labels[?'app.kubernetes.io/name'].orValue('') == 'unifi-controller'
  properties:
    reason: >-
      The LinuxServer s6-overlay init runs as root (PID 1 uid 0) and rewrites /etc/passwd and /etc/group and links /usr/lib/unifi/{data,logs,run} on every start, and the image has no documented non-root mode, so the root filesystem must stay writable.
