apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: metallb-system
spec:
  interval: 1m
  chart:
    spec:
      chart: metallb
      version: 0.16.1
      sourceRef:
        kind: HelmRepository
        name: metallb
        namespace: flux-system
  # MetalLB is used in L2/ARP mode only (no BGP peers/advertisements).
  # From 0.16.0 the default BGP backend became frr-k8s; disable it so the
  # chart deploys only the controller + L2 speaker (no frr daemonset/controller).
  values:
    frrk8s:
      enabled: false
