apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: metallb-system
spec:
  interval: 1m
  chart:
    spec:
      chart: metallb
      version: 0.16.2
      sourceRef:
        kind: HelmRepository
        name: metallb
        namespace: flux-system
  # MetalLB is used in L2/ARP mode only (no BGP peers/advertisements).
  # From 0.16.0 the default BGP backend became frr-k8s; disable it so the
  # chart deploys only the controller + L2 speaker (no frr daemonset/controller).
  values:
    frrk8s:
      enabled: false
    controller:
      image:
        # renovate: datasource=docker depName=quay.io/metallb/controller
        tag: "v0.16.2@sha256:34a6f107f29c4fc6e9d084a7f3bdb781aae7b5ee2b534195a2775ab68c09c503"
      # Pod-level values replace the chart default map, so the nobody UID stays explicit.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
    speaker:
      image:
        # renovate: datasource=docker depName=quay.io/metallb/speaker
        tag: "v0.16.2@sha256:01666518b091a6651d68891c802db84b2219495d7e0e41c2e61c46f9976be231"
      # Speaker stays root with hostNetwork and NET_RAW (L2 ARP, memberlist): D1 yes, so no userns and no runAsNonRoot.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: metallb-controller
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: metallb-controller
              spec:
                template:
                  spec:
                    hostUsers: false
