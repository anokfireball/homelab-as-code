apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader
  namespace: kube-system
spec:
  interval: 1m
  chart:
    spec:
      chart: reloader
      version: 2.2.20
      sourceRef:
        kind: HelmRepository
        name: stakater
        namespace: flux-system
  values:
    reloader:
      reloadOnCreate: true
      syncAfterRestart: true
      reloadStrategy: annotations
      readOnlyRootFileSystem: true
      deployment:
        hostUsers: false
        securityContext:
          runAsGroup: 65534
        containerSecurityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
    image:
      repository: ghcr.io/stakater/reloader
      tag: v1.4.25@sha256:db8b1818f5da373ab85c05b30220fcae80a9ac0532052e6d68a6a5999111f18f
