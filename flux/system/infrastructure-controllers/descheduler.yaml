apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: descheduler
  namespace: kube-system
spec:
  interval: 1m
  chart:
    spec:
      chart: descheduler
      version: 0.37.0
      sourceRef:
        kind: HelmRepository
        name: descheduler
        namespace: flux-system
  values:
    # Suspended in the cluster before this PR (live CronJob suspend: true, not set in Git); keep it suspended.
    suspend: true
    image:
      repository: registry.k8s.io/descheduler/descheduler
      tag: v0.37.0@sha256:88deef34ff5c85cb69676d7073dd641bd5c35b156bc1ef4a35ca8fbf9644da98
    hostUsers: false
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      runAsGroup: 1000
    deschedulerPolicy:
      nodeSelector: "node-role.kubernetes.io/worker="
      profiles:
        - name: default
          pluginConfig:
            - name: "RemoveDuplicates"
            - name: "LowNodeUtilization"
              args:
                thresholds:
                  "memory": 35
                targetThresholds:
                  "memory": 65
                evictableNamespaces:
                  exclude:
                    - "kube-system"
                    - "longhorn-system"
          plugins:
            balance:
              enabled:
                - "RemoveDuplicates"
                - "LowNodeUtilization"
  # https://github.com/kubernetes-sigs/descheduler/issues/1595
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: ClusterRole
            patch: |
              - op: add
                path: /rules/-
                value:
                  verbs: ["get", "watch", "list"]
                  apiGroups: ["policy"]
                  resources: ["poddisruptionbudgets"]
          - target:
              kind: CronJob
              name: descheduler
            patch: |
              apiVersion: batch/v1
              kind: CronJob
              metadata:
                name: descheduler
              spec:
                jobTemplate:
                  spec:
                    template:
                      spec:
                        containers:
                          - name: descheduler
                            volumeMounts:
                              - name: tmp
                                mountPath: /tmp
                        volumes:
                          - name: tmp
                            emptyDir: {}
