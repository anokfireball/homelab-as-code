apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: kyverno-system
spec:
  interval: 1m
  chart:
    spec:
      chart: kyverno
      version: 3.9.2
      sourceRef:
        kind: HelmRepository
        name: kyverno
        namespace: flux-system
  values:
    grafana:
      enabled: true
      annotations:
        grafana_dashboard_folder: kyverno
    features:
      policyExceptions:
        enabled: true
        namespace: kyverno-system
    # TODO once a third worker is available again
    # https://kyverno.io/docs/installation/methods/#high-availability-installation
    admissionController:
      # replicas: 3
      serviceMonitor: &service-monitor-config
        enabled: true
        additionalLabels:
          release: kube-prometheus-stack
    backgroundController:
      # replicas: 2
      serviceMonitor: *service-monitor-config
    cleanupController:
      # replicas: 2
      serviceMonitor: *service-monitor-config
    reportsController:
      # replicas: 2
      serviceMonitor: *service-monitor-config
      # audit-service-account-token lists (Cluster)RoleBindings during background scans
      rbac:
        clusterRole:
          extraResources:
            - apiGroups: [rbac.authorization.k8s.io]
              resources: [rolebindings, clusterrolebindings]
