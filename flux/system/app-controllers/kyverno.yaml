apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: kyverno-system
spec:
  interval: 1m
  chart:
    spec:
      chart: kyverno
      version: 3.10.0
      sourceRef:
        kind: HelmRepository
        name: kyverno
        namespace: flux-system
  values:
    grafana:
      enabled: true
      annotations:
        grafana_dashboard_folder: kyverno
    features:
      policyExceptions:
        enabled: true
        namespace: kyverno-system
    # Images pinned to the chart appVersion (v1.19.2) by index digest; the digests are the
    # ones the running pods report as imageID. The chart default registry reg.kyverno.io
    # serves the same digests as ghcr.io; ghcr.io is set explicitly so the refs resolve as written.
    crds:
      migration:
        image:
          registry: ghcr.io
          repository: kyverno/kyverno-cli
          tag: "v1.20.0@sha256:bd2b8b7c9d550ecf04e0bacaf351adce2f82ce67fd3f291075edcee7f8ab4ab4"
    webhooksCleanup:
      image:
        registry: ghcr.io
        repository: kyverno/readiness-checker
        tag: "v1.20.0@sha256:6079a30d75fe7ba868a5a7e5dfa71ee92a3a8bae97adcea1c8cfb1009280ee6c"
    test:
      image:
        registry: ghcr.io
        repository: kyverno/readiness-checker
        tag: "v1.20.0@sha256:6079a30d75fe7ba868a5a7e5dfa71ee92a3a8bae97adcea1c8cfb1009280ee6c"
    # TODO once a third worker is available again
    # https://kyverno.io/docs/installation/methods/#high-availability-installation
    admissionController:
      # replicas: 3
      container:
        image:
          registry: ghcr.io
          repository: kyverno/kyverno
          tag: "v1.20.0@sha256:9de49c5416ea536f00a205527197ac048abdf32c5a75d633cd9afff8928f359d"
      initContainer:
        image:
          registry: ghcr.io
          repository: kyverno/kyvernopre
          tag: "v1.20.0@sha256:339067e083430e0c97007541bef9cfdbac89bee13f7228772c77ae8aead14b8b"
      serviceMonitor: &service-monitor-config
        enabled: true
        additionalLabels:
          release: kube-prometheus-stack
    backgroundController:
      # replicas: 2
      image:
        registry: ghcr.io
        repository: kyverno/background-controller
        tag: "v1.20.0@sha256:c72df38320a48fc9de10f9d23d087a117853bb08207b7f60f6d1e8457fb3ddb7"
      serviceMonitor: *service-monitor-config
    cleanupController:
      # replicas: 2
      image:
        registry: ghcr.io
        repository: kyverno/cleanup-controller
        tag: "v1.20.0@sha256:0f9ce0c203561c52499e871a987ff987371f57385fcafe7af1a01dfd6db1feee"
      serviceMonitor: *service-monitor-config
    reportsController:
      # replicas: 2
      image:
        registry: ghcr.io
        repository: kyverno/reports-controller
        tag: "v1.20.0@sha256:f54e3cc106fadb1a615d0ec11c42f741f51d3580a5f70dfbe7bd7ec58864ef03"
      serviceMonitor: *service-monitor-config
      # audit-service-account-token lists (Cluster)RoleBindings during background scans
      rbac:
        clusterRole:
          extraResources:
            - apiGroups: [rbac.authorization.k8s.io]
              resources: [rolebindings, clusterrolebindings]
  # The chart has no pod-level securityContext or hostUsers knob. Container securityContexts
  # (non-root 65534, drop ALL, readOnlyRootFilesystem, allowPrivilegeEscalation false, seccomp)
  # already come from the chart. Pods run in a user namespace: UID/GID 65534 only, no
  # hostNetwork/hostPath/PVC/NFS, and the only volumes are emptyDir, projected and configMap/secret.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: kyverno-admission-controller
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: kyverno-admission-controller
              spec:
                template:
                  spec:
                    hostUsers: false
                    securityContext:
                      seccompProfile:
                        type: RuntimeDefault
          - target:
              kind: Deployment
              name: kyverno-background-controller
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: kyverno-background-controller
              spec:
                template:
                  spec:
                    hostUsers: false
                    securityContext:
                      seccompProfile:
                        type: RuntimeDefault
          - target:
              kind: Deployment
              name: kyverno-cleanup-controller
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: kyverno-cleanup-controller
              spec:
                template:
                  spec:
                    hostUsers: false
                    securityContext:
                      seccompProfile:
                        type: RuntimeDefault
          - target:
              kind: Deployment
              name: kyverno-reports-controller
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: kyverno-reports-controller
              spec:
                template:
                  spec:
                    hostUsers: false
                    securityContext:
                      seccompProfile:
                        type: RuntimeDefault
