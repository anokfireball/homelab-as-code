apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vertical-pod-autoscaler
  namespace: kube-system
spec:
  interval: 1m
  chart:
    spec:
      chart: vpa
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: fairwinds
        namespace: flux-system
  upgrade:
    # chart 5.0.0 ships updated VPA 1.7 CRDs (InPlace mode, CPU startup boost,
    # per-VPA config, status observedGeneration); Flux's default upgrade.crds
    # policy is "Skip", so replace them explicitly or the recommender's status
    # writes get pruned against the stale 1.6 CRDs
    crds: CreateReplace
  dependsOn:
    - name: metrics-server
      namespace: kube-system
  values:
    # only used for goldilocks right now, so only the recommender is needed
    recommender:
      enabled: true
      image:
        repository: registry.k8s.io/autoscaling/vpa-recommender
        tag: 1.8.0@sha256:e743e3a7e58a614f850063dba5df88eec5a19cf4cc43edb2050248df2d7dd8d3
    updater:
      enabled: false
    admissionController:
      enabled: false
    metrics-server:
      enabled: false
