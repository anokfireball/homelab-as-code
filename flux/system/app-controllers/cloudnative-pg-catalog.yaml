---
# Central source of truth for the CloudNativePG operand image per PostgreSQL
# major version. Clusters reference this catalog via spec.imageCatalogRef and
# no longer pin spec.imageName. Updating an entry here rolls out the new image
# to every Cluster on that major.
#
# Image versions are managed by Renovate (see renovate.json customManagers).
apiVersion: postgresql.cnpg.io/v1
kind: ClusterImageCatalog
metadata:
  name: postgresql
spec:
  images:
    - major: 15
      image: ghcr.io/cloudnative-pg/postgresql:15.19-standard-trixie@sha256:10c19625c4f43cd4f1cb04caf072a942853e10e510d96e9be656b3a7f0ad968a
    - major: 17
      image: ghcr.io/cloudnative-pg/postgresql:17.11-standard-trixie@sha256:0eea5ac8c5e3043db94f4d512ffcfb9c06d6270a97f6d56e9f08e1571ef0484e
    - major: 18
      image: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie@sha256:c2a773217853c6e0ffe7da9c37ea456466efb20cf844f27511a73fa6a81e3152
