---
# Central source of truth for the CloudNativePG operand image per PostgreSQL
# major version. Clusters reference this catalog via spec.imageCatalogRef and
# no longer pin spec.imageName. Updating an entry here rolls out the new image
# to every Cluster on that major.
#
# Image versions are managed by Renovate (see renovate.json customManagers).
apiVersion: postgresql.cnpg.io/v1
kind: ClusterImageCatalog
metadata:
  name: postgresql
spec:
  images:
    - major: 15
      image: ghcr.io/cloudnative-pg/postgresql:15.19-standard-trixie@sha256:fde348633fb229b8bece76f3dc8c8eaf0bf7ef8970b3e12e07def9d1109ca6bc
    - major: 17
      image: ghcr.io/cloudnative-pg/postgresql:17.11-standard-trixie@sha256:cdb10c72bf308a113e053478db05457b1322722f7bc69e03fe34c672b22e6bd4
    - major: 18
      image: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie@sha256:e5e820a9083134141caac23cad1d6affd39101a9fefe7bf6cc07738a3fa89452
