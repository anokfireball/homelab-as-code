---
# Central source of truth for the CloudNativePG operand image per PostgreSQL
# major version. Clusters reference this catalog via spec.imageCatalogRef and
# no longer pin spec.imageName. Updating an entry here rolls out the new image
# to every Cluster on that major.
#
# Image versions are managed by Renovate (see renovate.jsonc customManagers).
apiVersion: postgresql.cnpg.io/v1
kind: ClusterImageCatalog
metadata:
  name: postgresql
spec:
  images:
    - major: 15
      image: ghcr.io/cloudnative-pg/postgresql:15.19-standard-trixie@sha256:994fa6017fcdc88ce3f4a86bdc45ed719b78380f1e6c60f7cefea2679e63d6cc
    - major: 17
      image: ghcr.io/cloudnative-pg/postgresql:17.11-standard-trixie@sha256:4d0aac315c4d8c3202252bd06fea83b16951cc57234a7b610eeaa382ff4482d0
    - major: 18
      image: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie@sha256:5bf4a23aa13fb560903fba932676773ba4ba2729c162e587b09bf539a2e3df56
