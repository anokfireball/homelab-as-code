---
# Central source of truth for the CloudNativePG operand image per PostgreSQL
# major version. Clusters reference this catalog via spec.imageCatalogRef and
# no longer pin spec.imageName. Updating an entry here rolls out the new image
# to every Cluster on that major.
#
# Image versions are managed by Renovate (see renovate.jsonc customManagers).
apiVersion: postgresql.cnpg.io/v1
kind: ClusterImageCatalog
metadata:
  name: postgresql
spec:
  images:
    - major: 15
      image: ghcr.io/cloudnative-pg/postgresql:15.20-standard-trixie@sha256:7e3694d998aa0e87de065b53612cecd2e6d332e2bbb8ca2b54d3d2ac44197dbf
    - major: 17
      image: ghcr.io/cloudnative-pg/postgresql:17.12-standard-trixie@sha256:48478b54981de2a4f38d20ed1ef85fc9b3e1f3920aa16ed37ca6d2e78b6defd1
    - major: 18
      image: ghcr.io/cloudnative-pg/postgresql:18.7-standard-trixie@sha256:5827829071060876c4029650c04183e4ee562da3ebb9e88c914d67c8dc8669d6
