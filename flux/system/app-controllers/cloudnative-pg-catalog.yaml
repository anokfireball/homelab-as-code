---
# Central source of truth for the CloudNativePG operand image per PostgreSQL
# major version. Clusters reference this catalog via spec.imageCatalogRef and
# no longer pin spec.imageName. Updating an entry here rolls out the new image
# to every Cluster on that major.
#
# Image versions are managed by Renovate (see renovate.jsonc customManagers).
apiVersion: postgresql.cnpg.io/v1
kind: ClusterImageCatalog
metadata:
  name: postgresql
spec:
  images:
    - major: 15
      image: ghcr.io/cloudnative-pg/postgresql:15.20-standard-trixie@sha256:75f812674d86aa2ed05205f90f797f9e258b32a2866c50342821f169e4f0e716
    - major: 17
      image: ghcr.io/cloudnative-pg/postgresql:17.12-standard-trixie@sha256:2a2fe731f3b421d1a1c1f84e70e95ef0658bf198b6c8dbbfe53d51f24c3275b8
    - major: 18
      image: ghcr.io/cloudnative-pg/postgresql:18.7-standard-trixie@sha256:23719505c7cc417b043ffd9998b44ab8d57fec1d92f0bf11b231a1754a5962f2
