apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
  namespace: envoy-gateway-system
spec:
  interval: 1m
  chart:
    spec:
      chart: gateway-helm
      version: 1.10.0
      sourceRef:
        kind: HelmRepository
        name: envoy-gateway
        namespace: flux-system
  values:
    global:
      images:
        envoyGateway:
          # Pinned at the chart's appVersion. One value sets the controller, certgen Job and
          # shutdown-manager images. Renovate groups it with the chart (renovate.jsonc, group
          # "envoy-gateway"), so both always move in the same PR.
          image: docker.io/envoyproxy/gateway:v1.10.0@sha256:c2243d43518bed91d3ed8c2db849a4b7a14ac9b96eb019f2ab104bb1ca8572b1
    crds:
      enabled: false
    config:
      envoyGateway:
        gatewayAPI:
          enabled:
            - XListenerSet
        extensionApis:
          enableBackend: true
  install:
    crds: Skip
  upgrade:
    crds: Skip
  # Hook Jobs are patched below; postRenderStrategy combined (helm-controller's default) is pinned so they stay reachable.
  postRenderStrategy: combined
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: envoy-gateway
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: envoy-gateway
              spec:
                template:
                  spec:
                    hostUsers: false
                    volumes:
                      - name: tmp
                        emptyDir: {}
                    containers:
                      - name: envoy-gateway
                        volumeMounts:
                          - name: tmp
                            mountPath: /tmp
          - target:
              kind: Job
              name: envoy-gateway-gateway-helm-certgen
            patch: |
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: envoy-gateway-gateway-helm-certgen
              spec:
                template:
                  spec:
                    hostUsers: false
                    volumes:
                      - name: tmp
                        emptyDir: {}
                    containers:
                      - name: envoy-gateway-certgen
                        volumeMounts:
                          - name: tmp
                            mountPath: /tmp
