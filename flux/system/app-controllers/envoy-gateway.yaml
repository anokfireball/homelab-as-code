apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
  namespace: envoy-gateway-system
spec:
  interval: 1m
  chart:
    spec:
      chart: gateway-helm
      version: 1.9.3
      sourceRef:
        kind: HelmRepository
        name: envoy-gateway
        namespace: flux-system
  values:
    global:
      images:
        envoyGateway:
          # Pinned at chart appVersion v1.9.2. One value sets the controller, certgen Job and
          # shutdown-manager images. Renovate does not track it: move it with the chart version.
          image: docker.io/envoyproxy/gateway:v1.9.2@sha256:9d67017c442a70e6ae9f1a358e6c80eb653c67c2e40823d9a991e0daf37ba926
    crds:
      enabled: false
    config:
      envoyGateway:
        gatewayAPI:
          enabled:
            - XListenerSet
        extensionApis:
          enableBackend: true
  install:
    crds: Skip
  upgrade:
    crds: Skip
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: envoy-gateway
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: envoy-gateway
              spec:
                template:
                  spec:
                    hostUsers: false
                    volumes:
                      - name: tmp
                        emptyDir: {}
                    containers:
                      - name: envoy-gateway
                        volumeMounts:
                          - name: tmp
                            mountPath: /tmp
          - target:
              kind: Job
              name: envoy-gateway-gateway-helm-certgen
            patch: |
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: envoy-gateway-gateway-helm-certgen
              spec:
                template:
                  spec:
                    hostUsers: false
                    volumes:
                      - name: tmp
                        emptyDir: {}
                    containers:
                      - name: envoy-gateway-certgen
                        volumeMounts:
                          - name: tmp
                            mountPath: /tmp
