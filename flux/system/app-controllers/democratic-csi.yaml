apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: democratic-csi-ssd
  namespace: democratic-csi-system
spec:
  interval: 1m
  chart:
    spec:
      chart: democratic-csi
      version: 0.15.1
      sourceRef:
        kind: HelmRepository
        name: democratic-csi
        namespace: flux-system
  values:
    controller:
      externalAttacher:
        image:
          registry: registry.k8s.io/sig-storage/csi-attacher
          # renovate: datasource=docker depName=registry.k8s.io/sig-storage/csi-attacher
          tag: v4.4.0@sha256:dbded4ebe299973e31d0ef55815eb07a990fc67872b14900a8e69232acae4f2d
      externalProvisioner:
        image:
          registry: registry.k8s.io/sig-storage/csi-provisioner
          # renovate: datasource=docker depName=registry.k8s.io/sig-storage/csi-provisioner
          tag: v3.6.0@sha256:6de50bacfd72627ffe4209e3db8ad7391d04ea6fb741bf51feab6c5dcfd80002
      externalResizer:
        image:
          registry: registry.k8s.io/sig-storage/csi-resizer
          # renovate: datasource=docker depName=registry.k8s.io/sig-storage/csi-resizer
          tag: v1.9.0@sha256:f1f352df97874442624fcef23eab04aa038f66cb0e361212f6ec09e92998184d
      externalSnapshotter:
        image:
          registry: registry.k8s.io/sig-storage/csi-snapshotter
          # renovate: datasource=docker depName=registry.k8s.io/sig-storage/csi-snapshotter
          tag: v8.2.1@sha256:5f4bb469fec51147ce157329dab598c758da1b018bad6dad26f0ff469326d769
      driver:
        image:
          registry: ghcr.io/democratic-csi/democratic-csi
          # renovate: datasource=docker depName=ghcr.io/democratic-csi/democratic-csi
          tag: v1.9.5@sha256:fc3b7d7ed3a616714139525075312758e23a5d425ffb539ad12c9bd20fb6001f
    csiDriver:
      name: nas-ssd
      fsGroupPolicy: File
    storageClasses:
      - name: nas-scratch-ssd
        defaultClass: false
        reclaimPolicy: Delete
        volumeBindingMode: Immediate
        allowVolumeExpansion: true
        parameters:
          fsType: nfs
        mountOptions:
          - noatime
          - nfsvers=3
    driver:
      config:
        driver: freenas-nfs
        instance_id: null
        httpConnection:
          protocol: http
          host: 192.168.1.2
          port: 80
          username: ${FREENAS_USERNAME}
          password: ${FREENAS_PASSWORD}
          allowInsecure: true
        sshConnection:
          host: 192.168.1.2
          port: 22
          username: ${FREENAS_USERNAME}
          password: ${FREENAS_PASSWORD}
        zfs:
          datasetParentName: scratch/k8s
          detachedSnapshotsDatasetParentName: scratch/snaps
          datasetEnableQuotas: true
          datasetEnableReservation: false
          datasetPermissionsMode: "0777"
          datasetPermissionsUser: 0
          datasetPermissionsGroup: 0
        nfs:
          shareHost: 192.168.1.2
          shareAlldirs: false
          shareMaprootUser: root
          shareMaprootGroup: wheel
  # The chart has no securityContext, hostUsers or readOnlyRootFilesystem knobs for the controller containers.
  # Root stays inside the user namespace (D2=yes, D4): the controller pod has no PVC, NFS, hostPath or node access.
  # csi-proxy is pinned here, not via csiProxy.image, which the node DaemonSet also renders.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: democratic-csi-ssd-controller
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: democratic-csi-ssd-controller
              spec:
                template:
                  spec:
                    hostUsers: false
                    securityContext:
                      seccompProfile:
                        type: RuntimeDefault
                    containers:
                      - name: external-attacher
                        securityContext:
                          allowPrivilegeEscalation: false
                          readOnlyRootFilesystem: true
                          capabilities:
                            drop: ["ALL"]
                        volumeMounts:
                          - name: tmp
                            mountPath: /tmp
                      - name: external-provisioner
                        securityContext:
                          allowPrivilegeEscalation: false
                          readOnlyRootFilesystem: true
                          capabilities:
                            drop: ["ALL"]
                        volumeMounts:
                          - name: tmp
                            mountPath: /tmp
                      - name: external-resizer
                        securityContext:
                          allowPrivilegeEscalation: false
                          readOnlyRootFilesystem: true
                          capabilities:
                            drop: ["ALL"]
                        volumeMounts:
                          - name: tmp
                            mountPath: /tmp
                      - name: external-snapshotter
                        securityContext:
                          allowPrivilegeEscalation: false
                          readOnlyRootFilesystem: true
                          capabilities:
                            drop: ["ALL"]
                        volumeMounts:
                          - name: tmp
                            mountPath: /tmp
                      - name: csi-driver
                        securityContext:
                          allowPrivilegeEscalation: false
                          readOnlyRootFilesystem: true
                          capabilities:
                            drop: ["ALL"]
                        volumeMounts:
                          - name: tmp
                            mountPath: /tmp
                      - name: csi-proxy
                        # renovate: datasource=docker depName=ghcr.io/democratic-csi/csi-grpc-proxy
                        image: ghcr.io/democratic-csi/csi-grpc-proxy:v0.5.7@sha256:0240d0fba3cedd598036766b1865e88aa2eac9c16822df03d5d912a81128ebb6
                        securityContext:
                          allowPrivilegeEscalation: false
                          readOnlyRootFilesystem: true
                          capabilities:
                            drop: ["ALL"]
                        volumeMounts:
                          - name: tmp
                            mountPath: /tmp
                    volumes:
                      - name: tmp
                        emptyDir: {}
---
