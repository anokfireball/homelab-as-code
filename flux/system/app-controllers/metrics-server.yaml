apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metrics-server
  namespace: kube-system
spec:
  interval: 1m
  chart:
    spec:
      chart: metrics-server
      version: 3.14.0
      sourceRef:
        kind: HelmRepository
        name: metrics-server
        namespace: flux-system
  values:
    # TODO set up certificates properly with IP SANs
    # https://kubernetes.io/docs/setup/production-environment/tools/kubeadm/troubleshooting-kubeadm/#cannot-use-the-metrics-server-securely-in-a-kubeadm-cluster
    args:
      - --kubelet-insecure-tls
    image:
      repository: registry.k8s.io/metrics-server/metrics-server
      tag: v0.9.1@sha256:9b0ba1926e1d3089673f45461c3c1416109dea33b3ba3434048defd380df329b
    hostUsers: false
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      runAsGroup: 1000
