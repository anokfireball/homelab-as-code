apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: renovate
  namespace: renovate-system
spec:
  interval: 1m
  chart:
    spec:
      chart: renovate
      version: 46.381.11
      sourceRef:
        kind: HelmRepository
        name: renovate
        namespace: flux-system
  values:
    image:
      registry: ghcr.io
      repository: renovatebot/renovate
      tag: 44.181.7@sha256:4f5a2621afd6629fda621e5c66221d1000f0ef3330ec14c828d7e8d357f03522
    cronjob:
      schedule: "51 0/6 * * *"
      annotations:
        healthcheckSecret: renovate-config
        healthcheckImage: ghcr.io/anokfireball/base-image:3.24.3@sha256:3afac981717ee329d4efe0d907f84f1a47daedb1d58cae70e74a40fe8d733d3c
    renovate:
      existingConfigFile: /config/config.json
    extraVolumes:
      - name: &volume-name renovate-config
        secret:
          secretName: renovate-config
    extraVolumeMounts:
      - name: *volume-name
        mountPath: /config
    envList:
      - name: LOG_LEVEL
        value: debug
      - name: RENOVATE_TOKEN
        valueFrom:
          secretKeyRef:
            name: renovate-github-token
            key: RENOVATE_TOKEN
  # The chart has no hostUsers or automountServiceAccountToken values; 12021:0 is the image's own user.
  # The root filesystem stays writable: tools installed at runtime (binarySource=install) go to
  # /opt/containerbase next to the shipped git and docker (see kyverno-exceptions.yaml).
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: CronJob
              name: renovate
            patch: |
              apiVersion: batch/v1
              kind: CronJob
              metadata:
                name: renovate
              spec:
                jobTemplate:
                  spec:
                    template:
                      spec:
                        hostUsers: false
                        automountServiceAccountToken: false
                        securityContext:
                          runAsNonRoot: true
                          runAsUser: 12021
                          runAsGroup: 0
                          seccompProfile:
                            type: RuntimeDefault
                        containers:
                          - name: renovate
                            securityContext:
                              allowPrivilegeEscalation: false
                              capabilities:
                                drop: ["ALL"]
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: renovate-github-token-refresher
  namespace: renovate-system
spec:
  interval: 1m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    global:
      alwaysAppendIdentifierToResourceName: true
    defaultPodOptions:
      automountServiceAccountToken: true
      hostUsers: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
    controllers:
      main:
        type: cronjob
        cronjob:
          schedule: "*/45 * * * *"
          concurrencyPolicy: Replace
        serviceAccount:
          identifier: renovate-github-token-refresher
        annotations:
          healthcheckSecret: renovate-github-token-secrets
          healthcheckImage: ghcr.io/anokfireball/base-image:3.24.3@sha256:3afac981717ee329d4efe0d907f84f1a47daedb1d58cae70e74a40fe8d733d3c
        containers:
          main:
            image:
              repository: ghcr.io/anokfireball/base-image
              tag: 3.24.3@sha256:3afac981717ee329d4efe0d907f84f1a47daedb1d58cae70e74a40fe8d733d3c
            envFrom:
              - secret: renovate-github-token-secrets
            command: ["/bin/bash", "/scripts/token.sh"]
            args: ["$(CLIENT_ID)", "/key/private-key.pem", "$(INSTALLATION_ID)"]
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    serviceAccount:
      renovate-github-token-refresher:
        enabled: true
    rbac:
      roles:
        config-patcher:
          enabled: true
          type: Role
          rules:
            - apiGroups: [""]
              resources: ["secrets"]
              resourceNames: ["renovate-github-token"]
              verbs: ["get", "create", "patch"]
      bindings:
        renovate-github-token-refresher:
          enabled: true
          type: RoleBinding
          roleRef:
            name: renovate-github-token-refresher-config-patcher
            kind: Role
          subjects:
            - kind: ServiceAccount
              name: renovate-github-token-refresher
              namespace: renovate-system
    configMaps:
      scripts:
        data:
          # https://docs.github.com/en/apps/creating-github-apps/authenticating-with-a-github-app/generating-an-installation-access-token-for-a-github-app
          token.sh: |
            #!/usr/bin/env bash
            set -o pipefail

            CLIENT_ID=$1
            PEM_PATH=$2
            INSTALLATION_ID=$3


            NOW=$(date +%s)
            IAT=$(($NOW - 60))  # Issues 60 seconds in the past
            EXP=$(($NOW + 300)) # Expires 5 minutes in the future

            b64enc() { openssl base64 | tr -d '=' | tr '/+' '_-' | tr -d '\n'; }

            HEADER_JSON='{
                "typ":"JWT",
                "alg":"RS256"
            }'
            # Header encode
            HEADER=$(echo -n "$HEADER_JSON" | b64enc)

            PAYLOAD_JSON="{
                \"iat\":$IAT,
                \"exp\":$EXP,
                \"iss\":\"$CLIENT_ID\"
            }"
            # Payload encode
            PAYLOAD=$(echo -n "$PAYLOAD_JSON" | b64enc)

            # Signature
            PEM=$(cat "$PEM_PATH")
            HEADER_PAYLOAD="$HEADER"."$PAYLOAD"
            SIGNATURE=$(
                openssl dgst -sha256 -sign <(echo -n "$PEM") \
                <(echo -n "$HEADER_PAYLOAD") | b64enc
            )

            # Create JWT
            JWT="$HEADER_PAYLOAD"."$SIGNATURE"

            TOKEN_JSON=$(curl --request POST \
              --url "https://api.github.com/app/installations/$INSTALLATION_ID/access_tokens" \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $JWT" \
              --header "X-GitHub-Api-Version: 2022-11-28")
            TOKEN=$(echo "$TOKEN_JSON" | jq -r '.token')
            if [ -z "$TOKEN" ]; then
              echo "ERROR: Failed to retrieve token from GitHub API."
              exit 1
            fi

            TOKEN_ENCODED=$(echo -n "$TOKEN" | base64 | tr -d '\n')

            if kubectl get secret renovate-github-token -n renovate-system >/dev/null 2>&1; then
              echo "Secret exists, patching..."
              PATCH=$(printf '[{"op": "replace", "path": "/data/RENOVATE_TOKEN", "value":"%s"}]' "$TOKEN_ENCODED")
              kubectl patch secret renovate-github-token -n renovate-system --type='json' -p="$PATCH" || { echo "Patch failed!"; exit 1; }
            else
              echo "Secret does not exist, creating..."
              kubectl create secret generic renovate-github-token -n renovate-system --from-literal=RENOVATE_TOKEN="$TOKEN" || { echo "Create failed!"; exit 1; }
            fi
    persistence:
      scripts:
        type: configMap
        name: renovate-github-token-refresher-scripts
      key:
        type: secret
        name: renovate-github-token-key
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
